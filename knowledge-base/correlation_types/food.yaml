recording_behavior:
  reviewed_on: '2026-10-14'
  shape: A grouped object with explicit nutritional sample membership, not a cumulative quantity.
  cadence: Source-specific food logging and synchronization; no automatic continuous measurement cadence.
  context: Recorded timestamps can differ from ingestion time. Workout or sleep overlap does not establish
    a physiological effect.
  coverage: Missing observations are unknown, not zero intake or complete capture.
  aggregation: Query food objects as groups. Sum only compatible component quantities; timestamp coincidence
    never establishes membership.
  references:
  - title: 'Apple: Food correlation'
    url: https://developer.apple.com/documentation/healthkit/hkcorrelationtypeidentifier/food
  - title: 'Apple: HKCorrelation'
    url: https://developer.apple.com/documentation/healthkit/hkcorrelation
  metadata: Optional food-description and user-entered metadata provide context only when present. Missing
    metadata does not prove automatic sensing or complete logging.
