description: |
  ## Overview

  HKCorrelationTypeIdentifierFood is a correlation type that groups together multiple nutritional
  quantity samples from a single food item or meal. Unlike entering individual nutrients separately,
  the Food correlation maintains the relationship between nutrients that came from the same food
  source, preserving meal-level context.

  A Food correlation can contain any combination of the 80+ dietary quantity types supported by
  HealthKit, including:

  - **Macronutrients**: Energy, carbohydrates, protein, fats (total, saturated, mono/polyunsaturated)
  - **Micronutrients**: Vitamins (A, B-complex, C, D, E, K), minerals (calcium, iron, zinc, etc.)
  - **Other components**: Fiber, cholesterol, sodium, water, caffeine, sugars

  Apps typically populate correlations from food database lookups, barcode scanning, or recipe
  calculations.

  ## Health Significance

  Nutritional tracking has broad applications in health management:

  - **Weight management**: Caloric intake tracking is fundamental to weight loss, gain, or
    maintenance programs. Understanding the relationship between intake and energy expenditure
    enables informed dietary decisions.

  - **Chronic disease management**:
    - **Diabetes**: Carbohydrate counting for insulin dosing and blood sugar management
    - **Cardiovascular disease**: Sodium, saturated fat, and cholesterol monitoring
    - **Kidney disease**: Protein, potassium, phosphorus, and sodium tracking
    - **Hypertension**: Sodium and potassium intake (DASH diet adherence)

  - **Nutritional deficiencies**: Tracking micronutrient intake helps identify potential deficiencies
    before clinical symptoms appear

  - **Athletic performance**: Macronutrient timing and ratios affect training adaptation and recovery

  - **Eating disorder treatment**: Structured meal tracking can support recovery under clinical
    supervision

  - **Food allergies/intolerances**: Logging what was eaten helps identify patterns in symptom triggers

  ## Clinical Interpretation

  When reviewing Food correlation data, clinicians should consider:

  - **Data completeness**: Most users don't log all foods consistently. Missing meals are common,
    especially snacks and beverages. Consider logged data as a sample, not complete record.

  - **Accuracy limitations**: Portion size estimation is notoriously inaccurate. Users typically
    underestimate portions by 20-50%. Database entries may not match actual foods consumed.

  - **Pattern recognition**: Look beyond single days to weekly or monthly patterns:
    - Total caloric trends
    - Macronutrient distribution
    - Sodium spikes (restaurant meals)
    - Fiber adequacy
    - Micronutrient gaps

  - **Meal timing**: The timestamp indicates when the food was logged (or consumed, if backdated).
    Meal timing patterns can reveal eating behaviors relevant to metabolic health.

  - **Correlation context**: The food name/description is stored in metadata, providing context for
    the nutritional values. Review this for dietary quality assessment beyond just numbers.

  - **Behavioral insights**: Consider:
    - Weekend vs. weekday patterns
    - Stress or emotional eating indicators
    - Social eating occasions
    - Consistency of meal frequency

  ## Caveats & Limitations

  - **Logging burden**: Consistent food logging requires significant user effort. Compliance typically
    drops over time or during busy periods.

  - **Database accuracy**: Nutritional databases contain errors. Restaurant and packaged food data
    may not match actual products. Home-cooked meals require estimation.

  - **Portion estimation**: Users consistently misjudge portions. Even with visual aids, portion
    accuracy is limited.

  - **Selective logging**: Users may avoid logging "bad" foods or underreport in general, especially
    if they feel judged. This introduces systematic bias.

  - **Variable components**: Not all nutrients need to be included in a correlation. Some apps only
    log macros; others include comprehensive micronutrients. Data completeness varies by source app.

  - **No standardized food name**: While there's metadata for food description, there's no
    standardized food identifier system. The same food from different apps won't be recognized as
    identical.

  - **Meal vs. food item**: Some apps log individual ingredients; others log composite meals.
    Aggregation approaches differ, affecting how data should be interpreted.

  - **Not real-time**: Unlike activity data, food logging is always retrospective and manual,
    introducing delays and potential recall errors.

  - **Eating disorder risk**: For some individuals, detailed food logging can trigger or exacerbate
    disordered eating behaviors. Clinical judgment is needed about appropriateness.
