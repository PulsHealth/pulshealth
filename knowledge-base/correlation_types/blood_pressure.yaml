description: |
  ## Overview

  HKCorrelationTypeIdentifierBloodPressure is a correlation type that groups together systolic and
  diastolic blood pressure measurements taken at the same moment. Unlike simple quantity types, a
  correlation contains multiple related samples that should be interpreted together. Each blood
  pressure correlation contains exactly two quantity samples:

  1. **HKQuantityTypeIdentifierBloodPressureSystolic** - The higher number, measured when the heart
     contracts
  2. **HKQuantityTypeIdentifierBloodPressureDiastolic** - The lower number, measured when the heart
     relaxes between beats

  The correlation ensures these paired values share the same timestamp and metadata, maintaining the
  clinical integrity of the measurement.

  ## Health Significance

  Blood pressure is one of the most important vital signs and a primary indicator of cardiovascular
  health:

  - **Cardiovascular risk**: Hypertension is a leading risk factor for heart attack, stroke, heart
    failure, kidney disease, and vascular dementia

  - **Silent condition**: High blood pressure typically has no symptoms until serious damage occurs,
    making regular monitoring essential

  - **Modifiable risk factor**: Unlike age or genetics, blood pressure can be improved through
    lifestyle changes and medication

  - **Treatment monitoring**: Patients on antihypertensive medications need regular BP tracking to
    assess treatment effectiveness

  - **White coat effect**: Home blood pressure monitoring captures readings in a relaxed environment,
    often revealing different patterns than clinical measurements

  - **Masked hypertension**: Some patients have normal office readings but elevated home readings,
    which home monitoring can detect

  ## Clinical Interpretation

  When reviewing blood pressure correlation data, clinicians should consider:

  - **Both values matter**: While systolic pressure often receives more attention (especially in older
    adults), diastolic pressure is also clinically significant, particularly in younger patients.

  - **Measurement conditions**: Valid readings require:
    - 5 minutes of rest before measurement
    - Seated with back supported, feet flat on floor
    - Arm at heart level
    - Empty bladder
    - No caffeine, exercise, or smoking for 30 minutes prior

  - **Pattern recognition**: Look for:
    - Sustained elevation (vs. occasional spikes)
    - Morning hypertension (cardiovascular risk marker)
    - Nocturnal patterns (if available from 24-hour monitoring)
    - Response to medications

  - **Pulse pressure**: The difference between systolic and diastolic (e.g., 120-80 = 40 mmHg). Wide
    pulse pressure (>60) may indicate arterial stiffness; narrow pulse pressure may indicate low
    cardiac output.

  - **Variability**: Significant variation between readings may itself be a cardiovascular risk factor

  - **Context from metadata**: Check device source, body position, and any user notes

  ## Caveats & Limitations

  - **Measurement quality varies**: Consumer devices vary in accuracy. FDA-cleared monitors validated
    against reference standards are preferred. Wrist monitors are generally less accurate than upper
    arm cuffs.

  - **User technique**: Even good devices produce inaccurate readings with improper cuff size, arm
    position, or insufficient rest period

  - **Single readings insufficient**: Clinical decisions should be based on multiple readings over
    time, not individual measurements

  - **Incomplete context**: HealthKit captures the numbers but not always the measurement conditions.
    Metadata may or may not include body position, arm used, or cuff size.

  - **No continuous monitoring**: Unlike heart rate, blood pressure requires active measurement.
    Patterns between measurements are not captured.

  - **Arrhythmia interference**: Atrial fibrillation and other arrhythmias can cause inaccurate
    oscillometric BP readings

  - **Correlation structure**: Apps must properly handle the correlation type - reading the component
    samples rather than treating it as a simple value. Some apps may not correctly display or export
    correlated data.

  - **No Apple Watch native measurement**: As of 2025, Apple Watch cannot measure blood pressure
    directly. Any BP data from Apple Watch is manually entered.
