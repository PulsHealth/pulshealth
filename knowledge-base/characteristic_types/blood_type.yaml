description: |
  ## Overview

  HKCharacteristicTypeIdentifierBloodType stores the user's ABO blood type and Rh factor as configured
  in their Health app profile. This read-only characteristic includes all eight common blood types
  (A+, A-, B+, B-, AB+, AB-, O+, O-) plus a "not set" state. The value can only be modified by the
  user through the Health app settings.

  ## Health Significance

  Blood type is a critical piece of medical information with several important applications:

  - **Emergency transfusion**: In emergencies, knowing blood type can expedite safe transfusion
    decisions. Universal donor (O-) blood is used when type is unknown, but matched blood is preferred.

  - **Surgical preparation**: Pre-operative blood typing ensures compatible blood products are available

  - **Pregnancy management**: Rh-negative mothers carrying Rh-positive fetuses require RhoGAM to
    prevent hemolytic disease of the newborn

  - **Organ transplantation**: ABO compatibility is a primary factor in organ matching

  - **Disease associations**: Research has identified associations between blood type and risk for
    certain conditions:
    - Type O: Lower risk of heart disease, higher risk of bleeding disorders
    - Type A: Higher risk of certain cancers, COVID-19 severity
    - Type AB: Higher risk of cognitive impairment
    - Rh-negative: Potential pregnancy complications

  ## Clinical Interpretation

  When reviewing blood type data, clinicians should consider:

  - **Verification required**: Self-reported blood type should always be verified through laboratory
    testing before transfusion or other critical medical decisions. This data is informational only.

  - **Population distribution**: Blood type frequencies vary by ethnicity:
    - O+: ~37% (most common worldwide)
    - A+: ~36%
    - B+: ~8%
    - O-: ~7%
    - A-: ~6%
    - AB+: ~3%
    - B-: ~2%
    - AB-: ~1% (rarest)

  - **Emergency medical ID**: Having blood type readily accessible on a phone can be useful in
    emergencies, though medical teams will still verify before transfusion

  - **Pregnancy counseling**: Rh-negative women should be identified early in pregnancy for appropriate
    RhoGAM prophylaxis

  ## Caveats & Limitations

  - **Self-reported data**: Users enter their blood type manually based on their understanding or
    memory. This may be incorrect, outdated, or confused with a family member's type.

  - **Not clinically verified**: HealthKit does not validate blood type entries against laboratory
    results. Never use this data for transfusion decisions without proper testing.

  - **Read-only**: Apps cannot set or modify blood type - this is a user-controlled health detail.
    Even clinical apps must rely on the user to update this information.

  - **Static characteristic**: Blood type doesn't change over a lifetime (with rare exceptions like
    bone marrow transplant), so there's no historical tracking.

  - **Subtype limitations**: The ABO/Rh system is simplified. Clinically important subtypes (weak D,
    Bombay phenotype) and other blood group systems (Kell, Duffy, etc.) are not represented.

  - **May not be set**: Many users don't know their blood type and leave this field empty. Apps
    should handle the notSet case gracefully.

  - **Privacy implications**: Blood type is considered sensitive health information and could
    theoretically be used for identification purposes.
