description: |
  ## What does this field represent?

  Biological Sex is the value a user has entered in their Health profile. HealthKit exposes it as a read-only characteristic through `HKHealthStore.biologicalSex()`. It is a current profile value, not a laboratory result or timestamped measurement.

  ## What do the values mean?

  | Raw value | HealthKit label | Meaning |
  | --- | --- | --- |
  | 0 | `notSet` | Unavailable to the app: unset or read access denied |
  | 1 | `female` | Female |
  | 2 | `male` | Male |
  | 3 | `other` | Otherwise not categorized as male or female |

  `notSet` does not mean `other`. The app also cannot distinguish an unset field from denied read permission using this result alone. The labels are categories, so sums, means and numerical outlier rules do not apply.

  ## What should an app avoid assuming?

  This field does not separately document chromosomes, hormone levels, anatomy, gender identity or treatment history. A selected label cannot establish all of those details. If a calculation requires information beyond the profile category, that information needs its own source and an explicit method.

  The characteristic can be corrected by the user. HealthKit's direct getter returns the current value; it does not provide a timeline of past selections. Applying today's selection to every historical measurement would therefore be an additional assumption.

  ## Is the PulsHealth profile field the same source?

  PulsHealth can store a current biological-sex field supplied through app profile settings. This is separate from automatic syncing of HealthKit sample types. A stored profile value does not by itself prove that it came from this HealthKit characteristic, and a profile update does not create a dated HealthKit sample.

  When reviewing user data, retain that distinction between a current account setting, the source's Health profile and any measurement-specific context. No private profile selection is shown in this article.

  ## Which related information is useful?

  [Date of Birth](/knowledge-base/types/HKCharacteristicTypeIdentifierDateOfBirth/) is another current profile characteristic, with its own missing-data and historical-context limitations. [Body Fat Percentage](/knowledge-base/types/HKQuantityTypeIdentifierBodyFatPercentage/) is a separate measurement: its interpretation needs the measurement method and appropriate reference information, rather than a conclusion inferred from this single profile label.
