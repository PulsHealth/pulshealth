description: |
  ## Overview

  HKCharacteristicTypeIdentifierActivityMoveMode determines how the red Move ring in Apple's Activity
  tracking system measures daily activity goals. By default, the Move ring tracks Active Energy Burned
  (calories), but users can switch to Apple Move Time mode, which tracks minutes of brisk activity
  instead. This characteristic was introduced to better accommodate users for whom calorie-based goals
  may be inappropriate, confusing, or potentially harmful.

  ## Health Significance

  The choice of activity tracking mode has implications for health motivation and behavior:

  - **Eating disorder considerations**: Calorie-focused tracking can be triggering for individuals with
    eating disorders or disordered eating patterns. Move Time mode removes visible calorie counts from
    the primary Activity display.

  - **Simplicity for some populations**: Older adults, children (Apple Watch SE Family Setup), and
    users unfamiliar with calorie concepts may find minutes-based goals more intuitive and actionable.

  - **Activity focus**: Move Time emphasizes movement duration rather than energy expenditure, which
    may better align with exercise guidelines (e.g., 150 minutes/week of moderate activity).

  - **Condition-specific needs**: Users with conditions affecting metabolism (thyroid disorders,
    certain medications) may find calorie estimates unreliable, making time-based goals more meaningful.

  - **Consistency**: Time-based goals are less affected by variables like body composition,
    environmental temperature, or algorithmic estimation errors.

  ## Clinical Interpretation

  When reviewing activity data, clinicians should understand:

  - **Mode affects presentation**: The primary Move metric shown to the user depends on this setting.
    Verify which mode the patient is using when discussing activity goals.

  - **Both metrics still tracked**: Regardless of display mode, HealthKit still records both Active
    Energy Burned and Apple Exercise Time. Apps with appropriate permissions can access both.

  - **Goal translation**: Active Energy goals (e.g., 500 kcal) don't directly translate to Move Time
    goals (e.g., 30 minutes). The appropriate goal depends on the user's fitness level and objectives.

  - **Clinical recommendations**: Consider recommending Move Time mode for:
    - Patients with history of eating disorders
    - Patients who express anxiety about calorie counting
    - Older adults or those new to fitness tracking
    - Pediatric patients using Family Setup
    - Patients focused on meeting exercise duration guidelines

  - **Calorie mode benefits**: Active Energy mode may be preferable for:
    - Weight management programs where energy balance is central
    - Users who understand and are motivated by calorie metrics
    - Athletic training where energy expenditure monitoring is relevant

  ## Caveats & Limitations

  - **Read-only access**: Apps cannot change this setting - only the user can modify it through Apple
    Watch or the paired iPhone's Watch app.

  - **Apple ecosystem specific**: This characteristic only affects Apple's Activity ring display.
    Third-party apps may present activity data differently regardless of this setting.

  - **Not a complete solution**: While Move Time mode removes calories from the Activity rings,
    calorie data is still visible elsewhere in Health app and may be shown by third-party apps.

  - **Goal adjustment needed**: When switching modes, users need to set new appropriate goals. The
    previous calorie goal doesn't automatically convert to a time goal.

  - **Limited clinical awareness**: Many clinicians may not know this option exists or understand how
    to guide patients in selecting the appropriate mode.

  - **Move Time definition**: Apple Move Time counts minutes where activity exceeds a brisk walk
    threshold. The exact algorithm and intensity threshold aren't publicly documented.

  - **Newer feature**: Introduced in 2020, this feature may not be familiar to long-term Apple Watch
    users who set up their devices before it was available.
