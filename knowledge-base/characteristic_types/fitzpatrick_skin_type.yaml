  - value: 1
    name: "I"
    description: "Very fair skin, always burns, never tans. Light eyes, blond or red hair. High sensitivity to UV."
  - value: 2
    name: "II"
    description: "Fair skin, usually burns, tans minimally. Light eyes, blond or light brown hair. High sensitivity to UV."
  - value: 3
    name: "III"
    description: "Medium skin, sometimes mild burn, tans uniformly. Any eye or hair color. Moderate sensitivity to UV."
  - value: 4
    name: "IV"
    description: "Olive skin, rarely burns, tans easily. Dark eyes, dark hair. Low sensitivity to UV."
  - value: 5
    name: "V"
    description: "Brown skin, very rarely burns, tans very easily. Dark eyes, dark hair. Very low sensitivity to UV."
  - value: 6
    name: "VI"
    description: "Dark brown to black skin, never burns, deeply pigmented. Dark eyes, dark hair. Least sensitivity to UV."
