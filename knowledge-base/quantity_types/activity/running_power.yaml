    relationship: "Stride length affects power production; optimal stride length minimizes power at a given speed"
  - identifier: "HKQuantityTypeIdentifierRunningVerticalOscillation"
    relationship: "Excessive vertical oscillation wastes power; lower oscillation generally means more efficient running"
  - identifier: "HKQuantityTypeIdentifierRunningGroundContactTime"
    relationship: "Ground contact time affects power transfer efficiency during each stride"
  - identifier: "HKQuantityTypeIdentifierHeartRate"
    relationship: "Comparing heart rate to power reveals aerobic efficiency and cardiovascular drift"
  - identifier: "HKQuantityTypeIdentifierActiveEnergyBurned"
    relationship: "Power over time equals mechanical work; metabolic energy burned is related but includes efficiency losses"
  - identifier: "HKQuantityTypeIdentifierVO2Max"
    relationship: "Higher VO2 max generally enables sustaining higher power outputs"
