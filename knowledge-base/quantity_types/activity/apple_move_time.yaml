description: '## What is Apple Move Time?


  Apple Move Time counts full minutes of detected active, full-body movement. It supports a **Move ring measured
  in minutes** for younger users. It is distinct from calories, exercise minutes and the hourly wheelchair Roll
  ring.


  [Apple documents](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/applemovetime)
  automatic minute-based Move tracking below age 13, a choice between minutes and active calories from 13 to 18,
  and active-calorie tracking above 18. These describe the documented Move-mode rules, rather than a universal activity
  recommendation.


  | Metric | Meaning | Unit |

  |---|---|---|

  | Apple Move Time | Full active movement minutes | min |

  | Active Energy Burned | Estimated energy above resting expenditure | kcal |

  | Apple Exercise Time | Minutes credited as exercise | min |

  | Stand or Roll ring | Hours meeting a movement criterion | hours |


  ## Why might Move Time be missing?


  The database investigation found **no raw Apple Move Time records or associated daily aggregates** in the selected
  reporting year. The 365 stored Activity summaries used Move-mode code 0, and their Move-time fields were unpopulated.
  These are not zero-minute observations and do not show that no movement occurred.


  Check the recorded Move mode before interpreting a missing quantity. Permission, syncing coverage and device setup
  also affect availability. The example cannot establish a value range, recording cadence or relationship to activity for this type; no empirical figure is supplied.


  ## How should movement minutes be added up?


  A raw quantity is a cumulative amount over a recorded interval. Inspect its boundaries and source before making
  daily totals. Keep minutes separate from calories: there is no fixed conversion between the two.


  [Activity Summary](https://developer.apple.com/documentation/healthkit/hkactivitysummary/applemovetime) stores
  the daily Move-time total separately. Summing raw sources can double-count overlapping estimates, and assigning
  an entire interval to its start day may disagree with the recorded daily calendar. Prefer the stored summary for
  a ring question and retain source-specific raw intervals for a recording question.


  ## What makes a useful trend or comparison?


  Compare periods with the same Move mode and similar recording coverage. A mode change from minutes to calories
  changes the metric, so a numeric before-and-after comparison is meaningless without units. Compare [Exercise Time](/knowledge-base/types/HKQuantityTypeIdentifierAppleExerciseTime/)
  as a separate measure rather than assuming every moving minute qualifies as exercise.


  There is no measured range in this example and no supported universal daily target in this entry. Missing records
  should remain missing. Movement-minute data alone cannot classify fitness, diagnose inactivity or measure the
  intensity of a workout.

  '
