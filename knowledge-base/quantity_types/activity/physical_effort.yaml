  limitations: Observational estimates, not population ranges or validated metabolic measurements. Largest-source
    focus examples weight intervals equally; temporal overlap is not explicit workout linkage. Sleep evidence is
    sparse (43 intervals, eight days), with long intervals. Reporting-day relationships are source-specific, confounded
    and noncausal. Missing records are not zero.
