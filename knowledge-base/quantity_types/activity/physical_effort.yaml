# HEALTHKIT DATA TYPE: Physical Effort
# ============================================

# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierPhysicalEffort"
source: "HealthKit"
type: "HKQuantityType"
category: "Activity"
human_readable_name: "Physical Effort"
short_description: "Measures the perceived intensity of physical activity on a standardized effort scale."

# --- APPLE HEALTH UI ---
