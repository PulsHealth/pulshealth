color: "#FF9500"

# --- UNITS & MEASUREMENT ---
default_unit: "kcal/(kg*hr)"
supported_units:
  - "kcal/(kg*hr)"
unit_description: "Physical effort is measured in kilocalories per kilogram of body weight per hour, representing the metabolic rate during activity. This unit aligns with MET (Metabolic Equivalent of Task) concepts, where 1 MET equals approximately 1 kcal/kg/hr at rest."

# --- STATISTICS ---
