research_notes: |
  - iOS 17.0/watchOS 10.0 introduction confirmed via Apple Developer Documentation
  - Physical Effort introduced at WWDC 2023
  - Unit (kcal/kg/hr) aligns with MET concepts but is Apple's proprietary calculation
  - Uses machine learning combining motion, heart rate, and activity context
  - Designed to provide consistent intensity comparison across activity types
  - Limited independent validation research available given recent introduction
  - Complements rather than replaces traditional intensity metrics (HR zones, RPE)
