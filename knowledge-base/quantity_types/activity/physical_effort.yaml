    vigorous: "6.0-9.0 (jogging, swimming)"
    high_intensity: ">9.0 (running, intense sports)"
  - population: "Workout Intensity Zones"
    recovery: "1.0-3.0"
    aerobic: "3.0-6.0"
    tempo: "6.0-8.0"
    threshold: "8.0-10.0"
    anaerobic: ">10.0"

