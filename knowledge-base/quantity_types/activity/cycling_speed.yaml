description: '## What does cycling speed measure?


  Cycling speed describes how fast you travel while riding. HealthKit treats it as a discrete distance-per-time
  quantity; PulsHealth stores meters per second. Multiply m/s by 3.6 to display km/h, or by about 2.237 to display
  mph.


  | Value | Interpretation |

  |---|---|

  | Raw speed sample | A speed value over its recorded interval |

  | Daily average bucket | A summary calculated by HealthKit |

  | Null daily bucket | No value in that summary bucket |

  | Recorded zero | A speed observation of zero |


  ## Where can speed data come from?


  Apple documents automatic collection from cycling peripherals connected to Apple Watch. A GPS-derived workout
  average, a wheel-sensor stream and an indoor platform''s virtual speed can describe different things. Check the
  sample''s source and units. Apple''s accessory setup allows changes to wheel size and crank length, which are
  relevant when comparing equipment settings.


  ## Why might there be summary rows but no speed readings?


  The example database held 365 daily-average cycling-speed buckets for October 2025–September 2026. Every bucket
  value was null, and no raw speed samples or linked cycling-speed series were available. Those rows establish a
  stored summary schedule, not 365 measurements, zero-speed days or a once-daily sensor cadence. No value distribution
  or comparison across rides can be recovered from them.


  ## Can speed be calculated from cycling distance?


  Dividing an interval''s distance by its duration yields an interval-average rate. It is a derived quantity, not
  a recovered CyclingSpeed sample. Pauses within the interval and boundary selection affect the result. Dividing
  a whole ride''s distance by elapsed time also differs from an average that excludes stopped time.


  ## What changes speed besides fitness?


  Gradient, wind, drafting, bike setup, surface and indoor simulation all matter. Power and heart rate can add effort
  context, but a fast downhill section does not demonstrate higher effort. Compare similar conditions and sources
  before interpreting a trend as improved capacity.


  ## What should be checked before charting speed?


  Keep sources separate, confirm unit conversion and inspect durations, gaps, zeros and extreme values. HealthKit
  can condense or coalesce workout samples; stored record intervals do not promise a fixed sensor update rate. Avoid
  connecting across long gaps or replacing missing values with zero.

  '
