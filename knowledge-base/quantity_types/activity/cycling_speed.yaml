devices:
  - name: "Apple Watch"
    capability: "GPS-based speed measurement during outdoor cycling. Calculates instantaneous and average speed from position changes. Indoor cycling requires speed sensor or smart trainer."
    examples: ["Apple Watch Series 3+", "Apple Watch Ultra"]
  - name: "iPhone"
    capability: "GPS-based speed tracking when mounted on bike or carried. Many cycling apps use iPhone for ride tracking including speed data."
    examples: ["iPhone with GPS"]
  - name: "Cycling Computers"
    capability: "GPS and/or speed sensor-based measurement. Dedicated cycling computers often provide more accurate and reliable speed data than wrist-worn devices."
    examples: ["Garmin Edge", "Wahoo ELEMNT", "Hammerhead Karoo"]
  - name: "Speed Sensors"
    capability: "Wheel-based sensors measure actual wheel rotation, providing accurate speed regardless of GPS signal. Essential for indoor cycling."
