description: '## What does downhill snow sports distance measure?


  This Apple Health quantity records cumulative distance traveled while skiing or snowboarding. Distance is stored
  in metres; kilometres and miles are display conversions. It describes movement volume rather than vertical descent,
  speed or a measure of fitness. [Apple''s type definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/distancedownhillsnowsports)
  identifies it as a cumulative length quantity.


  ## Why can recording look different from running or walking?


  Apple''s downhill workout documentation describes distance samples generated at the end of a run, together with
  segment and pause/resume events. A stream of run-sized intervals can therefore be expected rather than a fixed
  recording every few seconds. This behavior belongs to the documented Apple workflow; another app can write differently
  shaped intervals. [Apple explains the recording model](https://developer.apple.com/documentation/healthkit/receiving-downhill-skiing-and-snowboarding-data).


  | Question | Useful evidence |

  |---|---|

  | How much descending was recorded? | Source-specific distance samples and run segments |

  | Was a long gap a lift ride or a break? | Pause/resume events and segment boundaries |

  | How steep or demanding was a run? | Slope, descent, duration and conditions alongside distance |

  | Did the app include uphill movement? | The source''s definition and recorded route, where available |


  A gap alone cannot identify a lift ride. Whole-workout elapsed time can include uphill transport and rest, so
  dividing distance by that time produces a different quantity from speed during a descent. Keep those denominators
  explicit.


  ## What did the example data show?


  The research window, October 2025 through September 2026, contained no raw downhill snow sports distance samples,
  no matching aggregate or workout-series rows, and no skiing or snowboarding workouts. Recording cadence, distributions,
  workout-versus-sleep differences and seasonal progression could therefore not be measured. No example distance
  chart is shown.


  This coverage check describes the available data. It cannot establish that no snow sports took place, that a device
  was worn, or that an app had permission to save this quantity. When observations become available, compare source-specific
  run distances and durations before presenting daily or seasonal totals.


  ## How should a season total or unusual run be read?


  A useful comparison keeps the source and its inclusion rules consistent. Summing overlapping app streams can count
  the same descent more than once; missing days should remain missing rather than becoming zero-distance days. Terrain,
  weather, skill and lift access also change how much distance a ski day produces. There is no universal healthy
  daily kilometre target here.


  For an unusually long or short interval, review its timestamps, source, run events and elevation metadata before
  drawing conclusions. Heart rate and active energy can provide exertion context when their coverage overlaps the
  descent, but cannot be calculated from distance alone. Sleep overlap is a data-quality/context check, not a meaningful
  way to compare normal skiing performance.


  ## Which technical details matter?


  Apple documents run-segment metadata for average and maximum speed, slope grade and elevation descended. Those
  belong to segment evidence; they are not guaranteed fields on every distance sample. Retain raw samples and provenance,
  distinguish interval duration from the delay until the next stored interval, and avoid treating run-sized records
  as the GPS sampling clock.

  '
