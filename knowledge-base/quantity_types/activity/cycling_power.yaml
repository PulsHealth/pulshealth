description: '## What does cycling power tell you?


  Cycling power represents the rate of mechanical output while riding, measured in watts. Apple describes this HealthKit
  type as an estimated power measurement and supports automatic collection from connected peripherals during cycling
  workouts. The origin and processing of the value matter: a sensor measurement and a platform estimate need not
  be interchangeable.


  | Measurement | Unit | Meaning |

  |---|---|---|

  | Cycling power | W | Output during an observation interval |

  | Cycling FTP | W | Estimated sustainable 60-minute average output |

  | Cycling speed | m/s, km/h or mph | Rate of travel |

  | Active energy | Energy units | A separate energy-expenditure estimate |


  ## Does the watch provide power on its own?


  Apple''s cycling guide describes connecting compatible Bluetooth accessories, including power meters. Do not assume
  that a ride with heart rate and distance contains power samples. Check which accessory or app supplied the measurement
  and whether its calibration changed between rides.


  ## Why can averages and peaks disagree?


  A brief peak and a sustained effort describe different things. A simple average of stored records weights every
  record equally; an elapsed-time average weights their durations. Missing intervals, overlapping sources, pauses
  and exclusion of recorded zeros can change either result. HealthKit may condense or coalesce workout samples,
  so a record maximum is not automatically an original high-frequency sensor peak.


  ## What did the example-data investigation find?


  No cycling-power raw samples, linked power series or power aggregates were present in the selected October 2025–September
  2026 window. Recorded cycling distance does not prove power-meter use and cannot supply an empirical watt range.
  Power–speed, power–cadence, FTP-relative intensity and sleep comparisons were unavailable rather than zero.


  ## Can speed substitute for power?


  Speed also changes with gradient, wind, drafting, surface and equipment. Similar power can produce different speeds,
  and similar speed can require different output. Compare power with cadence and heart rate within the same workout
  rather than treating an all-day association as a physiological response.


  ## How should FTP be used with a ride?


  FTP can provide an individual intensity reference if its date, source and estimation method are appropriate for
  the ride. Avoid silently applying a later FTP estimate to earlier workouts. Watts per kilogram additionally require
  a relevant body-mass measurement; watts alone cannot establish it.

  '
