description: '## What does Apple Health cardio fitness measure?


  VO2 max describes maximal oxygen uptake relative to body mass, in mL/kg/min. Apple Watch **estimates** it from
  the heart-rate response to submaximal outdoor activity; it does not measure oxygen in each breath. A clinic can
  measure oxygen uptake during a graded exercise test, and another app can store that result in the same HealthKit
  type. Check the source and test metadata before treating them as equivalent. [Apple''s type documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/vo2max)
  explains the distinction.


  ## Why does it update after some workouts but not others?


  Apple identifies Outdoor Walk, Outdoor Run and Hiking workouts as opportunities for estimates. Indoor workouts
  do not qualify for Apple Watch cardio fitness estimates. Adequate motion, heart-rate and location information
  matters; a completed workout does not guarantee a new estimate. Initial setup can require a day of wear plus several
  qualifying activities. [Apple''s current cardio fitness guide](https://support.apple.com/en-us/108790) describes
  eligibility and setup.


  In the July–September example, **28 estimates appeared on 27 of 92 reporting days**. The full reporting year contained
  81 estimates on 79 days. Missing days therefore describe recording opportunities, not days of zero aerobic fitness.
  The more represented source group''s median positive gap was about **52 hours**, with a longest gap of about 12
  days. A second source group contributed only two estimates; its cadence cannot establish a stable schedule.


  ## What do the example values show?


  | Window | Records | Median | Recorded range |

  |---|---:|---:|---:|

  | October 2025–September 2026 | 81 | 48.13 | 41.18–52.22 mL/kg/min |

  | July–September 2026 | 28 | 44.45 | 41.95–50.50 mL/kg/min |


  These are observed values, not fitness classifications. The focus window differs from the full-year distribution,
  and the figure preserves the source distinction. Changes may reflect fitness, activity selection, body-mass inputs,
  medication settings or algorithm changes; this extract does not isolate their effects. Do not read every short-term
  change as training adaptation.


  ## How closely do estimates align with recorded workouts?


  All example estimates were stored as points. Only **3 of 28** focus timestamps fell inside a recorded workout,
  but **27 were within ten minutes of a same-bundle workout interval**. That proximity is useful context, not proof
  of a HealthKit workout association. Estimates can be published near the end of activity, so a point outside a
  workout does not imply a resting VO2 max test.


  The type summarizes aerobic capacity; its timestamp does not represent a continuous physiological measurement.


  ## How should I compare it with other fitness measures?


  [Resting heart rate](/knowledge-base/types/HKQuantityTypeIdentifierRestingHeartRate/), [walking heart rate](/knowledge-base/types/HKQuantityTypeIdentifierWalkingHeartRateAverage/)
  and [cardio recovery](/knowledge-base/types/HKQuantityTypeIdentifierHeartRateRecoveryOneMinute/) describe different
  parts of the cardiovascular response. Same-source daily comparisons were investigated, but only 23 focus days
  paired VO2 estimates with resting heart rate in the larger source group. Recording selection and shared time trends
  make those comparisons exploratory.


  Apple''s classifications consider age and sex. Its supported estimate range is a device specification, not a healthy
  range for everyone. Clinical testing remains a different measurement method. An unexpected persistent change is
  best reviewed alongside symptoms, workout conditions, source changes and health-profile settings.


  ## How should exported records be summarized?


  Use discrete summaries, never sums. Keep test type and source provenance, preserve unrecorded dates as missing,
  and distinguish sample averages from day averages when a date has multiple estimates. Review retained extremes
  and neighboring estimates before excluding anything. Stored observations alone cannot establish why a value changed
  or whether an update recalculated prior results.

  '
metadata_keys:
- key: HKMetadataKeyVO2MaxTestType
  description: Indicates the type of test used to estimate VO2 max. Values include HKVO2MaxTestTypeMaxExercise (gold-standard
    lab test), HKVO2MaxTestTypePredictionSubMaxExercise (Apple Watch submaximal estimate), and HKVO2MaxTestTypePredictionNonExercise
    (estimated from demographics only).
related_types:
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: Underlying pulse context; saved summary estimates cannot necessarily be reconstructed from exported
    samples.
- identifier: HKQuantityTypeIdentifierRestingHeartRate
  relationship: Waking-rest estimate that adds context; source and measurement windows can differ.
- identifier: HKQuantityTypeIdentifierRunningSpeed
  relationship: Speed during outdoor runs is used in the VO2 max estimation algorithm
- identifier: HKQuantityTypeIdentifierWalkingSpeed
  relationship: Walking speed during outdoor walks contributes to VO2 max estimates
- identifier: HKQuantityTypeIdentifierActiveEnergyBurned
  relationship: VO2 max influences the efficiency of energy expenditure during activity
- identifier: HKWorkoutTypeRunning
  relationship: Outdoor running workouts are primary triggers for VO2 max estimation
- identifier: HKWorkoutTypeWalking
  relationship: Outdoor walking workouts can also generate VO2 max estimates
