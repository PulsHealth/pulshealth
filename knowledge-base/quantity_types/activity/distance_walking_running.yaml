# ============================================
# HEALTHKIT DATA TYPE: Distance Walking Running
# ============================================

# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierDistanceWalkingRunning"
source: "HealthKit"
type: "HKQuantityType"
category: "Activity"
human_readable_name: "Walking + Running Distance"
short_description: "Measures the distance the user has moved by walking or running."

# --- APPLE HEALTH UI ---
icon: "figure.walk"
color: "#FF9500"

# --- UNITS & MEASUREMENT ---
default_unit: "m"
supported_units:
  - "m"
  - "km"
  - "mi"
  - "ft"
  - "yd"
unit_description: "Length units measuring cumulative distance traveled on foot. Default is meters; users typically view in kilometers or miles based on locale."

# --- STATISTICS ---
aggregation_type: "cumulative"
statistics_options:
  - "cumulativeSum"
  - "separateBySource"

# --- TYPICAL VALUES ---
typical_range:
  min: 0
  max: 50000
  unit: "m"
  notes: "Daily values typically range from 2-10 km for most adults. Values above 20 km/day are uncommon except for runners, hikers, or occupations requiring extensive walking. Marathon distance (42.2 km) represents an upper extreme for single-day values."

clinical_ranges:
  - population: "Adults"
    sedentary: "<2 km/day (<1.2 mi)"
    low_active: "2-4 km/day (1.2-2.5 mi)"
    somewhat_active: "4-6 km/day (2.5-3.7 mi)"
    active: "6-10 km/day (3.7-6.2 mi)"
    highly_active: ">10 km/day (>6.2 mi)"
  - population: "Older Adults (65+)"
    sedentary: "<1.5 km/day"
    low_active: "1.5-3 km/day"
    active: "3-5 km/day"
    highly_active: ">5 km/day"
  - population: "Recreational Runners (weekly)"
    beginner: "10-20 km/week"
    intermediate: "30-50 km/week"
    advanced: "60-100 km/week"

# --- PLATFORM & AVAILABILITY ---
ios_introduced:
  version: "8.0"
  year: 2014
  notes: "Available since initial HealthKit release"
watchos_introduced:
  version: "2.0"
  year: 2015
  notes: "Apple Watch provides GPS-enhanced distance tracking"
deprecated: false
deprecated_in: null

# --- PERMISSIONS & ACCESS ---
writable: true
requires_authorization: true
sensitive_data: false

# --- DATA SOURCES ---
devices:
  - name: "Apple Watch"
    capability: "Distance calculation using GPS (when available), accelerometer-based step length estimation, and calibrated stride length from workout history. Series 2 and later have built-in GPS for standalone tracking."
    series: "All series (GPS on Series 2+)"
    accuracy: "GPS-tracked workouts typically within 1-3% of actual distance. Accelerometer-estimated indoor distance may vary by 5-15%."
  - name: "iPhone"
    capability: "Distance estimation based on step count and calibrated stride length. GPS used during active workout tracking for improved accuracy."
    accuracy: "Varies by 10-20% without GPS; more accurate when GPS is active."
  - name: "Third-party wearables"
    capability: "GPS-enabled fitness watches and trackers can write distance data to HealthKit."
    examples: ["Garmin", "Fitbit", "Polar", "Coros", "Suunto"]
  - name: "Running apps"
    capability: "Dedicated running apps with GPS tracking often provide more accurate distance data."
    examples: ["Strava", "Nike Run Club", "Runkeeper", "MapMyRun"]
primary_source: "Apple Watch"

# --- DETAILED DESCRIPTION ---
description: |
  ## Overview
  Walking + Running Distance measures the cumulative distance a user travels on foot, combining both walking and running activity. This metric provides meaningful context to step count data by quantifying the actual ground covered, which varies based on stride length and gait characteristics. Distance is a key metric for runners, walkers, and anyone tracking their ambulatory activity.

  ## How It's Measured
  Distance calculation on Apple devices uses multiple approaches depending on available sensors and context:

  **GPS-Based Measurement:**
  - Used during outdoor workouts and when GPS is available
  - Provides most accurate distance measurement
  - Apple Watch Series 2+ has built-in GPS; earlier models require iPhone for GPS
  - Samples GPS position at regular intervals and calculates path distance
  - Accuracy typically within 1-3% of actual distance

  **Accelerometer-Based Estimation:**
  - Used for indoor activity or when GPS is unavailable
  - Calculates distance from step count multiplied by estimated stride length
  - Stride length calibrated from previous GPS-tracked workouts
  - Machine learning improves estimates based on pace and arm swing patterns
  - Less accurate than GPS: typically 5-15% variance

  **Calibration Process:**
  - Apple devices learn individual stride characteristics over time
  - Running stride length differs from walking stride length
  - Calibration improves with more GPS-tracked outdoor workouts
  - Users can manually set stride length in Apple Watch settings

  **Data Recording:**
  - Distance is recorded as cumulative samples over time intervals
  - Workout sessions provide higher-resolution distance data
  - Background tracking aggregates distance over longer intervals

  ## Health Significance
  Distance traveled complements step count by providing a measure that scales with stride length and is more directly tied to energy expenditure:

  **Physical Activity Guidelines:**
  The WHO recommends that adults engage in 150-300 minutes of moderate-intensity aerobic activity per week. Walking and running are specifically highlighted as accessible forms of meeting these guidelines:
  - Walking 30 minutes most days (approximately 2.5-3 km at moderate pace)
  - Walking for 30 minutes or cycling for 20 minutes most days reduces total mortality risk by at least 10%

  **Energy Expenditure:**
  Distance traveled more accurately reflects caloric expenditure than step count alone:
  - Walking 1 km burns approximately 50-80 calories (varies by weight and pace)
  - Running 1 km burns approximately 60-100 calories
  - Taller individuals cover more distance per step, burning more calories for the same step count

  **Running Performance:**
  Weekly running mileage is the cornerstone metric for training load assessment:
  - Beginner runners: 10-20 km/week
  - Recreational runners: 30-50 km/week
  - Competitive amateurs: 60-100 km/week
  - Elite marathoners: 150-200+ km/week

  ## Clinical Interpretation Guidelines

  ### Activity Level Assessment
  Daily walking distance provides insight into overall mobility and activity:
  - **<2 km/day:** Sedentary lifestyle, associated with increased health risks
  - **2-4 km/day:** Below recommended activity levels
  - **4-6 km/day:** Moderate activity, meeting minimum health thresholds
  - **6-10 km/day:** Active lifestyle with good health associations
  - **>10 km/day:** Highly active, common in athletes and active occupations

  ### Running Training Load
  For runners, weekly distance trends indicate training adaptation:
  - **10% Rule:** Increase weekly mileage by no more than 10% to reduce injury risk
  - **Consistency:** Regular distance accumulation more beneficial than sporadic high-volume days
  - **Recovery:** Periods of reduced distance important for adaptation

  ### Clinical Considerations
  - Patients with joint issues may benefit from distance goals rather than step goals
  - Distance decline in elderly patients may indicate mobility loss or fear of falling
  - Sudden distance increases without conditioning increase overuse injury risk
  - Chronic low distance (<2 km/day) associated with increased cardiovascular and metabolic risk

  ### Red Flags
  - Significant decrease in typical daily distance without explanation
  - Inability to walk expected distances due to fatigue, pain, or shortness of breath
  - Large discrepancy between reported distance and GPS-verified distance (may indicate device issues or health problems)

  ## Caveats & Limitations

  ### Measurement Limitations
  - **Indoor accuracy:** Accelerometer-based estimation less accurate than GPS
  - **GPS signal:** Urban canyons, dense tree cover, and indoor portions of routes reduce GPS accuracy
  - **Stride calibration:** New devices or users without calibration history have reduced accuracy
  - **Treadmill running:** Requires manual calibration or third-party apps for accurate distance

  ### Interpretation Limitations
  - **Terrain not captured:** Distance on flat ground vs. hilly terrain represents different effort levels
  - **Pace not reflected:** 5 km walked slowly differs metabolically from 5 km run quickly
  - **Surface not captured:** Soft sand or trails require more energy per distance than pavement

  ### What Distance Cannot Tell You
  - Elevation gain/loss
  - Exercise intensity
  - Speed or pace
  - Caloric expenditure (requires additional data)
  - Terrain difficulty

  ## Additional Notes

  **For Health Consultants:**
  When reviewing distance data:
  1. Consider in conjunction with step count (distance/steps = stride length indicator)
  2. Compare weekday vs. weekend patterns
  3. Look for gradual increases or decreases over weeks
  4. Note workout vs. non-workout distance breakdown
  5. Assess consistency rather than single-day maximums

  **Distance vs. Step Goals:**
  - Distance goals may be more meaningful for patients with mobility issues
  - Step goals are more intuitive for general population
  - Both metrics together provide fuller picture of ambulatory activity

  **Integration with Workouts:**
  Distance from structured workout sessions is typically tracked separately and with higher accuracy. The total daily distance combines both workout and non-workout activity.

