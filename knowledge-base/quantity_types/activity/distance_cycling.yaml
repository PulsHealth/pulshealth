related_types:
- identifier: HKQuantityTypeIdentifierCyclingSpeed
  relationship: Travel rate; does not establish effort.
- identifier: HKQuantityTypeIdentifierCyclingPower
  relationship: Output in watts; distinct from speed or energy expenditure.
- identifier: HKQuantityTypeIdentifierCyclingCadence
  relationship: Pedal rotations per minute; gearing and coasting affect comparisons.
- identifier: HKQuantityTypeIdentifierCyclingFunctionalThresholdPower
  relationship: Estimated sustainable 60-minute average power; date and method matter.
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: Physiological effort context when matched to comparable workout intervals.
