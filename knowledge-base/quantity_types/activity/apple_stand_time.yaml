    relationship: "Complementary - Part of the Activity rings trio; Exercise Time tracks moderate+ activity, Stand Time tracks sedentary breaks"
  - identifier: "HKQuantityTypeIdentifierAppleMoveTime"
    relationship: "Alternative metric - Move Time serves wheelchair users as the accessibility-focused equivalent to Stand Time"
  - identifier: "HKQuantityTypeIdentifierActiveEnergyBurned"
    relationship: "Complementary - Standing and moving contributes to active energy burned, though typically at lower rates than exercise"
  - identifier: "HKQuantityTypeIdentifierStepCount"
    relationship: "Related - Steps are often accumulated during stand/move periods, though standing in place does not generate steps"

