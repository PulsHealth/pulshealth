related_types:
- identifier: HKCategoryTypeIdentifierAppleStandHour
  relationship: Complementary - Stand Hour is the binary hourly metric (stood/didn't stand), while Stand Time is
    the continuous duration measure
- identifier: HKQuantityTypeIdentifierAppleExerciseTime
  relationship: Complementary - Part of the Activity rings trio; Exercise Time tracks moderate+ activity, Stand
    Time tracks sedentary breaks
- identifier: HKQuantityTypeIdentifierAppleMoveTime
  relationship: Alternative metric - Move Time serves wheelchair users as the accessibility-focused equivalent to
    Stand Time
- identifier: HKQuantityTypeIdentifierActiveEnergyBurned
  relationship: Complementary - Standing and moving contributes to active energy burned, though typically at lower
    rates than exercise
- identifier: HKQuantityTypeIdentifierStepCount
  relationship: Complementary movement quantity; source-specific interval and daily comparisons require overlap
    review.
