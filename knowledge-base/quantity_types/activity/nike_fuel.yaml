description: '## What are NikeFuel points in Apple Health?


  NikeFuel records the number of activity points earned under a source''s NikeFuel system. Apple defines it as a
  **cumulative count quantity**, rather than a physical measurement. A point is not a step, calorie or exercise
  minute, and HealthKit does not specify a conversion between them. [Apple documents the quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/nikefuel).


  ## Is the HealthKit type deprecated?


  The identifier remains in the current HealthKit SDK without an API deprecation annotation. That does not establish
  whether an older device, account or app still produces new points. Existing historical records and a currently
  active data source are different questions. Review the contributing app and the dates of its last entries before
  expecting a continuing series.


  ## How should totals and gaps be read?


  | Record detail | Useful interpretation |

  | --- | --- |

  | Point count | Amount credited by its source |

  | Sample interval | Period represented by that contribution |

  | Daily summary | Review before combining with shorter contributions |

  | Missing day | Unknown coverage, not proof of inactivity |


  Sum compatible contributions within a source and a reporting window. If two apps import the same activity, adding
  both can double count it. A large record might be a daily summary rather than an unusual workout; inspect duration
  and source before treating it as an outlier. Irregular entries can reflect imports or synchronization, so entry
  spacing does not establish movement cadence.


  ## Can NikeFuel be compared with other activity measures?


  [Steps](/knowledge-base/types/HKQuantityTypeIdentifierStepCount/) and [active energy](/knowledge-base/types/HKQuantityTypeIdentifierActiveEnergyBurned/)
  can describe activity alongside points when dates and coverage match. Their different definitions prevent a universal
  conversion or a shared normal range. A source-specific trend can be more useful than a target copied from a different
  scoring system.


  ## What did the coverage review find?


  The reviewed 365-day example-data window contained no samples, stored aggregates or workout-series points for
  this type. Value distributions, unusual readings, recording cadence and related-data comparisons could not be
  measured. No empirical figure is presented; missing database rows do not establish missing records on the phone.


  ## Does PulsHealth collect this type?


  This identifier is part of HealthKit, but is not listed in the current PulsHealth sync catalog. The units above
  describe HealthKit measurement semantics rather than a promised sync format. Database coverage and Apple Health
  availability are separate questions.

  '
