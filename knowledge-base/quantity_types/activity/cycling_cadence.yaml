    examples: ["Garmin Cadence Sensor", "Wahoo RPM Cadence", "Magene S3+"]
  - name: "Power Meters"
    capability: "Most power meters include cadence measurement as cadence is required for power calculation (power = torque × angular velocity)."
    examples: ["Garmin Rally", "Favero Assioma", "Stages", "Quarq"]
  - name: "Apple Watch"
    capability: "Estimates cadence from accelerometer data detecting the rhythmic motion of the wrist during pedaling. Less accurate than dedicated sensors."
