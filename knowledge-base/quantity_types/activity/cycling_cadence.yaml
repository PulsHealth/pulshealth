description: '## What does cycling cadence measure?


  Cadence counts complete pedal rotations per minute, usually displayed as RPM. It describes how quickly you pedal;
  it does not measure speed, force or effort on its own.


  | Reading | What it can mean | What to check |

  |---|---|---|

  | Faster pedaling | More rotations per minute | Gear selection and power |

  | Slower pedaling | Fewer rotations per minute | Gradient, resistance and riding style |

  | Recorded zero | A logged zero, potentially while coasting | Sensor connection and recording rules |

  | No record | Unknown cadence | Accessory support, permissions and source |


  ## Does Apple Watch measure cadence without a sensor?


  Apple documents automatic collection from connected cycling peripherals. Its cycling guide explains pairing compatible
  Bluetooth accessories. A watch recording heart rate or GPS distance does not establish that it has also recorded
  cadence. Check the source that wrote the cadence samples rather than assuming wrist movement supplies this measurement.


  ## How often is cadence recorded?


  There is no universal stored interval to promise. Sensor updates, app recording and HealthKit condensation or
  coalescing can produce different sample shapes. Compare the time between sample starts with the duration covered
  by each sample; they answer different questions. An average over a long interval cannot reconstruct every pedal
  rotation.


  ## What did the example-data investigation find?


  The selected October 2025–September 2026 database window contained no cycling-cadence samples, linked cadence
  series or cadence aggregates. Cycling distance was available, but distance cannot recover pedal rotations because
  gearing and coasting are unknown. This example supports no cadence range, outlier chart or comparison across rides.


  ## Is there an ideal RPM?


  This article does not prescribe a universal cadence target. Compare similar rides and equipment, preferably with
  power and heart rate alongside cadence. Cadence alone cannot determine efficiency, joint safety or left–right
  balance. A persistent change can reflect gearing, conditions, technique or sensor behavior as well as training.


  ## Which measurements belong beside cadence?


  Cycling power describes output; speed and distance describe travel. Together they give useful context, but they
  must refer to comparable intervals. Higher cadence does not guarantee higher speed or lower exertion. Keep missing
  readings separate from recorded zeros when summarizing a ride.

  '
