writable: true
requires_authorization: true
sensitive_data: false

# --- DATA SOURCES ---
devices:
  - name: "Apple Watch"
    capability: "Automatic swim distance tracking using accelerometer-based stroke counting combined with pool length (pool swim) or GPS (open water). Water Lock mode prevents accidental screen input during swimming."
    series: "Series 2 and later (water-resistant to 50m)"
    accuracy: "Pool swimming typically within 2-5% when pool length is correctly set. Open water accuracy depends on GPS signal quality at the surface."
    examples: ["Apple Watch Series 2", "Apple Watch SE", "Apple Watch Ultra"]
  - name: "Swim-capable fitness trackers"
    capability: "Dedicated swim trackers measure distance via stroke counting and programmed pool length. Many sync to HealthKit via companion apps."
    examples: ["Garmin Swim 2", "FORM Smart Swim Goggles", "Amazfit GTR"]
  - name: "Swimming apps"
    capability: "Third-party swimming apps provide detailed swim metrics and can write distance data to HealthKit."
    examples: ["MySwimPro", "Swim.com", "SwimIO"]
primary_source: "Apple Watch (Series 2 or later) with Pool Swim or Open Water Swim workout"

# --- DETAILED DESCRIPTION ---
description: |
  ## Overview
  Swimming Distance measures the cumulative distance traveled during swimming activities. Apple Watch introduced swim tracking with Series 2, using a fundamentally different approach than land-based activities. Rather than relying on GPS (which does not work underwater), pool swimming distance is calculated by counting laps via accelerometer-detected stroke patterns and multiplying by the user-specified pool length. Open water swimming uses GPS sampling when the watch surfaces during strokes.

  Swimming is recognized by the American Heart Association and WHO as excellent cardiovascular exercise that provides full-body conditioning while being extremely low-impact, making it suitable for individuals with joint issues, injuries, or those seeking cross-training benefits.

  ## How It's Measured
  Apple Watch employs distinct measurement methods for pool and open water swimming:

  **Pool Swimming Measurement:**
  - User selects "Pool Swim" workout and specifies pool length (25m, 50m, 25yd, or custom)
  - Accelerometer detects swimming strokes and arm movement patterns
  - Algorithm identifies when the user reaches the wall and turns (lap detection)
  - Total distance = number of completed laps × pool length
  - Stroke type detected: freestyle, backstroke, breaststroke, butterfly, or mixed
  - Watch recognizes resting periods when swimmer stops at wall

  **Key Pool Detection Features:**
  - Turn detection uses characteristic deceleration and rotation patterns
  - Algorithm distinguishes between flip turns and touch turns
  - Partial laps (stopping mid-pool) may not be counted accurately
  - Very short pools (<15m) may have reduced accuracy

  **Open Water Swimming Measurement:**
  - User selects "Open Water Swim" workout
  - GPS acquires position when watch surfaces during stroke recovery
  - Distance calculated by connecting GPS points over time
  - Accuracy depends on stroke type (strokes with more arm elevation provide better GPS signal)
  - Cold water, waves, and weather can affect GPS acquisition

  **Technical Considerations:**
  - Apple Watch locks screen during swimming (Water Lock) to prevent accidental input
  - Ejecting water via speaker vibration is required after exiting water
  - Heart rate monitoring works during swimming but with reduced accuracy due to water
  - Watch continues tracking during flip turns and underwater phases

  ## Health Significance
  Swimming provides exceptional cardiovascular and musculoskeletal benefits:

  **Cardiovascular Benefits:**
  - Swimming improves cardiorespiratory fitness comparable to running
  - Regular swimming associated with lower blood pressure
  - Excellent for maintaining cardiovascular health during injury rehabilitation
  - Provides aerobic conditioning with minimal orthopedic stress

  **Musculoskeletal Benefits:**
  - Near-zero impact on joints due to buoyancy
  - Develops balanced upper and lower body strength
  - Improves flexibility and range of motion
  - Particularly valuable for arthritis patients and post-surgical rehabilitation

  **Clinical Populations:**
  - Recommended for patients with osteoarthritis (Arthritis Foundation)
  - Safe for many cardiac rehabilitation programs
  - Appropriate for prenatal fitness with physician approval
  - Beneficial for weight management (lower injury risk than weight-bearing exercise)

  **WHO and Guidelines Context:**
  - Swimming counts toward 150 minutes weekly moderate aerobic activity
  - Vigorous swimming (interval training, racing) counts double toward guidelines
  - WHO recognizes swimming as accessible activity for diverse populations

  ## Clinical Interpretation Guidelines

  ### Fitness Assessment by Volume
  Weekly swimming distance provides insight into conditioning level:
  - **<2000 m/week:** Casual/occasional swimmer; fitness maintenance
  - **2000-5000 m/week:** Regular recreational swimmer; solid cardiovascular benefit
  - **5000-10,000 m/week:** Dedicated fitness swimmer; significant conditioning
  - **>10,000 m/week:** Competitive or serious masters swimmer

  ### Training Load Monitoring
  For regular swimmers, distance trends indicate training status:
  - **Consistency patterns:** Regular moderate volume preferred over sporadic high volume
  - **Progressive overload:** 5-10% weekly increase is reasonable for building fitness
  - **Tapering:** Reduced distance before competition is normal and expected
  - **Recovery weeks:** Periodic reduction in volume supports adaptation

  ### Cross-Training Integration
  For multisport athletes (especially triathletes):
  - Swimming provides active recovery from running/cycling impact
  - Monitor total training load across all activities
  - Swimming technique improvements often yield better results than volume increases

  ### Clinical Red Flags
  - Persistent shoulder pain during or after swimming (swimmer's shoulder)
  - Inability to complete previously achievable distances
  - Chest pain, excessive shortness of breath, or dizziness during swimming
  - Ear pain or hearing changes (swimmer's ear considerations)

  ## Caveats & Limitations

  ### Measurement Limitations
  - **Pool length accuracy:** Incorrect pool length setting directly multiplies error
  - **Partial laps:** Stopping mid-pool or drills may not register accurately
  - **Non-standard strokes:** Sidestroke, elementary backstroke may confuse detection
  - **Kickboard/pull buoy:** Drills without full stroke pattern reduce accuracy
  - **Open water GPS:** Underwater portions have no GPS; accuracy interpolated

  ### Interpretation Limitations
  - **Intensity not captured:** Easy swimming vs. sprint sets show same distance
  - **Rest intervals:** Time spent resting at wall not reflected in distance
  - **Stroke efficiency:** Two swimmers covering same distance may have vastly different fitness
  - **Pool vs. open water:** Same distance may represent different effort levels

  ### What Swimming Distance Cannot Tell You
  - Stroke count or SWOLF efficiency metrics (see SwimmingStrokeCount)
  - Split times per lap or interval
  - Heart rate zones during swimming
  - Stroke type breakdown percentages
  - Caloric expenditure (varies significantly by stroke, intensity, skill)
  - Drill work or technique-focused training

  ## Additional Notes

  **For Health Consultants:**
  When reviewing swimming distance data:
  1. Verify pool length setting matches actual pool (common error source)
  2. Distinguish pool vs. open water sessions (different accuracy profiles)
  3. Consider swim frequency alongside total distance
  4. Note that competitive swimmers may have seasonal training cycles
  5. Be aware that swim technique dramatically affects distance-to-fitness relationship

  **Pool Length Standards:**
  - Short course yards (SCY): 25 yards - common in US pools
  - Short course meters (SCM): 25 meters - common internationally
  - Long course meters (LCM): 50 meters - Olympic standard
  - Verify user has set correct length for their pool

  **Integration with Workouts:**
  Swimming workouts provide additional metrics:
  - Lap-by-lap breakdown with times
  - Stroke type per lap
  - SWOLF scores for efficiency
  - Active vs. rest time
  - Stroke count per lap

