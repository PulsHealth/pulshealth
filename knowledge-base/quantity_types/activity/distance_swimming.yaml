# ============================================
# HEALTHKIT DATA TYPE: Distance Swimming
# ============================================

# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierDistanceSwimming"
source: "HealthKit"
type: "HKQuantityType"
category: "Activity"
human_readable_name: "Swimming Distance"
short_description: "Measures the distance the user has moved by swimming."

# --- APPLE HEALTH UI ---
icon: "figure.pool.swim"
color: "#5AC8FA"

# --- UNITS & MEASUREMENT ---
default_unit: "m"
supported_units:
  - "m"
  - "km"
  - "mi"
  - "ft"
  - "yd"
unit_description: "Length units measuring cumulative distance traveled while swimming. Default is meters; pool swimming often measured in yards (US) or meters (international). Open water swims typically measured in kilometers or miles."

# --- STATISTICS ---
aggregation_type: "cumulative"
statistics_options:
  - "cumulativeSum"
  - "separateBySource"

# --- TYPICAL VALUES ---
typical_range:
  min: 0
  max: 10000
  unit: "m"
  notes: "Single session values typically range from 500m for casual swimmers to 4000m+ for competitive training. Open water swims can extend to marathon distances (10km+). Daily totals vary widely based on swim frequency."

clinical_ranges:
  - population: "Recreational Swimmers"
    occasional: "<1000 m/week"
    regular: "1000-3000 m/week"
    active: "3000-6000 m/week"
  - population: "Competitive Swimmers (weekly)"
    age_group: "15,000-30,000 m/week"
    collegiate: "30,000-50,000 m/week"
    elite: "50,000-80,000 m/week"
  - population: "Masters Swimmers"
    recreational: "3000-8000 m/week"
    competitive: "8000-20,000 m/week"
  - population: "Triathletes (swim volume)"
    sprint_distance: "2000-5000 m/week"
    olympic_distance: "5000-10,000 m/week"
    ironman: "8000-15,000 m/week"

# --- PLATFORM & AVAILABILITY ---
ios_introduced:
  version: "10.0"
  year: 2016
  notes: "Introduced with Apple Watch Series 2, the first water-resistant Apple Watch with swim tracking capabilities"
watchos_introduced:
  version: "3.0"
  year: 2016
  notes: "Apple Watch Series 2 introduced swim-proof design (50m water resistance) and pool/open water swim workout detection"
deprecated: false
deprecated_in: null

