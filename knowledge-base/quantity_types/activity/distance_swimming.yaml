last_updated: "2026-01-27"
research_notes: |
  - iOS 10.0/watchOS 3.0 introduction aligned with Apple Watch Series 2 swim-proof design
  - Pool swim uses accelerometer lap counting × pool length; open water uses GPS
  - 50m water resistance rating standard for Apple Watch Series 2+
  - SWOLF = strokes + time in seconds per lap (efficiency metric)
  - Competitive swimmers train 30,000-80,000 m/week depending on level
  - Pool length setting is critical accuracy factor for pool swimming
