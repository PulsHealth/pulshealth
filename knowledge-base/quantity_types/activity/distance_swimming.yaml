metadata_keys:
  - key: "HKMetadataKeySwimmingLocationType"
    description: "Indicates whether the swim was in a pool (1) or open water (2). Critical for understanding measurement method."
  - key: "HKMetadataKeyLapLength"
    description: "The length of the pool in meters. Used to calculate total distance from lap count. Only applicable to pool swims."
  - key: "HKMetadataKeySwimmingStrokeStyle"
    description: "The predominant stroke style detected during the sample (freestyle, backstroke, breaststroke, butterfly, or mixed)."
  - key: "HKMetadataKeyExternalUUID"
    description: "Unique identifier for the sample from the originating source."
  - key: "HKMetadataKeySyncIdentifier"
    description: "Identifier used for syncing data across devices."
  - key: "HKMetadataKeySyncVersion"
    description: "Version number for sync conflict resolution."

