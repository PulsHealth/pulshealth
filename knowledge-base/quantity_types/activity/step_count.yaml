research_notes: Executed snapshot-bound empirical notebook before rewriting this article. Full-year standard facets
  and 92-day interval, source overlap, calendar-boundary, workout, sleep and related-type diagnostics are persisted
  privately under artifact key step-count. Public figures use anonymous sources and relative dates. Unsupported
  population thresholds and unsourced accuracy percentages were removed.
recording_behavior:
  reviewed_on: '2026-10-14'
  shape: A cumulative sample contains a number of steps over a time interval. One database row is not one step;
    interval lengths can vary substantially.
  cadence: Recording cadence varies with source and activity. In one researched case, running records from one watch
    group were much shorter than walking-workout records. Count divided by interval duration is an interval average,
    not directly observed gait cadence.
  context: Use interval overlap for screening, then inspect containment and source. Steps overlapping asleep intervals
    do not establish walking during sleep. Match workout type and compare like sources before interpreting cadence.
  coverage: A day with step samples is not proof that all movement was recorded. Missing rows, explicit empty aggregate
    buckets and measured zero totals have different meanings.
  aggregation: Raw intervals from multiple sources may overlap. Use a suitable HealthKit statistics result for source-merged
    totals instead of naively summing raw records. Verify function, device filter, timezone and both bucket boundaries
    before comparing daily totals.
  metadata: Metadata is optional. Absence of metadata does not invalidate a step sample, and interval overlap alone
    is not enough to identify exact duplicate steps.
  references:
  - title: 'Apple: cumulative quantity samples'
    url: https://developer.apple.com/documentation/healthkit/hkcumulativequantitysample
  - title: 'Apple: statistics queries'
    url: https://developer.apple.com/documentation/healthkit/hkstatisticsquery
  - title: 'Apple: statistics collection boundaries'
    url: https://developer.apple.com/documentation/healthkit/hkstatisticscollectionquery
