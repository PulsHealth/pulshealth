description: '## Overview

  Step count is the number of steps recorded over a period. Apple Health can receive steps from an iPhone, Apple
  Watch, other apps and manual entries. A useful view starts with daily totals, then checks the sources and intervals
  behind them. [Apple explains how Health collects and prioritizes sources](https://support.apple.com/en-us/108779).


  The examples below use one person''s real Apple Health data: a full reporting year, with a 92-day window for closer
  comparisons. They illustrate recording behavior, not population activity targets or clinical reference ranges.


  ## How HealthKit stores steps

  Steps are a **cumulative quantity** in units of `count`. One record contains a count over its start-to-end interval;
  one row is not one step, and its value is not necessarily a daily total. [Apple''s cumulative quantity documentation](https://developer.apple.com/documentation/healthkit/hkcumulativequantitysample)
  describes this representation.


  In the 92-day case window, 22,823 records contained between 1 and 1,128 steps per interval. Record duration ranged
  from about 2.43 seconds to 10.02 minutes. Comparing counts without their durations mixes very different observations.


  ## Why raw totals differ from Apple Health

  Several sources can record the same period. Even within a source group, intervals and identical interval/count
  combinations can recur. Overlap is a reason to investigate, not sufficient evidence to delete a record: source
  revisions, interval boundaries and metadata also matter.


  The figure shows actual stored intervals from one selected day, with anonymous labels for three source groups.
  Two watch groups had the same display name but different source identifiers. A display name alone would have hidden
  that distinction.


  Adding every source''s records therefore does not reproduce a source-merged HealthKit total. Use a suitable cumulative
  statistics query, and keep its function, source/device filter and boundaries alongside the result. [Apple''s statistics
  collection query](https://developer.apple.com/documentation/healthkit/hkstatisticscollectionquery) defines interval
  buckets using an anchor date.


  ## What daily totals show

  Before treating a bucket as a reporting day, check **both boundaries** in the intended timezone. A 23:00-to-23:00
  interval is not midnight-to-midnight in that calendar, even when its label says “day.” Daylight-saving days can
  legitimately last 23 or 25 hours.


  The full-year audit found 2,107 candidate daily step buckets: 1,055 matched both local midnight boundaries and
  1,052 were shifted and excluded from this calendar comparison. That is a calendar compatibility check; excluded
  buckets remain evidence for another anchor or timezone.


  | One-person case measure | Observation in the 92-day window |

  | --- | --- |

  | Valid all-source daily buckets | 92 of 92 reporting days |

  | Median all-source daily total | About 5,891 steps |

  | Middle half of daily totals | About 4,607–8,481 steps |

  | Lowest and highest daily totals | 2,106–14,715 steps |

  | Valid watch-only / iPhone-only buckets | 72 days each; missing buckets are not zero |


  The chart compares these validated daily series with the sum of raw records fully contained in each all-source
  bucket. That raw sum was a median 1.85 times the HealthKit total. This is a mismatch diagnostic, not a deduplication
  algorithm: boundary-crossing counts are not prorated, overlapping records remain, and device filters select different
  data. Some HealthKit totals were fractional despite integer raw counts; preserve returned precision and round
  only the display.


  ## How cadence changes during workouts

  Recording cadence and walking cadence answer different questions. **Recording cadence** describes how often records
  begin. **Interval-average step rate** is count divided by the whole interval''s minutes; pauses and short intervals
  can make it a poor estimate of actual gait cadence.


  Within one watch source group, fully contained records from 14 running workouts had a median duration and positive
  start-to-start gap of about 2.57 seconds. The 12,514 running records had a median interval-average rate of about
  164 steps/minute. In 13 walking workouts from the same group, 48 fully contained records had a median duration
  of about 9.92 minutes. These different representations make row counts a misleading activity comparison.


  Outliers stay in the research. A short interval can produce an unusually high arithmetic rate: the year''s maximum
  was about 842 steps/minute. That number deserves interval/source review; it is not proof of someone walking at
  that cadence. Statistical flags identify unusual records without establishing measurement error.


  ## What sleep overlap means

  Only 52 step records in the case window overlapped an asleep-labelled interval; 51 were fully contained in a single
  asleep stage. Most belonged to one source group. Those counts cannot establish walking during sleep: detected
  movement, sleep classification and recording intervals all carry uncertainty. An interval touching sleep also
  does not locate its individual steps within that overlap.


  Avoid turning sparse overnight records into a sleep-quality score. The analysis uses asleep categories, rather
  than including in-bed and awake records, and treats unmatched time as other or unknown.


  ## Read steps alongside distance and energy

  Walking/running distance helps explain a step total; active energy and workout type add context that steps alone
  miss. In this case, same-source daily step and walking/running-distance sums moved together across 92 matched
  days. The research retains overlaps in those raw diagnostic sums, so the relationship is descriptive rather than
  an independently validated distance estimate.


  Running workout comparisons also showed positive associations with distance and active energy, while cycling comparisons
  did not show the same step–distance relationship. Steps are therefore an incomplete account of activity, especially
  for cycling and other activities whose effort is not well represented by footfalls.


  ## Make comparisons that hold up

  Compare like with like: the same calendar, query options and source selection across time. Review several days
  rather than interpreting one abrupt change in isolation, and check for a source revision or coverage change before
  attributing the pattern to behavior. A day containing records does not establish complete device wear, and absent
  data is different from a measured zero.


  For an activity goal, personal circumstances matter. This page''s observed ranges describe one recording history
  and do not define a healthy minimum, maximum or a diagnosis.

  '
