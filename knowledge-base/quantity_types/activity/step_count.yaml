figures:
- src: /knowledge-base/figures/step-count/source-overlap.svg
  alt: Three anonymous source rows show overlapping step-count intervals across one local day.
  title: Several sources can cover the same time
  caption: One person's real records on a selected day. Each bar is a cumulative step-count interval, not an individual
    step; source labels are anonymous.
  methods: Selected the middle day by record count among the 92-day focus window days with at least two source groups.
    All 110 records starting on that day are shown; widths use stored durations and hours since reporting-calendar
    midnight. Groups retain bundle and source name rather than merging identical display names. No overlap deduplication
    or count allocation.
  section: Why raw totals differ from Apple Health
  width: 960
  height: 365
- src: /knowledge-base/figures/step-count/intervals-and-rate.svg
  alt: Validated HealthKit daily step series beside a scatter plot showing fully contained all-source raw sums generally
    exceed the source-merged totals.
  title: Daily HealthKit sums and raw sums answer different questions
  caption: One person's 92-day case window. All-source daily totals have 92 validated buckets; watch and iPhone
    have 72 each. Missing filtered buckets break the lines. The dashed line marks equal raw and HealthKit totals.
  methods: Keep only sum, one-day buckets whose actual start and end are consecutive America/Los_Angeles midnights,
    accepting 23/25-hour DST days. The full-year audit excludes 1,052 shifted buckets out of 2,107 candidates. The
    right panel uses 92 all-source valid focus buckets; raw sums include only records fully contained in each bucket,
    retaining overlaps and omitting crossing intervals rather than prorating counts. No reconstruction of Health
    source priority is claimed.
  section: What daily totals show
  width: 960
  height: 403
