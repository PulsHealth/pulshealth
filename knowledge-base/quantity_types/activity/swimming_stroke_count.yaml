research_notes: |
  - SWOLF = Strokes + Seconds per length (like golf, lower is better)
  - Four stroke types detected: freestyle, backstroke, breaststroke, butterfly
  - Elite freestyle swimmers: 10-14 strokes per 25m
  - Recreational swimmers: 25-40 strokes per 25m
  - Stroke count increases with fatigue (useful training metric)
  - Arm length/height significantly affects baseline stroke count
  - Compare only same stroke types and pool lengths for valid analysis
