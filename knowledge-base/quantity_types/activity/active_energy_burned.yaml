  limitations: Example observational records; no calorimetry or longitudinal profile/calibration validation. Cumulative
    samples can overlap or be coalesced. Source-selected sums assign complete intervals to their start day and do
    not reconstruct HealthKit source precedence or recorded phone-local rings. Context uses temporal overlap, not
    explicit workout linkage. Fixed reporting calendar may differ from recorded local days; unaligned/duplicate
    daily aggregate buckets excluded from diagnostic matching. Interval-weighted rates are not instantaneous metabolism.
    Missing records are not zero. Selected-source sleep-overlap evidence includes only 79 focus intervals on six
    days.
