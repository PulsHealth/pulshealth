figures:
- src: /knowledge-base/figures/active-energy-burned/context-rates.svg
  title: Recording context changes interval-average energy rates
  alt: Source-selected interval-average energy rates grouped by workout, recorded-sleep and other or unknown overlap.
  caption: 'Selected-source example data: 56,790 workout-overlap intervals on 48 days, 14,143 other or unknown intervals
    on 92 days, and 79 sleep-overlap intervals on only six days. Amount divided by duration gives an interval-average
    rate, not an instantaneous measurement or a target range.'
  methods: July–September 2026, fixed America/Los_Angeles reporting calendar. Largest Apple-health source group
    by record count, bundle/name grouping across source revisions. Amount divided by positive duration of at least
    one second. Boxes span p25–p75 with median; whiskers p5–p95. Extreme intervals retained in analysis but omitted
    from this display. Each interval weighted equally. Half-open overlap with workouts and asleep categories 1/3/4/5;
    other/unknown is not confirmed rest or wakefulness.
  section: What changes during workouts and recorded sleep?
