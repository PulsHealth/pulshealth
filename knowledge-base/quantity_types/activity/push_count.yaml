# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierPushCount"
source: "HealthKit"
type: "HKQuantityType"
category: "Activity"
human_readable_name: "Wheelchair Push Count"
short_description: "Measures the number of wheelchair pushes performed by the user for mobility and exercise."

# --- APPLE HEALTH UI ---
icon: "figure.roll"
color: "#FF9500"

# --- UNITS & MEASUREMENT ---
default_unit: "count"
supported_units:
  - "count"
unit_description: "Individual wheelchair pushes counted. Each push represents one propulsion stroke where the user's hands contact the wheel rims and push to move the wheelchair forward."

# --- STATISTICS ---
aggregation_type: "cumulative"
statistics_options:
  - "cumulativeSum"
  - "separateBySource"

# --- TYPICAL VALUES ---
typical_range:
  min: 0
  max: 15000
  unit: "count/day"
  notes: "Daily push counts vary significantly based on activity level, wheelchair type, and environmental factors. Active wheelchair users typically perform 3,000-8,000 pushes per day. Wheelchair athletes in training may exceed 10,000 pushes daily."

clinical_ranges:
  - population: "Adult Manual Wheelchair Users"
    sedentary: "<1500 pushes/day"
    low_active: "1500-3000 pushes/day"
    somewhat_active: "3000-5000 pushes/day"
    active: "5000-8000 pushes/day"
    highly_active: ">8000 pushes/day"
  - population: "Wheelchair Athletes (training)"
    recreational: "4000-6000 pushes/day"
    competitive: "6000-10000 pushes/day"
    elite: ">10000 pushes/day"

