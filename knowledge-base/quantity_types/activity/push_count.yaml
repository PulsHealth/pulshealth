description: '## What is a wheelchair push count?


  Push Count records wheelchair propulsion pushes as cumulative counts over an interval. [Apple documents](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/pushcount)
  automatic Apple Watch recording when wheelchair mode is enabled. It is a movement count, rather than distance,
  calories or a count of steps.


  ## What does one push-count interval tell you?


  | Calculation | What it describes | What it cannot establish |

  |---|---|---|

  | Interval count | Pushes assigned to the recorded time span | A fixed sensor sampling frequency |

  | Daily source sum | Recorded pushes in a reporting day | All activity or a clinical activity category |

  | Count divided by interval minutes | Average recorded push rate across the interval | Continuous stroke cadence
  or effort |

  | Distance divided by aligned pushes | Recorded travel per push | Propulsion efficiency without additional context
  |


  An interval can contain pauses, turns and changes in speed. Dividing its count by its duration averages all of
  that time; it should not be presented as a measured instantaneous cadence.


  ## What was available for analysis?


  The database check found **no push-count samples, daily aggregates or workout-series points** in the selected
  reporting year. It therefore cannot supply measured push ranges, outliers, interval cadence or workout and sleep
  comparisons. No figure is invented for missing data, and missing rows are not zero pushes or evidence about wheelchair
  use.


  If records become available, examine source-specific interval amounts, durations, duplicate candidates and overlaps
  before reporting daily sums. Compare recording density during workouts, and investigate sleep overlap for intervals
  that cross context boundaries. Preserve original records while assessing unusual counts.


  ## How does Push Count relate to wheelchair distance?


  Use [Wheelchair Distance](/knowledge-base/types/HKQuantityTypeIdentifierDistanceWheelchair/) from the same period
  and compatible source. Do not divide an observed distance by a missing push count. Even with both present, coasting,
  downhill travel, power assistance and technique affect travel per recorded push. More pushes may reflect more
  travel, more turns or a different environment; they do not by themselves prove more effective exercise.


  [Exercise Time](/knowledge-base/types/HKQuantityTypeIdentifierAppleExerciseTime/) and [Active Energy](/knowledge-base/types/HKQuantityTypeIdentifierActiveEnergyBurned/)
  are separate metrics. Push counts should not be converted into exercise minutes or calories using an invented
  fixed factor.


  ## What makes a daily total trustworthy?


  Keep source handling and the reporting calendar explicit. Adding all sources can count overlapping estimates twice.
  A workout-specific total may already be included in the day''s raw quantity data. Inspect recording gaps before
  comparing weeks, and distinguish a missing day from a recorded zero.


  This entry does not assign sedentary, active or athlete categories from a push total. The example has no measurements
  to support a range, and equipment, terrain and functional context prevent a simple universal push target.

  '
