    values: "4.5-5.5 m/s (4:50-5:55 min/mile pace)"
  - population: "Elite runners"
    values: "5.5-6.5+ m/s (sub-4:50 min/mile pace)"
  - population: "World record marathon pace"
    values: "~5.9 m/s (4:33 min/mile)"
