unit_description: "Default unit is meters per second (m/s). Runners commonly use pace (min/mile or min/km) which is the inverse of speed. HealthKit stores speed; apps typically convert to pace for display. 1 m/s = 3.6 km/hr = 2.237 mi/hr."
