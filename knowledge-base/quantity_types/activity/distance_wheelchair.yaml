description: '## What does wheelchair distance measure?


  Wheelchair Distance is the cumulative distance traveled using a wheelchair, recorded in meters here. [Apple documents](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/distancewheelchair)
  automatic Apple Watch recording in wheelchair mode and warns that sample data may be condensed or coalesced.


  It answers a different question from [Push Count](/knowledge-base/types/HKQuantityTypeIdentifierPushCount/): distance
  describes travel, while pushes describe propulsion movements. Neither is a step count or a universal measure of
  exertion.


  ## What does one distance record represent?


  | View | Interpretation | Main caveat |

  |---|---|---|

  | Raw interval | Distance attributed to its recorded time span | Duration can vary |

  | Source-specific daily sum | Recorded travel assigned to a reporting day | Boundaries and overlapping intervals
  matter |

  | Distance divided by duration | Interval-average travel rate | Includes stopping or coasting within the interval
  |

  | Distance divided by pushes | Travel per recorded push in an aligned period | Not validated propulsion efficiency
  |


  Store the original interval amount. Dividing by duration produces an average over that interval, rather than instantaneous
  speed. Longer or condensed intervals can have larger amounts without representing a faster journey.


  ## What did the database investigation establish?


  The selected reporting year contained **no wheelchair-distance records, daily aggregates or workout-series points**.
  Consequently, no observed distance range, outliers, recording cadence, workout-versus-sleep comparison or empirical
  graph can be reported. This absence does not establish wheelchair status, non-use or zero travel.


  For a populated export, start with source and interval coverage, then compare amounts and interval lengths during
  recorded workouts and other periods. Sleep overlap deserves inspection for intervals crossing a sleep boundary;
  overlap alone would not prove propulsion during sleep.


  ## Can distance and pushes show how efficiently a chair moves?


  Align both metrics to the same time window and compatible source before calculating a ratio. Check that neither
  period is missing. Coasting, slopes, surfaces, turning, assisted propulsion and chair configuration can change
  travel per push, so the result describes recording context rather than a clinical efficiency score.


  [Active Energy](/knowledge-base/types/HKQuantityTypeIdentifierActiveEnergyBurned/) and [Heart Rate](/knowledge-base/types/HKQuantityTypeIdentifierHeartRate/)
  can add context when available, but they use different estimation and recording methods. A relationship between
  them cannot validate distance accuracy or isolate the effort caused by propulsion.


  ## How should daily trends be read?


  Compare similarly recorded periods within a source. Do not sum competing sources without understanding overlaps
  or add workout distance on top of a daily total that already contains the workout. Calendar changes and condensed
  history can alter the apparent cadence.


  There is no universal healthy wheelchair-distance target in this entry. Functional ability, equipment and accessible
  routes matter; a lower recorded distance is not sufficient to classify someone as inactive. Keep gaps visible,
  and review unusual amounts with duration and neighboring records before excluding them.

  '
