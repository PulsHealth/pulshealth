related_types:
- identifier: HKQuantityTypeIdentifierTimeInDaylight
  relationship: Daylight minutes cannot be converted to dietary vitamin D or a serum concentration.
- identifier: HKQuantityTypeIdentifierDietaryCalcium
  relationship: Calcium and vitamin D intake logs are distinct from measured absorption or bone status.
- identifier: HKQuantityTypeIdentifierDietaryFatTotal
  relationship: Food or supplement context may help review intake; fat mass cannot quantify vitamin D absorption.
