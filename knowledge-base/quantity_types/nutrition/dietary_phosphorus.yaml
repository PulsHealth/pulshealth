description: '## What does Apple Health phosphorus intake record?


  Dietary Phosphorus is a cumulative mass quantity for the phosphorus amount recorded as consumed. Amounts on this
  page are expressed in **mg**. One sample can represent a food portion, a supplement entry or a source-generated
  daily total; it is not necessarily a whole day. [Apple defines this quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryphosphorus).


  ## Is dietary phosphorus the same as blood phosphate?


  Dietary Phosphorus records the mass of phosphorus logged as consumed. It is not a blood phosphate concentration,
  and it is not the total mass of a phosphate-containing ingredient. Phosphorus contributes to bone structure and
  many cellular processes; intake data alone cannot establish those functions or a clinical phosphate disorder.
  [NIH describes phosphorus intake and status](https://ods.od.nih.gov/factsheets/Phosphorus-HealthProfessional/).


  ## Why are food additives and incomplete labels important?


  Food forms and additives can differ in phosphorus availability. A food app may not have phosphorus for every product,
  particularly when its underlying label or food record omits it. The absence of a phosphorus field is not evidence
  that the food contains none. Choose an appropriate product record and keep the amount actually logged separate
  from any assumption about absorption.


  | What you see | How to read it |

  | --- | --- |

  | Phosphorus in mg | Logged nutrient mass |

  | Phosphate compound mass | Different from phosphorus mass |

  | Missing food database value | Unknown contribution, not zero |

  | Blood phosphate | Separate clinical measurement |


  ## How often is phosphorus recorded?


  The interval between entries reflects logging or synchronization, not nutrient absorption or a validated meal
  schedule. A midnight timestamp may be a daily summary, and multiple entries may have been added later. Review
  source, portion and duration before summing; importing the same meal from two apps can inflate a total. A day
  without entries is missing coverage, not zero intake.


  ## Does a calcium-to-phosphorus ratio tell me enough?


  A ratio can be calculated only when both logs cover compatible foods and days, with the same unit convention.
  It does not establish bone health or an optimal intake balance. A missing calcium entry or an unlogged phosphorus
  additive can change the ratio substantially. Clinical phosphorus management also depends on factors that a food
  log does not measure.


  ## What did the example-data investigation find?


  The researched **365-day reporting window** contained no raw phosphorus samples and no stored phosphorus aggregates.
  Recorded value ranges, unusually large entries, source-specific daily totals, logging gaps and workout or sleep
  comparisons could not be measured. No empirical graph or nutrient-status conclusion is presented. Related measurements
  cannot supply an intake relationship without phosphorus observations.


  ## How can I make the log more useful?


  Check nutrient units and serving count: **1 g = 1,000 mg**, while **1 microgram = 0.001 mg**. Keep compatible
  contributions within a source and state how many days have credible logs. [Apple allows apps to write selected
  nutrition types](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers), so another nutrient
  being present does not establish complete phosphorus coverage. Review [contributing Health sources](https://support.apple.com/en-us/108779)
  after changing logging apps.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is documented here but is not in the current PulsHealth sync catalog. The missing database
  rows therefore cannot establish whether Apple Health on the phone contains entries. Milligrams on this page are
  an explanatory display unit, not a promise of current sync support.

  '
