description: '## What does Apple Health dietary selenium measure?


  Dietary Selenium stores the amount of selenium recorded as consumed from food or supplements. Each entry contributes
  to a cumulative intake total. [Apple''s type definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryselenium)
  uses mass units. This page''s display unit is **mcg**; a nutrient amount is distinct from the weight of the food
  or tablet. It is not a blood concentration or a measurement of body stores.


  ## Why can selenium estimates vary so much?


  Selenium is used in selenoproteins involved in processes including thyroid hormone metabolism. Food content can
  vary with soil and origin; Brazil nuts are a particularly variable source. An app''s standard food value estimates
  the serving rather than measuring it. [NIH''s selenium review](https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/)
  explains this variation.


  ## What should I check before adding the entries?


  | Question | What to inspect |

  | --- | --- |

  | One nut, one serving or one ounce? | Verify the food database portion and quantity; variable food composition
  adds uncertainty even with correct units.

  | Could the unit explain a large value? | 1 mg equals 1,000 mcg; check the source value before conversion. |

  | Can two apps be combined? | Look for the same food or supplement imported twice; preserve provenance. |

  | Does a missing day mean no intake? | No. Food may have been consumed without a record, or the nutrient field
  may be unavailable. |


  A source-specific daily sum answers how much was **recorded** on that reporting day. It does not establish a complete
  diet. Keep the number of logged days visible and leave unrecorded days missing rather than filling them with zero.
  A population intake recommendation is a daily dietary planning value, not a normal range for a single sample.


  ## How often are records created?


  Recording cadence follows the contributing app or manual log. Entries can represent servings, retrospective meals
  or an imported daily total. Several records saved together need not mean several doses were consumed simultaneously.
  Sample start and end times describe the source''s interval; they do not independently verify ingestion time.


  Workout and sleep overlap can identify timestamps for review, but cannot show nutrient loss, absorption or a sleep
  effect. A late-night entry may simply be delayed logging. Investigate source behavior before comparing intervals
  or assigning a physiological explanation.


  ## Is example data available?


  The **365-day reporting window** contained no raw selenium samples, stored aggregates or workout-series observations
  for this type. Ranges, outliers, logging intervals, workout and sleep comparisons, and empirical relationships
  were therefore unavailable. No measured distribution or graph is presented. Missing records do not establish zero
  intake or deficiency.


  The current PulsHealth sync catalog does not include this identifier. A knowledge-base page documents a HealthKit
  type; it does not establish that the current app synchronizes it. This coverage limitation is separate from what
  may exist in Apple Health or another food app.


  ## How should I relate this to other health data?


  Iodine and selenium have different roles in thyroid biology. Their daily food logs can describe recorded intake
  patterns, but cannot measure thyroid function or show that supplementation caused a change. Keep food and supplement
  entries identifiable so a high total can be traced to its source.


  ## How can I make future records more useful?


  Check that the app actually writes this nutrient to Apple Health, then inspect a known food or supplement entry.
  Retain serving counts, units and source information. Optional food metadata can help identify a contribution,
  but does not guarantee a complete meal or identify supplement chemistry. [Apple''s data-source controls](https://support.apple.com/en-us/108779)
  explain how to review contributing apps. If an intake comparison raises a concern, establish logging completeness
  before interpreting it clinically.

  '
