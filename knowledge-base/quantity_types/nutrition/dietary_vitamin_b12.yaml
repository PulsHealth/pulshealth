  limitations: Fresh 365-day database coverage and primary sources reviewed; no empirical analysis was performed
    because no raw samples or aggregates were available for this type. Values, outliers, cadence, source patterns,
    workout/sleep context and empirical nutrient relationships were unavailable. Missing logs do not establish
    zero intake. Chemical form, food-bound versus supplemental B12, absorption and body stores cannot be recovered
    from intake mass. A supplement record is not a blood B12 result.
