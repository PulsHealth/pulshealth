recording_behavior:
  reviewed_on: '2026-10-14'
  shape: Cumulative recorded nutrient mass; a sample may represent a serving, meal or source-defined contribution.
  cadence: Source-specific logging and import cadence, not continuous nutrient sensing. No intervals were observed
    in the reviewed data.
  context: Workout and sleep overlap describes recorded timestamps; ingestion time and absorption remain unverified.
  coverage: No samples or aggregates in the reviewed window. Missing entries are unavailable coverage, not
    zero intake.
  aggregation: Sum compatible source contributions after unit, serving and duplicate review; retain logged-day
    counts and source nutrient conventions.
  metadata: Optional food context cannot identify every nutrient form, ingestion time or explicit meal membership.
