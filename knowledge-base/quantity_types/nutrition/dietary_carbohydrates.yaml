description: '## What are dietary carbohydrates in Apple Health?


  Dietary Carbohydrates records carbohydrate intake logged by a source app or manual entry. HealthKit defines a
  cumulative mass quantity; PulsHealth stores it in **g**. These records are food-intake estimates, not blood glucose
  readings. See [Apple''s definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarycarbohydrates).


  ## Is this total carbohydrate or net carbohydrate?


  Check the source''s definition. A marketing term such as “net carbs” can use different subtraction rules and should
  not be silently treated as an equivalent total. Apple models sugar and fiber as carbohydrate detail. **Do not
  add sugar or fiber again to an existing carbohydrate total.** [Apple''s nutrition hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers)
  explains the parent and subcategory relationship.


  | A common source of confusion | What to verify |

  | --- | --- |

  | Total versus net carbohydrate | The source app''s calculation and field |

  | A food label''s amount | Serving size and servings actually eaten |

  | Several entries for a meal | Whether each is a component or an imported total |

  | Few logged days | Whether comparisons use similarly complete logs |


  ## What is a meaningful carbohydrate range?


  An individual food sample, a meal and a daily sum have different denominators. There is no universal healthy sample
  size. A zero entry may be a logged zero for one food; a missing day does not establish a low-carbohydrate diet
  or fasting. Review unusually large values for portions and units before making dietary conclusions. [FDA''s label
  guide](https://www.fda.gov/food/nutrition-facts-label/whats-nutrition-facts-label) explains serving-based quantities.


  ## How often are carbohydrates recorded?


  The timing follows logging and syncing. A short interval between samples can reflect several foods in a meal or
  delayed batch entry. A long interval can reflect missed logs. Neither describes a continuous physiological carbohydrate
  signal. Start-to-start gaps should be summarized within the source rather than pooled across competing food apps.


  ## How do carbohydrates relate to calories and glucose?


  Four kcal per gram is a rough bookkeeping check; actual label calculations can account for fiber, sugar alcohols,
  specific factors and rounding. See [the labeling regulation](https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-101/subpart-A/section-101.9).
  To compare with glucose, credible meal time and adequately timed glucose measurements are needed; simultaneous
  database timestamps alone are insufficient. A logged entry alone does not establish fuel availability or a glucose response to the nutrient.


  ## What did the database investigation support?


  The researched **365-day reporting window** had no raw carbohydrate samples and no stored carbohydrate aggregates.
  Measured ranges, outliers, meal gaps and associations with calories, workout or sleep context were unavailable.
  No empirical glucose-response or dietary-pattern claim is made.


  ## How can I improve comparisons?


  Keep portions and carbohydrate definitions consistent. Analyze source-specific recorded daily sums and state logged-day
  coverage. Check [Health''s data sources](https://support.apple.com/en-us/108779) for repeated imports. A change
  in food database or net-carbohydrate settings can alter the records without proving a change in food consumption.

  '
