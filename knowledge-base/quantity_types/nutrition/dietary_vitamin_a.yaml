description: '## What does Apple Health dietary vitamin A measure?


  Dietary Vitamin A records an amount attributed to food or supplements. [Apple defines it](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryvitamina)
  as a **cumulative mass quantity**. This page uses **mcg** for display. It records intake contributions rather
  than continuously measuring the body. A record may describe one food, one supplement or a source''s daily total.


  ## Are micrograms, RAE and IU interchangeable?


  Vitamin A supports vision and normal cell development. Food and supplements may supply preformed vitamin A or
  provitamin A carotenoids. Those forms have different activity equivalents. [NIH ODS](https://ods.od.nih.gov/factsheets/VitaminA-HealthProfessional/)
  expresses intake recommendations as **retinol activity equivalents (RAE)**.


  HealthKit defines cumulative **mass**, without guaranteeing that every source has normalized its figure to RAE.
  Check the food database or supplement label before making that comparison.


  | Label or field | What to verify |

  | --- | --- |

  | mcg | Mass alone does not identify the form or activity basis |

  | mcg RAE | Confirm that the source actually calculated RAE |

  | IU | Conversion needs the form and whether carotenoids came from food or supplements |

  | Total vitamin A | Does not isolate the preformed portion |


  The upper intake limit for preformed vitamin A cannot be applied indiscriminately to combined carotenoid and
  retinol logs. This quantity also does not measure liver stores or serum retinol.


  ## How should portions and unusual amounts be checked?


  First identify the record''s scope: a serving, a whole package or a daily summary. Inspect the source, unit
  and food description before combining amounts. The same meal imported through two apps can appear twice. A large
  entry may reflect a supplement, a portion multiplier or a unit error; its size alone cannot establish excessive
  intake or toxicity.


  Intake reference values apply to a defined population and daily intake basis. They are not a physiological range
  for arbitrary sample amounts. Incomplete logs and unknown nutrient-form conversions make those comparisons especially
  uncertain.


  ## Does recording cadence reveal meals, workouts or sleep?


  Gaps between records describe logging or synchronization behavior. They do not establish meal timing, digestion
  or absorption. A cluster can come from retrospective logging, while a midnight timestamp may represent a day
  summary.


  A nutrient record overlapping a workout or sleep interval describes timestamp context. It does not demonstrate
  consumption during that interval or a physiological response. Comparisons with other nutrient types require
  compatible sources, portions and reporting-day coverage. Missing records remain unknown intake.


  ## What did the database investigation support?


  The investigated **365-day reporting window** contained no raw vitamin A samples or stored aggregates for this
  type. Value ranges, extreme portions, source distributions, interval cadence, time-of-day patterns and workout
  or sleep comparisons were unavailable. Relationships with other types could not be measured without vitamin
  A observations. No measured chart is presented.


  These vitamin types are documented in the knowledge base but are **not collected by the current PulsHealth sync
  catalog**. Database absence therefore does not establish whether the phone''s Apple Health store contains these
  records, or imply zero consumption or deficiency.


  ## How can I make these records easier to interpret?


  Use a consistent food database, confirm serving sizes and include supplements explicitly. Check whether imported
  totals contain individual food entries already recorded elsewhere. Summarize compatible contributions by source
  and reporting day, and show **days with logs** separately from recorded amounts.


  [Apple''s nutrition documentation](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers)
  allows selected nutrient types to be recorded, so a calorie entry does not guarantee a vitamin A entry. [Review
  contributing sources](https://support.apple.com/en-us/108779) when changing nutrition apps. Optional food descriptions
  may help, but a matching timestamp does not prove membership in a HealthKit Food correlation.

  '
metadata_keys:
- key: HKMetadataKeyFoodType
  description: Optional food description supplied by the source; does not guarantee nutrient form, serving size
    or complete diet coverage.
- key: HKMetadataKeyWasUserEntered
  description: Optional indicator of user-entered data. Missing metadata does not establish automatic measurement.
related_types:
- identifier: HKQuantityTypeIdentifierDietaryFatTotal
  relationship: Fat-soluble vitamin uptake depends on more than logged fat mass; co-logging does not quantify
    absorption.
- identifier: HKQuantityTypeIdentifierDietaryZinc
  relationship: Zinc and vitamin A logs may help inspect food-source coverage; they do not establish transport-protein
    activity.
- identifier: HKQuantityTypeIdentifierDietaryVitaminD
  relationship: Separate intake amounts and chemical forms before comparing these fat-soluble vitamins.
