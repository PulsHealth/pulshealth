description: '## What does a dietary fiber record contain?


  Dietary Fiber stores a logged amount of fiber in **g**. [Apple treats it as a cumulative mass quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryfiber),
  rather than a continuous measurement of digestion or bowel function. A food source may write fiber without
  writing every other nutrient.


  ## Should fiber be added to carbohydrate totals?


  Fiber is detail within total carbohydrate in [Apple''s nutrition hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers).
  Adding it again to a total-carbohydrate sample double counts that contribution. Compare compatible portions
  from the same source; differences can reflect partial logs, label rounding or source definitions.


  | Question | What the record can tell you |

  | --- | --- |

  | Total fiber eaten | A recorded contribution, subject to logging coverage |

  | Soluble versus insoluble fiber | Not resolved by this single quantity |

  | Net carbohydrates | Requires the source''s calculation and ingredient information |

  | Digestive response | Not measured by fiber grams or sample duration |


  ## How do labels and daily goals differ?


  [FDA''s label Daily Value is 28 g](https://www.fda.gov/food/nutrition-facts-label/daily-value-nutrition-and-supplement-facts-labels).
  It is a label reference, not a normal interval for each food entry. Comparisons need reasonably complete
  days. [FDA''s fiber definition](https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/questions-and-answers-dietary-fiber)
  includes qualifying naturally occurring and isolated or synthetic nondigestible carbohydrates; ingredient
  descriptions can matter when comparing different food databases.


  ## Can I infer symptoms or calories from fiber grams?


  This total does not identify fiber composition, fermentation or an individual''s tolerance. It cannot diagnose
  constipation, establish a deficiency or predict symptoms. Avoid reconstructing exact food calories with a
  single assumed fiber factor; retain the source''s energy amount and review its labeling method.


  ## Can PulsHealth collect this type?


  This type is included in the current PulsHealth collection catalog. Database coverage still depends on records
  being present and readable in HealthKit.


  ## When are entries recorded, and what does context mean?


  Cadence follows food logging or source synchronization, not continuous sensing. A record whose timestamp
  overlaps a workout or recorded sleep may describe an earlier meal or a daily summary. Review start times,
  durations and source history before discussing meal timing. Missing days remain unlogged rather than zero
  intake. [Health''s source controls](https://support.apple.com/en-us/108779) help when reviewing overlapping
  apps.


  ## What did the database investigation establish?


  The researched **365-day reporting window** contained no raw samples or stored aggregates for this nutrient.
  Recorded ranges, unusual portions, source overlap, recording intervals and workout or sleep comparisons were
  unavailable. Related nutrient comparisons were unavailable because there were no records for this type. No
  empirical nutrient association or measured chart is supported. These missing records do not establish zero
  consumption or a deficient diet.


  ## How can I make the log easier to interpret?


  Check the represented serving, preserve source-specific daily totals and state how many days have usable
  logs. Review duplicate food imports before summing sources. Food descriptions may clarify portions when supplied,
  but absent metadata does not prove automatic measurement or complete recording.

  '
