description: '## Does polyunsaturated fat mean omega-3?


  Dietary Fat Polyunsaturated records a total logged polyunsaturated-fat amount in **g**. [Apple defines it
  as a cumulative mass quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryfatpolyunsaturated).
  It does not specify an omega-3 dose or an omega-6 amount.


  ## Which fatty-acid details are missing?


  [NIH describes omega-3 and omega-6 as major PUFA classes](https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/),
  with distinct omega-3 forms including ALA, EPA and DHA. One combined HealthKit quantity cannot separate these
  components or establish an omega-6-to-omega-3 ratio.


  | Desired answer | Additional information needed |

  | --- | --- |

  | Total recorded PUFA | Compatible portions and source coverage |

  | Omega-3 or omega-6 amount | Verified food or supplement composition |

  | EPA and DHA dose | Product-specific constituent amounts |

  | Fatty-acid ratio | Both constituent amounts, not the combined PUFA total |


  ## Should this be added to total fat?


  PUFA is a component of total fat in [Apple''s nutrition hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers).
  Adding both double counts the same contribution. Incomplete subtype composition is common enough that an
  absent record must stay missing; it cannot establish zero PUFA in food.


  ## Can a PUFA trend show health benefit or excess?


  The log describes recorded intake, with food-database and portion uncertainty. It cannot establish absorption,
  tissue fatty-acid levels or a supplement''s effect. There is no general normal range for each food sample.
  Review supplement composition separately, and avoid applying an omega-3-specific dose recommendation to total
  PUFA grams.


  ## Can PulsHealth collect this type?


  This HealthKit concept is documented in the knowledge base, but it is absent from the current PulsHealth
  collection catalog. Automatic sync is not provided for this type by that catalog. Its absence from the database
  does not establish that Apple Health contains no records.


  ## Do entry timestamps establish meal timing?


  Entry timing follows food logging or source synchronization. A timestamp may describe an earlier meal
  or a daily summary. Review start times,
  durations and source history before discussing meal timing. Missing days remain unlogged rather than zero
  intake. [Health''s source controls](https://support.apple.com/en-us/108779) help when reviewing overlapping
  apps.


  ## What did the database investigation establish?


  The researched **365-day reporting window** contained no raw samples or stored aggregates for this nutrient.
  Recorded ranges, unusual portions, source overlap, recording intervals were
  unavailable. Related nutrient comparisons were unavailable because there were no records for this type. No
  empirical nutrient association or measured chart is supported. These missing records do not establish zero
  consumption or a deficient diet.


  ## How can I make the log easier to interpret?


  Check the represented serving, preserve source-specific daily totals and state how many days have usable
  logs. Review duplicate food imports before summing sources. Food descriptions may clarify portions when supplied,
  but absent metadata does not prove automatic measurement or complete recording.

  '
