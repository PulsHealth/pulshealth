description: '## What does total dietary fat measure?


  Dietary Fat Total records fat intake logged from food. HealthKit defines a cumulative mass quantity; PulsHealth
  stores it in **g**. It is distinct from Body Fat Percentage and blood lipid measurements. See [Apple''s definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryfattotal).


  ## Should I add saturated and unsaturated fat to the total?


  No. Total fat already includes its components. Apple represents saturated, monounsaturated and polyunsaturated
  fat as nutritional detail beneath total fat. Adding them again double counts the contribution. An app can log
  selected nutrients, so absent subtype records do not establish that those fats were absent from the food. See
  [Apple''s nutrition hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers).


  | Before using a fat total | Check |

  | --- | --- |

  | Sample versus daily total | Whether it is a serving, meal or whole-day contribution |

  | Grams versus percent | Grams eaten are not body-fat percentage or calorie percentage |

  | Oil or recipe entries | Actual portion and recipe serving count |

  | Multiple contributing apps | Whether the same food was imported twice |


  ## What is a meaningful fat range?


  The quantity of one food sample is not a daily dietary target. A recorded daily sum requires reasonably complete
  logging before it can be compared with an individualized plan. Large entries may reflect serving estimates or
  an imported daily summary, while a missing day does not mean zero fat intake. [FDA''s Nutrition Facts guide](https://www.fda.gov/food/nutrition-facts-label/whats-nutrition-facts-label)
  explains portions and serving-based amounts.


  ## Should fat grams match food calories?


  Nine kcal per gram is a useful rough energy contribution. A full macro check also needs carbohydrate and protein
  amounts for the same foods and source. Label calculations can use specific factors and rounding, so exact agreement
  is not required. [The FDA labeling regulation](https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-101/subpart-A/section-101.9)
  describes accepted calculations. Neither the fat record nor a macro formula proves how the source app generated
  its calorie value.


  ## How often is fat recorded, and does workout or sleep timing matter?


  Cadence follows food entries or source syncing. A sample interval is not a digestion interval. A record may be
  saved long after the meal, and a midnight entry may be a daily total. Matching timestamps to a workout or recorded
  sleep is a logging-context check; it cannot establish absorption, exercise response or fat use. Daily comparisons
  should state the number of days with usable logs.


  ## What did the database investigation support?


  The researched **365-day reporting window** contained no raw total-fat samples or stored total-fat aggregates.
  Recorded ranges, extreme portions, cadence, macro-energy reconciliation and workout or sleep comparisons were
  unavailable. No measured distribution or health outcome association is presented.


  ## How can I make a fat log easier to read?


  Check recipe portions and cooking-oil estimates, then use consistent source-specific daily sums. Keep total fat
  separate from its subclasses. Review [Health''s data-source controls](https://support.apple.com/en-us/108779)
  when connecting another app. A food-log trend should not be presented as a trend in body fat or blood cholesterol.

  '
metadata_keys:
- key: HKMetadataKeyFoodType
  description: 'Optional if provided by the source: String identifier for the fat source (e.g., ''olive oil'', ''butter'',
    ''avocado'')'
- key: HKMetadataKeyWasUserEntered
  description: 'Optional if provided: indicates that the user entered the sample. Absence of this key does not prove
    automatic measurement.'
- key: HKMetadataKeyExternalUUID
  description: 'Optional if provided by the source: Unique identifier from source app for synchronization'
related_types:
- identifier: HKQuantityTypeIdentifierDietaryEnergyConsumed
  relationship: Related food-energy logs require matching source and logged-day coverage.
- identifier: HKQuantityTypeIdentifierDietaryProtein
  relationship: A nutrient component may be logged without other nutrients.
- identifier: HKQuantityTypeIdentifierDietaryCarbohydrates
  relationship: Carbohydrate totals and components have distinct semantics.
- identifier: HKQuantityTypeIdentifierDietaryWater
  relationship: Recorded water volume is not a measurement of hydration.
- identifier: HKQuantityTypeIdentifierDietaryCaffeine
  relationship: Caffeine dose is distinct from beverage volume.
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Body-mass comparisons require compatible timing and do not establish dietary causality.
- identifier: HKQuantityTypeIdentifierBodyFatPercentage
  relationship: Body-fat percentage is a separate body-composition measurement; food-fat grams do not directly measure
    or predict it.
