description: '## Does this measure cholesterol in my blood?


  Dietary Cholesterol records the amount of cholesterol consumed as logged by a source. The entry uses **mg**
  for display. It is a cumulative food quantity; it does not measure blood cholesterol, LDL, HDL or triglycerides.
  [Apple defines this as consumed cholesterol](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarycholesterol).


  ## What does a cholesterol amount represent?


  A sample may describe one food, a recipe portion, a meal or an imported daily total. Read the source and
  serving information before treating it as a day of intake. A large value can arise from a portion estimate
  or unit error; the sample alone cannot establish cardiovascular risk.


  | Comparison | Correct interpretation |

  | --- | --- |

  | Dietary cholesterol in mg | Recorded food contribution |

  | Blood cholesterol concentration | A separate laboratory measurement |

  | Cholesterol alongside saturated fat | Distinct food constituents; retain separate totals |

  | Cholesterol alongside food calories | Do not apply the total-fat calorie factor to cholesterol |


  ## Is 300 mg a normal range?


  [FDA lists a 300 mg Daily Value](https://www.fda.gov/food/nutrition-facts-label/daily-value-nutrition-and-supplement-facts-labels)
  for cholesterol on food labels. This supports label comparison; it is not a reference range for a meal sample,
  a minimum intake requirement or an individualized treatment target. A food log also cannot show whether a
  dietary change caused a change in LDL.


  ## Which other logs help explain it?


  Look at saturated-fat and total-fat records from the same food source, along with recipe portions and overall
  food-log coverage. Matching days is useful bookkeeping, but a common date does not prove the nutrients belong
  to the same HealthKit food correlation. Blood-test interpretation requires separate measurements and clinical
  context.


  ## Can PulsHealth collect this type?


  This HealthKit concept is documented in the knowledge base, but it is absent from the current PulsHealth
  collection catalog. Automatic sync is not provided for this type by that catalog. Its absence from the database
  does not establish that Apple Health contains no records.


  ## When are entries recorded, and what does context mean?


  Cadence follows food logging or source synchronization, not continuous sensing. A record whose timestamp
  overlaps a workout or recorded sleep may describe an earlier meal or a daily summary. Review start times,
  durations and source history before discussing meal timing. Missing days remain unlogged rather than zero
  intake. [Health''s source controls](https://support.apple.com/en-us/108779) help when reviewing overlapping
  apps.


  ## What did the database investigation establish?


  The researched **365-day reporting window** contained no raw samples or stored aggregates for this nutrient.
  Recorded ranges, unusual portions, source overlap, recording intervals and workout or sleep comparisons were
  unavailable. Related nutrient comparisons were unavailable because there were no records for this type. No
  empirical nutrient association or measured chart is supported. These missing records do not establish zero
  consumption or a deficient diet.


  ## How can I make the log easier to interpret?


  Check the represented serving, preserve source-specific daily totals and state how many days have usable
  logs. Review duplicate food imports before summing sources. Food descriptions may clarify portions when supplied,
  but absent metadata does not prove automatic measurement or complete recording.

  '
