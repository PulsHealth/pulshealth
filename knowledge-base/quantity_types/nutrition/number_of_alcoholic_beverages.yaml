description: |
  ## What does the alcoholic-beverage count measure?

  [Apple HealthKit](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/numberofalcoholicbeverages) stores the number of standard alcoholic drinks as a cumulative quantity in **count** units. It is a logged amount, rather than beverage volume, a count of containers or a blood-alcohol reading.

  The writing source determines how a serving becomes a standard-drink count. Check that convention before comparing apps or converting counts to grams of alcohol. The identifier and count unit do not carry a region, alcohol-by-volume percentage or serving size.

  ## Is one glass always one standard drink?

  No. Glass size, recipe and alcohol concentration matter. The [U.S. NIAAA definition](https://rethinkingdrinking.niaaa.nih.gov/how-much-too-much/whats-standard-drink) uses 14 grams of pure alcohol per standard drink. Approximate examples under that convention are:

  | Beverage | Serving | Alcohol by volume |
  | --- | --- | --- |
  | Regular beer | 12 U.S. fluid ounces | 5% |
  | Table wine | 5 U.S. fluid ounces | 12% |
  | Distilled spirits | 1.5 U.S. fluid ounces | 40% |

  These are explanatory examples, not measured user data or a recommended intake. A larger pour or stronger drink can represent multiple equivalents. Retain fractional counts when a source uses them. The [NIAAA drink-size calculator](https://rethinkingdrinking.niaaa.nih.gov/tools/calculators/alcohol-drink-size-calculator) illustrates how strength and serving size change the count. Do not apply the U.S. conversion to every source without checking its normalization.

  ## What records were available for this review?

  The 365-day example coverage review found **no raw alcoholic-beverage samples or stored aggregates**. It therefore provides no measured value range, outlier distribution, source pattern, cadence or workout/sleep comparison. An empty history does not establish abstinence, zero consumption or complete tracking.

  The reviewed PulsHealth sync catalog does not include this identifier. Database absence therefore does not establish what is present in the phone’s HealthKit store.

  No measured graph is shown because there are no observations for this type in the selected window. The source guidance here explains how to interpret records when they are available.

  ## Why does logging cadence matter?

  A source can write a point entry for a drink, an interval for several drinks or a retrospective daily total. Apple’s example uses a point sample. Repeated timestamps and batch imports can reflect logging behavior rather than a drinking schedule.

  Sum compatible contributions within a source after checking corrections and duplicate imports. Show how many days have records, keep unrecorded days unknown, and distinguish an explicitly logged zero from a missing entry. Do not divide a count by a zero-duration timestamp to estimate a consumption rate.

  ## Can I compare drinking with sleep, workouts or heart rate?

  Such comparisons require reliable consumption times and sufficient logging coverage. A log timestamp during a workout or asleep interval does not prove alcohol was consumed then. Bedtime, exercise, illness and recording behavior can change alongside reported intake, so an aligned trend is descriptive rather than evidence of an alcohol effect.

  [Sleep Analysis](/knowledge-base/types/HKCategoryTypeIdentifierSleepAnalysis/), [Heart Rate](/knowledge-base/types/HKQuantityTypeIdentifierHeartRate/) and [HRV SDNN](/knowledge-base/types/HKQuantityTypeIdentifierHeartRateVariabilitySDNN/) have separate measurement and coverage rules. No empirical relationship was estimated here because alcohol records were absent.

  ## What can these records tell me about health risk?

  Use a log as context for a discussion, with serving definitions and missing days visible. A recorded count does not measure impairment, establish a safe personal intake or diagnose alcohol use disorder. It cannot be converted to [Blood Alcohol Content](/knowledge-base/types/HKQuantityTypeIdentifierBloodAlcoholContent/) from count alone.

  Health interpretation depends on timing, medications, pregnancy, medical history and individual circumstances. Avoid labeling a logged day “healthy” simply because its count falls below a generic threshold; the data type provides no such certification.
metadata_keys:
- key: HKMetadataKeyWasUserEntered
  description: Optional indicator that a sample was entered by the user; does not verify serving size or completeness.
related_types:
- identifier: HKCategoryTypeIdentifierSleepAnalysis
  relationship: Descriptive comparisons need verified consumption timing and sleep coverage; no causal inference.
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: Separate cardiovascular measurements; temporal proximity does not establish an alcohol effect.
- identifier: HKQuantityTypeIdentifierHeartRateVariabilitySDNN
  relationship: Source-specific HRV comparison requires compatible timing and sufficient recorded days.
- identifier: HKQuantityTypeIdentifierBloodAlcoholContent
  relationship: A distinct concentration measurement that cannot be derived from logged counts alone.
- identifier: HKQuantityTypeIdentifierDietaryEnergyConsumed
  relationship: Separate energy logs may include beverage energy; avoid duplicate accounting.
