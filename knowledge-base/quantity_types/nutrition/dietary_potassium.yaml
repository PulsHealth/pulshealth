description: '## What does Apple Health potassium intake record?


  Dietary Potassium is a cumulative mass quantity for the potassium amount recorded as consumed. Amounts on this
  page are expressed in **mg**. One sample can represent a food portion, a supplement entry or a source-generated
  daily total; it is not necessarily a whole day. [Apple defines this quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarypotassium).


  ## Does potassium intake show blood potassium or hydration?


  No. Dietary Potassium records logged nutrient mass, while blood potassium is a concentration affected by physiological
  regulation and clinical context. A food log cannot diagnose low or high blood potassium. Potassium supports cell
  function and has an important relationship with sodium, but the numeric intake is not a measure of electrolyte
  balance. [NIH explains potassium](https://ods.od.nih.gov/factsheets/Potassium-HealthProfessional/).


  ## How should I handle potassium salts and salt substitutes?


  Check whether the amount refers to elemental potassium or the full potassium-containing compound. Salt substitutes
  may contribute potassium, while a log that records only food may miss them. Product-specific portions matter.
  The potassium quantity also cannot tell whether a particular intake is appropriate in a medical situation; avoid
  deriving a supplement or salt-substitute plan from an app total.


  | What you see | How to read it |

  | --- | --- |

  | Potassium in mg | Logged mineral mass |

  | Potassium salt mass | Includes other components |

  | Sodium-to-potassium ratio | Requires both logs and explicit mass or molar units |

  | Blood potassium | Not inferred from dietary intake |


  ## How often is potassium recorded?


  The interval between entries reflects logging or synchronization, not nutrient absorption or a validated meal
  schedule. A midnight timestamp may be a daily summary, and multiple entries may have been added later. Review
  source, portion and duration before summing; importing the same meal from two apps can inflate a total. A day
  without entries is missing coverage, not zero intake.


  ## How can I compare potassium with sodium or blood pressure?


  Use compatible source and day coverage for the two dietary totals. A ratio of milligram amounts differs from a
  ratio of molar amounts, so name the convention. Blood pressure measurements also need credible timing and multiple
  observations. Any relationship in a food log is exploratory; it does not show a personal causal response or justify
  filling missing potassium values.


  ## What did the example-data investigation find?


  The researched **365-day reporting window** contained no raw potassium samples and no stored potassium aggregates.
  Recorded value ranges, unusually large entries, source-specific daily totals and logging gaps
  could not be measured. No empirical graph or nutrient-status conclusion is presented. Related measurements
  cannot supply an intake relationship without potassium observations.


  ## How can I make the log more useful?


  Check nutrient units and serving count: **1 g = 1,000 mg**, while **1 microgram = 0.001 mg**. Keep compatible
  contributions within a source and state how many days have credible logs. [Apple allows apps to write selected
  nutrition types](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers), so another nutrient
  being present does not establish complete potassium coverage. Review [contributing Health sources](https://support.apple.com/en-us/108779)
  after changing logging apps.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is documented here but is not in the current PulsHealth sync catalog. The missing database
  rows therefore cannot establish whether Apple Health on the phone contains entries. Milligrams on this page are
  an explanatory display unit, not a promise of current sync support.

  '
