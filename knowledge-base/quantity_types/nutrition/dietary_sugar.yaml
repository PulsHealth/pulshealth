description: '## Does Apple Health sugar mean added sugar?


  [Dietary Sugar is a cumulative sugar amount](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarysugar),
  displayed here in **g**. The type alone does not classify a food''s sugar as added, naturally occurring or
  free sugar. Check the source''s definition and food details before comparing it with a dietary recommendation.


  ## What is the difference between total, added and free sugar?


  These terms answer different questions. [FDA''s label guide](https://www.fda.gov/food/nutrition-facts-label/added-sugars-nutrition-facts-label)
  distinguishes total and added sugars. [WHO''s free-sugars definition](https://www.who.int/news/item/04-03-2015-who-calls-on-countries-to-reduce-sugars-intake-among-adults-and-children)
  also includes sugars in honey, syrups and fruit juices, as well as sugars added to foods and drinks.


  | Term | What must be known |

  | --- | --- |

  | Logged sugar grams | Amount and serving represented by the source |

  | Added sugar | Whether sugars were added during preparation or manufacture |

  | Free sugar | Food context, including juice, honey and syrup |

  | Blood glucose | A separate physiological measurement |


  ## Can I compare this with a sugar limit?


  A total-sugar sample cannot be substituted for an added-sugar or free-sugar total. FDA''s added-sugar Daily
  Value and WHO''s free-sugar guidance address specific definitions; they are not upper bounds for every recorded
  Dietary Sugar value. First establish the definition, day coverage and compatible food-energy denominator.


  ## Should sugar and carbohydrate grams be summed?


  No. Sugar is detail within total carbohydrate in [Apple''s hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers).
  Adding both double counts. A logged sugar amount also cannot explain a blood-glucose response without actual
  eating time, food context and suitable glucose measurements; a shared timestamp is insufficient.


  ## Can PulsHealth collect this type?


  This type is included in the current PulsHealth collection catalog. Database coverage still depends on records
  being present and readable in HealthKit.


  ## Do entry timestamps establish meal timing?


  Entry timing follows food logging or source synchronization. A timestamp may describe an earlier meal
  or a daily summary. Review start times,
  durations and source history before discussing meal timing. Missing days remain unlogged rather than zero
  intake. [Health''s source controls](https://support.apple.com/en-us/108779) help when reviewing overlapping
  apps.


  ## What did the database investigation establish?


  The researched **365-day reporting window** contained no raw samples or stored aggregates for this nutrient.
  Recorded ranges, unusual portions, source overlap, recording intervals were
  unavailable. Related nutrient comparisons were unavailable because there were no records for this type. No
  empirical nutrient association or measured chart is supported. These missing records do not establish zero
  consumption or a deficient diet.


  ## How can I make the log easier to interpret?


  Check the represented serving, preserve source-specific daily totals and state how many days have usable
  logs. Review duplicate food imports before summing sources. Food descriptions may clarify portions when supplied,
  but absent metadata does not prove automatic measurement or complete recording.

  '
