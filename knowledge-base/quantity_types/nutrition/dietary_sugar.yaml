- key: HKMetadataKeyFoodType
  description: Optional food description if supplied; it does not establish portion size or complete composition.
- key: HKMetadataKeyWasUserEntered
  description: Optional indication of user entry; absence does not establish automatic measurement.
- key: HKMetadataKeyExternalUUID
  description: Optional source external identifier; not a universal food identifier or guaranteed cross-app
    duplicate key.
