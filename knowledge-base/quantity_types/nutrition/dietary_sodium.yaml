description: '## What does Apple Health sodium intake record?


  Dietary Sodium is a cumulative mass quantity for the sodium amount recorded as consumed. Amounts on this page
  are expressed in **mg**. One sample can represent a food portion, a supplement entry or a source-generated daily
  total; it is not necessarily a whole day. [Apple defines this quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarysodium).


  ## What is the difference between sodium and salt?


  Dietary Sodium stores the sodium amount entered from foods, drinks and other logged sources. Salt contains sodium
  and other components, so grams of salt are not grams of sodium. For pure table salt, sodium is about 40% of its
  mass; other ingredients and salt substitutes need their own composition. [FDA explains sodium on food labels](https://www.fda.gov/food/nutrition-education-resources-materials/sodium-your-diet).


  ## What daily comparison is useful?


  FDA uses a Daily Value of less than 2,300 mg for sodium. That is general label guidance, not a normal range for
  each HealthKit sample or an individualized treatment target. Compare complete daily logs, not a single food entry,
  and check the serving count. Restaurant recipes, sauces and salt added in cooking can make an apparently complete
  day incomplete.


  | What you see | How to read it |

  | --- | --- |

  | Sodium amount | The nutrient logged, usually in mg |

  | Salt amount | Different mass; do not copy directly |

  | FDA Daily Value | General daily label guidance, not a sample threshold |

  | Partial food log | Cannot show total daily sodium |


  ## How often is sodium recorded?


  The interval between entries reflects logging or synchronization, not nutrient absorption or a validated meal
  schedule. A midnight timestamp may be a daily summary, and multiple entries may have been added later. Review
  source, portion and duration before summing; importing the same meal from two apps can inflate a total. A day
  without entries is missing coverage, not zero intake.


  ## Can sodium logs explain blood pressure or sweat losses?


  Recorded sodium and blood pressure may be compared descriptively when both have adequate coverage, but an association
  does not isolate salt sensitivity or establish causation. Dietary entries do not measure sweat sodium or replacement
  needs. Weight and water records offer context rather than proof of sodium-related fluid changes. Dietary sodium
  also does not diagnose low or high blood sodium.


  ## What did the example-data investigation find?


  The researched **365-day reporting window** contained no raw sodium samples and no stored sodium aggregates. Recorded
  value ranges, unusually large entries, source-specific daily totals and logging gaps
  could not be measured. No empirical graph or nutrient-status conclusion is presented. Related measurements cannot
  supply an intake relationship without sodium observations.


  ## How can I make the log more useful?


  Check nutrient units and serving count: **1 g = 1,000 mg**, while **1 microgram = 0.001 mg**. Keep compatible
  contributions within a source and state how many days have credible logs. [Apple allows apps to write selected
  nutrition types](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers), so another nutrient
  being present does not establish complete sodium coverage. Review [contributing Health sources](https://support.apple.com/en-us/108779)
  after changing logging apps.


  ## Does PulsHealth currently collect this type?


  The current PulsHealth sync catalog includes Dietary Sodium in mg. Database absence still does not establish that
  the phone contains no sodium records or that logging was complete.

  '
