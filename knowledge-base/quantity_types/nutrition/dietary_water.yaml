description: '## What does Apple Health water intake measure?


  Dietary Water stores the volume of water recorded as consumed. A sample is an amount contributed to a cumulative
  total, usually shown in milliliters. It is not a sensor measurement of hydration, body water or sweat loss. HealthKit
  accepts volume units; PulsHealth stores this type in **mL**. [Apple''s type definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarywater)
  describes the recording semantics.


  ## Does the total include food and other drinks?


  Water for hydration comes from plain water, other beverages and moisture in food. A drinking-water app or connected
  bottle may capture only part of that total. Check what the source actually logs before comparing its number with
  guidance for total water intake. [CDC''s hydration overview](https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/)
  explains that needs vary with activity, age and other circumstances.


  | Question | What to check |

  | --- | --- |

  | Is this drinking water or total water? | The source app''s definition and the foods or drinks included |

  | Why is a serving unusually large? | Bottle capacity, serving count and mL versus liters or fluid ounces |

  | Can I combine two apps? | Whether the same drink was saved twice |

  | Does a missing day mean dehydration? | No: intake may have occurred without a record |


  ## How often is water recorded?


  Cadence follows the logging method. Entries may appear after a drink, when a bottle syncs or when a daily total
  is saved. Several samples with the same start time can be separate servings or a batch of retrospective entries;
  they are not evidence that all water was consumed simultaneously. Inspect sample duration and source before treating
  a gap as time between drinks.


  ## Can a water log establish hydration needs?


  A logged timestamp does not establish ingestion time. Workout duration alone cannot calculate sweat losses or a
  fluid prescription. Delayed logging can also shift entries to another reporting day. Compare activity and water
  only on days with meaningful logging coverage.


  ## What did the database investigation support?


  The researched **365-day reporting window** contained no raw water samples and no stored water aggregates. Recorded
  ranges, outliers, logging cadence and workout or sleep comparisons were therefore unavailable. No measured chart
  or intake distribution is presented. This is a data-availability result, not evidence of zero intake or dehydration.


  ## How should I compare water with other measurements?


  Body-mass changes around exercise can have several explanations, and a water log alone cannot isolate fluid balance.
  Caffeine entries can help identify beverage logging but do not tell you the beverage''s water volume. Avoid replacing
  recorded amounts with assumed body-weight formulas. If a clinician has given a fluid limit, that individualized
  plan takes precedence over a generic app goal.


  ## How can I make the log easier to interpret?


  Use consistent units, record the amount actually consumed, and check the source after connecting another app.
  A daily source-specific sum is a **recorded intake total**; completeness remains a separate question. [Apple''s
  data-source controls](https://support.apple.com/en-us/108779) help review which apps contribute records.

  '
metadata_keys:
- key: HKMetadataKeyFoodType
  description: 'Optional if provided by the source: Type of beverage or food contributing to water intake (e.g.,
    ''Water'', ''Coffee'', ''Fruit'')'
- key: HKMetadataKeyWasUserEntered
  description: 'Optional if provided: indicates that the user entered the sample. Absence of this key does not prove
    automatic measurement.'
related_types:
- identifier: HKQuantityTypeIdentifierDietaryEnergyConsumed
  relationship: Related food-energy logs require matching source and logged-day coverage.
- identifier: HKQuantityTypeIdentifierDietaryProtein
  relationship: A nutrient component may be logged without other nutrients.
- identifier: HKQuantityTypeIdentifierDietaryCarbohydrates
  relationship: Carbohydrate totals and components have distinct semantics.
- identifier: HKQuantityTypeIdentifierDietaryFatTotal
  relationship: Total fat includes its subtypes; do not double count components.
- identifier: HKQuantityTypeIdentifierDietaryCaffeine
  relationship: Caffeine dose is distinct from beverage volume.
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Body-mass comparisons require compatible timing and do not establish dietary causality.
