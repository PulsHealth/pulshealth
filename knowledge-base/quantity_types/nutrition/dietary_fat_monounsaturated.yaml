description: '## What is monounsaturated fat in Apple Health?


  This type records the amount of monounsaturated fat consumed as logged in **g**. [Apple defines a cumulative
  mass quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryfatmonounsaturated).
  It describes a food component, rather than a measurement of body fat or a blood lipid result.


  ## How does it fit within total fat?


  Monounsaturated fat is a component of total fat. [Apple''s nutrition hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers)
  allows detailed subtype records alongside a total; the subtype should not be added again to that total. A
  source can omit subtype detail, so missing MUFA records do not establish that the foods contained no monounsaturated
  fat.


  | Quantity | Keep separate from |

  | --- | --- |

  | MUFA grams | Total fat grams already including that component |

  | Cooking-oil volume | Nutrient mass; oil volume is not MUFA grams |

  | Recipe fat estimate | The actual portion consumed |

  | Body-fat percentage | A separate body-composition measurement |


  ## Why might MUFA totals look unexpectedly small or large?


  Some food databases provide total fat but incomplete subtype composition. Recipe serving counts, cooking-oil
  estimates and duplicate imports can also change the recorded amount. Compare same-source logged days and
  inspect portions before interpreting a distribution or flagging unusually large contributions.


  ## Is there a universal normal range for each entry?


  A single food portion has no general normal MUFA range. A dietary plan concerns the broader eating pattern
  and requires adequate logging. [FDA''s current label references](https://www.fda.gov/food/nutrition-facts-label/daily-value-nutrition-and-supplement-facts-labels)
  include total and saturated fat; this page does not substitute those values as MUFA targets. Do not infer
  a missing fat subtype by subtracting incomplete logs from total fat.


  ## Can PulsHealth collect this type?


  This HealthKit concept is documented in the knowledge base, but it is absent from the current PulsHealth
  collection catalog. Automatic sync is not provided for this type by that catalog. Its absence from the database
  does not establish that Apple Health contains no records.


  ## When are entries recorded, and what does context mean?


  Cadence follows food logging or source synchronization, not continuous sensing. A record whose timestamp
  overlaps a workout or recorded sleep may describe an earlier meal or a daily summary. Review start times,
  durations and source history before discussing meal timing. Missing days remain unlogged rather than zero
  intake. [Health''s source controls](https://support.apple.com/en-us/108779) help when reviewing overlapping
  apps.


  ## What did the database investigation establish?


  The researched **365-day reporting window** contained no raw samples or stored aggregates for this nutrient.
  Recorded ranges, unusual portions, source overlap, recording intervals and workout or sleep comparisons were
  unavailable. Related nutrient comparisons were unavailable because there were no records for this type. No
  empirical nutrient association or measured chart is supported. These missing records do not establish zero
  consumption or a deficient diet.


  ## How can I make the log easier to interpret?


  Check the represented serving, preserve source-specific daily totals and state how many days have usable
  logs. Review duplicate food imports before summing sources. Food descriptions may clarify portions when supplied,
  but absent metadata does not prove automatic measurement or complete recording.

  '
