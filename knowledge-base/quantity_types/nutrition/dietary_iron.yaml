description: '## What does Apple Health iron intake record?


  Dietary Iron is a cumulative mass quantity for the iron amount recorded as consumed. Amounts on this page are
  expressed in **mg**. One sample can represent a food portion, a supplement entry or a source-generated daily total;
  it is not necessarily a whole day. [Apple defines this quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryiron).


  ## Can an iron intake log show iron deficiency or anemia?


  Dietary Iron records an entered intake amount. It does not measure hemoglobin, ferritin, iron stores or anemia.
  Food type, absorption, losses and clinical context matter, so a low app total is a reason to review logging coverage
  rather than a diagnosis. [NIH distinguishes iron intake and iron status](https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/).


  ## Does Apple Health distinguish heme and nonheme iron?


  The numeric total does not carry that distinction by itself. Iron from different foods has different availability,
  and food descriptions may supply useful context when the source includes them. For supplements, check elemental
  iron on the label: the iron-containing compound or tablet can weigh more than the iron it provides. Confirm portions
  and avoid adding a supplement twice through two apps.


  | What you see | How to read it |

  | --- | --- |

  | Iron in mg | Logged elemental nutrient amount |

  | Heme or nonheme source | Requires food context; not identified by the number |

  | Compound or tablet mass | Not equivalent to elemental iron |

  | Ferritin or hemoglobin | Clinical measurements, not inferred from intake |


  ## How often is iron recorded?


  The interval between entries reflects logging or synchronization, not nutrient absorption or a validated meal
  schedule. A midnight timestamp may be a daily summary, and multiple entries may have been added later. Review
  source, portion and duration before summing; importing the same meal from two apps can inflate a total. A day
  without entries is missing coverage, not zero intake.


  ## How do vitamin C and menstrual records provide context?


  Vitamin C can affect nonheme iron absorption, but co-logged quantities do not measure the amount absorbed. Menstrual
  records describe separately recorded context; they do not quantify iron loss. Comparisons require actual iron rows and appropriately aligned context, not
  just the presence of these related types.


  ## What did the example-data investigation find?


  The researched **365-day reporting window** contained no raw iron samples and no stored iron aggregates. Recorded
  value ranges, unusually large entries, source-specific daily totals and logging gaps
  could not be measured. No empirical graph or nutrient-status conclusion is presented. Related measurements cannot
  supply an intake relationship without iron observations.


  ## How can I make the log more useful?


  Check nutrient units and serving count: **1 g = 1,000 mg**, while **1 microgram = 0.001 mg**. Keep compatible
  contributions within a source and state how many days have credible logs. [Apple allows apps to write selected
  nutrition types](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers), so another nutrient
  being present does not establish complete iron coverage. Review [contributing Health sources](https://support.apple.com/en-us/108779)
  after changing logging apps.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is documented here but is not in the current PulsHealth sync catalog. The missing database
  rows therefore cannot establish whether Apple Health on the phone contains entries. Milligrams on this page are
  an explanatory display unit, not a promise of current sync support.

  '
