description: '## What does Apple Health protein intake measure?


  Dietary Protein records protein logged from food and supplements. HealthKit defines a cumulative mass quantity;
  PulsHealth stores it in **g**. An entry is a recorded contribution to intake, not a blood measurement, a measure
  of absorption or a direct measure of muscle growth. See [Apple''s definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryprotein).


  ## Is a sample a serving or a whole day?


  It can be either, depending on the source. A meal app may write individual foods while another source writes daily
  totals. Check portions and intervals before summing them together. A scoop''s total powder mass is not necessarily
  its protein mass. [FDA''s label guide](https://www.fda.gov/food/nutrition-facts-label/whats-nutrition-facts-label)
  explains how serving size relates to nutrient amounts.


  | A useful distinction | Why it matters |

  | --- | --- |

  | Grams of food versus grams of protein | They are different quantities |

  | Per-serving versus package total | Serving count changes the recorded amount |

  | Same meal in two apps | A pooled sum can double count it |

  | A day with partial logs | Its total does not establish adequate or inadequate intake |


  ## What is a meaningful protein range?


  A useful comparison needs an intake target appropriate to the reader and complete food logs. This page does not
  treat a distribution of recorded entries as a healthy daily target. The size of one food entry is also not interchangeable
  with a daily total. Interpret unusually large entries as prompts to inspect units, portions and source metadata
  before assigning a physiological explanation.


  ## How often is protein recorded?


  The gap between entries reflects food logging. It does not reveal the interval between meals, protein absorption
  or recovery. A midnight timestamp may be a daily summary, and a batch of samples may have been entered after meals.
  Retain those distinctions when grouping protein into meals or reporting days.


  ## How does protein relate to calories, body mass and workouts?


  Multiplying recorded protein grams by four is a rough calorie contribution, not a way to recover total food energy.
  An exploratory comparison with consumed-energy logs must use compatible source and day coverage. A grams-per-kilogram
  comparison also requires an appropriate body-mass measurement and credible daily intake. Avoid silently carrying
  an old weight across a long gap. Workout or sleep overlap of food timestamps does not demonstrate timed ingestion
  or muscle recovery.


  ## What did the database investigation support?


  The researched **365-day reporting window** contained no raw protein samples or stored protein aggregates. Protein
  ranges, logging cadence, extreme portions, daily calorie associations and body-mass-adjusted intake were unavailable.
  No measured chart or nutrient-deficiency conclusion is presented.


  ## How can I make the log useful?


  Check portion sizes and whether supplements are included. Use a consistent source and summarize **recorded grams
  on logged days**, with coverage stated separately. [Apple''s nutrition documentation](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers)
  allows apps to track selected nutrients, so a calorie record does not guarantee a matching protein record. Review
  [contributing sources](https://support.apple.com/en-us/108779) after changing food apps.

  '
