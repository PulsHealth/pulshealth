description: '## What does Apple Health magnesium intake record?


  Dietary Magnesium is a cumulative mass quantity for the magnesium amount recorded as consumed. Amounts on this
  page are expressed in **mg**. One sample can represent a food portion, a supplement entry or a source-generated
  daily total; it is not necessarily a whole day. [Apple defines this quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarymagnesium).


  ## What does magnesium intake say about magnesium status?


  Magnesium supports many enzyme processes, muscle and nerve function, and energy metabolism. Logged intake measures
  the amount entered, not its absorption or the amount in tissues. Even serum magnesium does not fully describe
  body stores; an intake chart alone cannot diagnose a deficiency. [NIH explains magnesium assessment](https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/).


  ## Should I record magnesium or magnesium-compound weight?


  Use the elemental magnesium amount on the label. Magnesium citrate or another compound contains material besides
  magnesium, so its compound weight is a different quantity. Foods, supplements and some medicines can contribute
  magnesium; a food-only log may omit the other sources. Keep these contributions identifiable when the app provides
  that detail.


  | What you see | How to read it |

  | --- | --- |

  | Elemental magnesium | The mineral amount to record |

  | Magnesium compound | Its total mass is different |

  | Food versus supplement entry | Coverage and interpretation can differ |

  | Blood or tissue magnesium | Not measured by dietary entries |


  ## How often is magnesium recorded?


  The interval between entries reflects logging or synchronization, not nutrient absorption or a validated meal
  schedule. A midnight timestamp may be a daily summary, and multiple entries may have been added later. Review
  source, portion and duration before summing; importing the same meal from two apps can inflate a total. A day
  without entries is missing coverage, not zero intake.


  ## Can I connect magnesium timing with sleep or recovery?


  A recorded sleep timeline can accompany a log, but timestamp overlap does not establish when
  magnesium was taken, absorbed or had an effect. Sleep quality and recovery have many influences. First establish
  compatible coverage and source-specific intake totals; avoid interpreting an app association as proof that magnesium
  changed sleep.


  ## What did the example-data investigation find?


  The researched **365-day reporting window** contained no raw magnesium samples and no stored magnesium aggregates.
  Recorded value ranges, unusually large entries, source-specific daily totals and logging gaps
  could not be measured. No empirical graph or nutrient-status conclusion is presented. Related measurements
  cannot supply an intake relationship without magnesium observations.


  ## How can I make the log more useful?


  Check nutrient units and serving count: **1 g = 1,000 mg**, while **1 microgram = 0.001 mg**. Keep compatible
  contributions within a source and state how many days have credible logs. [Apple allows apps to write selected
  nutrition types](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers), so another nutrient
  being present does not establish complete magnesium coverage. Review [contributing Health sources](https://support.apple.com/en-us/108779)
  after changing logging apps.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is documented here but is not in the current PulsHealth sync catalog. The missing database
  rows therefore cannot establish whether Apple Health on the phone contains entries. Milligrams on this page are
  an explanatory display unit, not a promise of current sync support.

  '
