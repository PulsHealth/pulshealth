description: '## What does Apple Health caffeine measure?


  Dietary Caffeine records the **mass of caffeine**, not the volume of coffee or another drink. HealthKit defines
  a cumulative mass quantity; PulsHealth stores it in **mg**. A 250 mL coffee and a 250 mg caffeine entry describe
  different quantities. [Apple''s type definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarycaffeine)
  provides the semantics.


  ## What is a useful caffeine range?


  FDA describes **400 mg per day** as an amount generally not associated with negative effects for most adults.
  It is contextual guidance, not a target, a universal safe limit or a threshold that diagnoses a problem. Sensitivity
  and how quickly caffeine is cleared vary. Product caffeine content and serving sizes also vary, and decaf may
  contain caffeine. See [FDA''s caffeine guidance](https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much)
  for context.


  | A surprising record | A useful check |

  | --- | --- |

  | A dose much larger than usual | mg versus g, serving count and supplement label |

  | Two matching doses | Whether the beverage was saved by two apps |

  | A late-night timestamp | Whether it represents ingestion or later logging |

  | A blank day | Whether logging was complete, rather than assuming no caffeine |


  ## How often is caffeine recorded?


  The spacing between samples is logging cadence. It may follow drinks, supplements or a retrospective daily entry.
  HealthKit does not establish a universal automatic caffeine recording schedule. Compare gaps within a source,
  and distinguish an individual serving from a daily total before summing records.


  ## Can caffeine timing explain sleep or heart rate?


  Caffeine timestamps can be aligned with the next recorded sleep episode, but meaningful analysis requires credible
  ingestion times and adequate data for both types. A correlation can also reflect activity, stress, illness or
  changing logging habits. Timestamp overlap with a workout does not prove caffeine was taken during exercise, and
  no log can reconstruct blood caffeine concentration without additional assumptions.


  ## What did the database investigation support?


  The researched **365-day reporting window** had no raw caffeine samples or stored caffeine aggregates. Dose ranges,
  extreme entries, within-day gaps and pre-sleep comparisons were unavailable. No measured figure or association
  is claimed. Missing caffeine records do not establish abstinence.


  ## How can I improve a caffeine log?


  Record dose in mg using the product''s serving information where available, and retain the food or drink description.
  A coffee-size estimate may be uncertain; keep that uncertainty visible rather than converting every cup to the
  same dose. Review [Health''s contributing data sources](https://support.apple.com/en-us/108779) when linking a
  beverage tracker, then use source-specific daily sums on logged days. A water record does not determine caffeine
  content, and a caffeine record does not determine drink volume.

  '
