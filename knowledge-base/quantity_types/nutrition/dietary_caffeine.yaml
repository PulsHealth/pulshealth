    ''Supplement'')'
- key: HKMetadataKeyWasUserEntered
  description: 'Optional if provided: indicates that the user entered the sample. Absence of this key does not prove
    automatic measurement.'
related_types:
- identifier: HKQuantityTypeIdentifierDietaryEnergyConsumed
  relationship: Related food-energy logs require matching source and logged-day coverage.
- identifier: HKQuantityTypeIdentifierDietaryProtein
  relationship: A nutrient component may be logged without other nutrients.
- identifier: HKQuantityTypeIdentifierDietaryCarbohydrates
  relationship: Carbohydrate totals and components have distinct semantics.
- identifier: HKQuantityTypeIdentifierDietaryFatTotal
  relationship: Total fat includes its subtypes; do not double count components.
- identifier: HKQuantityTypeIdentifierDietaryWater
  relationship: Recorded water volume is not a measurement of hydration.
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Body-mass comparisons require compatible timing and do not establish dietary causality.
- identifier: HKCategoryTypeIdentifierSleepAnalysis
  relationship: Sleep-timing comparisons require credible ingestion timestamps and adequate sleep coverage; associations
    are exploratory.
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: Heart-rate comparisons have multiple possible confounders; logged caffeine does not establish a
    causal response.
