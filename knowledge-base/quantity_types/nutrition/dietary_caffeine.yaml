recording_behavior:
  reviewed_on: '2026-10-14'
  shape: Cumulative recorded intake amount; sample size is not necessarily a serving or a daily total.
  cadence: Source-specific logging or synchronization cadence, not continuous sensing or a validated ingestion schedule.
  context: "Review the logged caffeine amount, food or drink item, serving size and assigned consumption time; the saved timestamp does not independently verify when caffeine was consumed."
  coverage: Missing logs do not establish zero intake. A source can contribute only selected nutrients or drinks.
  aggregation: Sum compatible recorded contributions within a source and reporting window after checking units,
    serving semantics and duplicate imports. State logged-day coverage.
  references:
  - title: 'Apple: Nutrition types'
