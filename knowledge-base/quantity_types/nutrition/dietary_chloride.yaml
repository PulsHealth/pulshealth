description: '## What does Apple Health chloride intake record?


  Dietary Chloride is a cumulative mass quantity for the chloride amount recorded as consumed. Amounts on this page
  are expressed in **mg**. One sample can represent a food portion, a supplement entry or a source-generated daily
  total; it is not necessarily a whole day. [Apple defines this quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarychloride).


  ## Is chloride the same quantity as salt or sodium?


  No. Table salt contains sodium and chloride, but its total mass differs from the mass of either component. Chloride
  also occurs in other salts. The HealthKit chloride quantity is the chloride amount consumed, not sodium intake
  and not a blood chloride concentration. [MedlinePlus describes chloride in the diet](https://medlineplus.gov/ency/article/002417.htm).


  ## Why might chloride be missing when sodium is logged?


  Food databases and apps do not necessarily supply every nutrient. A sodium value does not guarantee a chloride
  value, and different sodium-containing ingredients do not all have the same chloride content. Confirm that the
  source supports chloride and that the chosen food record contains it. Do not fill an empty chloride field by treating
  sodium or salt mass as chloride.


  | What you see | How to read it |

  | --- | --- |

  | Chloride mass | The quantity this type stores |

  | Sodium chloride mass | Combined compound mass; requires conversion |

  | Sodium mass | A separate nutrient, not a chloride substitute |

  | No chloride entry | Unavailable nutrient log, not zero intake |


  ## How often is chloride recorded?


  The interval between entries reflects logging or synchronization, not nutrient absorption or a validated meal
  schedule. A midnight timestamp may be a daily summary, and multiple entries may have been added later. Review
  source, portion and duration before summing; importing the same meal from two apps can inflate a total. A day
  without entries is missing coverage, not zero intake.


  ## Can chloride logs explain hydration or exercise losses?


  Chloride has a role in fluid balance, but dietary entries do not measure sweat concentration, sweat volume or
  blood electrolyte balance. A logged chloride amount may describe a serving or a daily summary.
  Water, sodium and potassium logs provide additional recorded context only when their portions and reporting days
  align.


  ## What did the example-data investigation find?


  The researched **365-day reporting window** contained no raw chloride samples and no stored chloride aggregates.
  Recorded value ranges, unusually large entries, source-specific daily totals and logging gaps
  could not be measured. No empirical graph or nutrient-status conclusion is presented. Related measurements
  cannot supply an intake relationship without chloride observations.


  ## How can I make the log more useful?


  Check nutrient units and serving count: **1 g = 1,000 mg**, while **1 microgram = 0.001 mg**. Keep compatible
  contributions within a source and state how many days have credible logs. [Apple allows apps to write selected
  nutrition types](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers), so another nutrient
  being present does not establish complete chloride coverage. Review [contributing Health sources](https://support.apple.com/en-us/108779)
  after changing logging apps.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is documented here but is not in the current PulsHealth sync catalog. The missing database
  rows therefore cannot establish whether Apple Health on the phone contains entries. Milligrams on this page are
  an explanatory display unit, not a promise of current sync support.

  '
