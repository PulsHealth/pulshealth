recording_behavior:
  reviewed_on: '2026-10-14'
  shape: Cumulative recorded intake amount; sample size is not necessarily a serving or a daily total.
  cadence: Source-specific logging or synchronization cadence, not continuous sensing or a validated ingestion schedule.
  context: "Review food items, portions and energy units; logged intake coverage is needed before comparing totals with recorded energy expenditure."
  coverage: Missing logs do not establish zero intake. A source can contribute only selected nutrients or drinks.
  aggregation: Sum compatible recorded contributions within a source and reporting window after checking units,
    serving semantics and duplicate imports. State logged-day coverage.
  references:
  - title: 'Apple: Nutrition types'
    url: https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers
  - title: 'Apple: Sample time semantics'
    url: https://developer.apple.com/documentation/healthkit/samples
  metadata: Food descriptions and user-entered indicators can aid serving review when present; missing metadata
    does not identify an automatic record or a complete diet. Food correlation linkage cannot be recovered from
    temporal coincidence alone.
