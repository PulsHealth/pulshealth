description: '## What are dietary calories in Apple Health?


  Dietary Energy Consumed records energy logged from food and beverages. It is **intake**, distinct from Active
  Energy Burned and Basal Energy Burned. HealthKit defines a cumulative energy quantity; PulsHealth stores **kcal**.
  One food-label Calorie is one kilocalorie; 1 kcal equals 4.184 kJ. See [Apple''s definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryenergyconsumed).


  ## Why can recorded intake look unusually low or high?


  A food entry may represent a serving, recipe, meal or daily total. Portion estimates, food database selection
  and duplicated imports can change the total. A missing breakfast or a day without entries is incomplete evidence,
  not a measured calorie deficit. FDA''s [Nutrition Facts explanation](https://www.fda.gov/food/nutrition-facts-label/whats-nutrition-facts-label)
  notes that label serving size is not a recommended portion and the 2,000-calorie reference is general guidance
  rather than an individualized need.


  | Before interpreting a daily sum | Check |

  | --- | --- |

  | Units | kcal and kJ were converted consistently |

  | Portions | Amount eaten versus the package''s label serving |

  | Sources | Another app did not save the same meal |

  | Coverage | Meals and beverages were actually logged |


  ## Should food calories match protein, carbohydrate and fat?


  The rough check **4 × protein(g) + 4 × carbohydrate(g) + 9 × fat(g)** can identify a unit or serving mismatch
  when all four logs cover the same foods and source. Exact agreement is not required. Label calculations can use
  specific factors, fiber or sugar-alcohol adjustments and rounding. Alcohol and incomplete nutrient entries also
  matter. [The FDA labeling regulation](https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-101/subpart-A/section-101.9)
  describes permitted calorie calculations; a reconstruction cannot establish how a source app calculated its value.


  ## How often are calorie entries recorded?


  Cadence follows meal logging or syncing, rather than metabolic absorption. A sample''s duration is not digestion
  time. Samples at midnight can be daily summaries; samples saved in a batch can share timestamps. Summing a daily
  total together with its component meals can count the same intake twice.


  ## Can I subtract exercise calories from food intake?


  Food intake and energy expenditure are separate estimates with different coverage and errors. A food log minus
  active calories alone omits resting expenditure. Even intake minus resting and active estimates should not be
  presented as a measured energy balance unless boundaries, sources and completeness are understood. Food timestamps describe logged entries, not when energy was absorbed or used.


  ## What did the database investigation support?


  The researched **365-day reporting window** contained no raw consumed-energy samples and no stored consumed-energy
  aggregates. Intake ranges, outliers, logging cadence, macro reconciliation and workout or sleep comparisons were
  unavailable. The investigation cannot infer fasting, under-fueling or an energy deficit from those missing records.


  ## How can I make comparisons more reliable?


  Use consistent portions and inspect [Health''s data sources](https://support.apple.com/en-us/108779). Analyze
  sums within a source and state how many days have usable logs. Compare trends only across similar logging periods;
  body-weight changes do not validate individual meal estimates. Treat a sudden jump after changing apps as a provenance
  question before interpreting it as a dietary change.

  '
metadata_keys:
- key: HKMetadataKeyFoodType
  description: 'Optional if provided by the source: String identifier for the type of food or meal logged (e.g.,
    ''breakfast'', ''lunch'', ''dinner'', ''snack'')'
- key: HKMetadataKeyWasUserEntered
  description: 'Optional if provided: indicates that the user entered the sample. Absence of this key does not prove
    automatic measurement.'
- key: HKMetadataKeyExternalUUID
  description: 'Optional if provided by the source: Unique identifier from the source app''s database for data synchronization'
related_types:
- identifier: HKQuantityTypeIdentifierDietaryProtein
  relationship: A nutrient component may be logged without other nutrients.
- identifier: HKQuantityTypeIdentifierDietaryCarbohydrates
  relationship: Carbohydrate totals and components have distinct semantics.
- identifier: HKQuantityTypeIdentifierDietaryFatTotal
  relationship: Total fat includes its subtypes; do not double count components.
- identifier: HKQuantityTypeIdentifierDietaryWater
  relationship: Recorded water volume is not a measurement of hydration.
- identifier: HKQuantityTypeIdentifierDietaryCaffeine
  relationship: Caffeine dose is distinct from beverage volume.
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Body-mass comparisons require compatible timing and do not establish dietary causality.
