description: '## What does Apple Health record?


  Pantothenic acid helps form coenzyme A, which participates in nutrient metabolism. Many foods contain it,
  but an app can save calories and selected nutrients without supplying B5 for the same meal. [Apple defines
  this type as cumulative intake in mass units](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietarypantothenicacid).
  It is entered or imported through a source that supplies nutrition data. An Apple Watch does not sense the
  nutrient amount in a meal.


  ## Why can B5 totals be incomplete even when meals are logged?


  Food processing affects estimated pantothenic acid content, and supplement labels can name compounds such
  as calcium pantothenate. Record the labeled nutrient amount rather than assuming the mass of the whole compound
  is the B5 amount. An intake field cannot establish how much was absorbed. [NIH Office of Dietary Supplements](https://ods.od.nih.gov/factsheets/PantothenicAcid-HealthProfessional/)
  explains the nutrient background and distinctions.


  | What to check | Why it changes interpretation |

  | --- | --- |

  | Food composition | Use the preparation and serving represented by the food database entry. |

  | Supplement compound | Distinguish the ingredient compound from the labeled nutrient amount. |

  | Incomplete micronutrients | A missing B5 component does not make a logged meal a zero-B5 meal. |


  ## Why is the chart empty or missing some days?


  The reviewed example data contained no raw samples or stored aggregates for this type in the 365-day window
  from October 2025 through September 2026. There is no measured range, recording cadence, outlier distribution
  or daily trend to plot. Missing records do not establish zero intake, deficiency or absence of supplement
  use.


  This HealthKit type is not in the current PulsHealth sync catalog. An empty database result therefore does
  not establish that Apple Health on the phone has no entries.


  A nutrition source can export only selected nutrients. Check the source app, its Health permissions and whether
  the food entry contains this nutrient before treating an empty chart as a dietary finding.


  ## How should entries become daily totals?


  Keep units visible: 1 mg equals 1,000 mcg, and 1 g equals 1,000 mg. Here mg is the presentation unit; inspect
  the unit supplied in an export before adding values. Sum compatible contributions from a source after checking
  serving size, repeated imports and whether each entry is a serving, meal or already a daily total.


  Report both the total and how many days contain logs. An average over logged days differs from an average
  over all calendar days; filling gaps with zero changes the question. A source switch can create an apparent
  intake change through a different food database or export policy.


  ## Can workouts, sleep or other nutrients explain a change?


  A sample timestamp inside a workout or sleep interval is time assigned by the source; it does not establish
  when the record was saved, verify ingestion or demonstrate a physiological response. Without focal nutrient
  records, this review could not estimate workout, sleep or nutrient relationships.


  When records are available, compare compatible sources and days with adequate logging. Similar timestamps
  for B vitamins may indicate a shared food or supplement entry, but explicit meal membership requires a stored
  link. Related intake types provide bookkeeping context rather than a test of absorption or health status.


  ## What should I check before interpreting an extreme value?


  Review the unit, serving count, source revision and duplicate candidates before drawing a health conclusion.
  Preserve the original record while investigating it. The nutrition log can help organize a conversation about
  food or products; its amounts are not blood-test reference ranges or individualized supplement instructions.

  '
