description: '## What does a saturated-fat sample measure?


  Dietary Fat Saturated records logged saturated-fat intake in **g**. [Apple defines it as a cumulative mass
  quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/dietaryfatsaturated).
  A sample may represent a food portion, recipe, meal or daily summary; it does not measure body fat or blood
  cholesterol.


  ## How should I compare grams with dietary guidance?


  [FDA uses a 20 g saturated-fat Daily Value](https://www.fda.gov/food/nutrition-facts-label/daily-value-nutrition-and-supplement-facts-labels)
  for labels. [WHO''s dietary guidance](https://www.who.int/news-room/fact-sheets/detail/healthy-diet) limits
  saturated fat to no more than 10% of total energy and discusses replacing it with unsaturated fats. These
  are dietary references, not normal ranges for individual samples or personalized treatment prescriptions.


  | Comparison | What to check first |

  | --- | --- |

  | Grams per food | Serving size and recipe portion |

  | Grams per day | Complete source-specific food logging |

  | Percent of food energy | Saturated fat and calories cover compatible foods and days |

  | Saturated versus total fat | Component already included in the total |


  ## How is percent of energy calculated?


  A rough recorded energy share is **100 × (9 × saturated-fat grams) ÷ food-energy kcal**. Only use a positive,
  compatible food-energy denominator. Partial logs can inflate or suppress the percentage; source-specific
  daily amounts do not guarantee a complete diet. Different units, label rounding and unmatched food coverage
  also affect agreement.


  ## Does a higher saturated-fat entry explain a blood result?


  This record cannot establish a change in LDL or cardiovascular risk. A recipe portion or duplicate import
  can create a large entry. Review the broader eating pattern and clinical measurements separately. [Apple''s
  nutrition hierarchy](https://developer.apple.com/documentation/healthkit/nutrition-type-identifiers) places
  saturated fat within total fat, so adding both exaggerates intake.


  ## Can PulsHealth collect this type?


  This HealthKit concept is documented in the knowledge base, but it is absent from the current PulsHealth
  collection catalog. Automatic sync is not provided for this type by that catalog. Its absence from the database
  does not establish that Apple Health contains no records.


  ## Do entry timestamps establish meal timing?


  Entry timing follows food logging or source synchronization. A timestamp may describe an earlier meal
  or a daily summary. Review start times,
  durations and source history before discussing meal timing. Missing days remain unlogged rather than zero
  intake. [Health''s source controls](https://support.apple.com/en-us/108779) help when reviewing overlapping
  apps.


  ## What did the database investigation establish?


  The researched **365-day reporting window** contained no raw samples or stored aggregates for this nutrient.
  Recorded ranges, unusual portions, source overlap, recording intervals were
  unavailable. Related nutrient comparisons were unavailable because there were no records for this type. No
  empirical nutrient association or measured chart is supported. These missing records do not establish zero
  consumption or a deficient diet.


  ## How can I make the log easier to interpret?


  Check the represented serving, preserve source-specific daily totals and state how many days have usable
  logs. Review duplicate food imports before summing sources. Food descriptions may clarify portions when supplied,
  but absent metadata does not prove automatic measurement or complete recording.

  '
