  cadence: Source-specific food logging or synchronization, not continuous nutrient sensing.
  context: Workout and sleep overlap describe record timestamps; ingestion time, absorption and physiological
    response remain unverified.
  coverage: Missing entries are unlogged, not zero intake; sources can provide only selected nutrients.
  aggregation: Sum compatible contributions within a source after checking serving semantics and duplicate
    imports; report logged-day coverage.
