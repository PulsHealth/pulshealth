description: '## Is this a six-minute workout or an estimate?

  The type can contain results from a completed six-minute walk test, including a test recorded by a clinical app.
  Apple Watch also writes a **predicted test distance** based on passive activity and motion history. The identifier
  alone does not establish which method produced a value. Check its source and metadata before interpreting it.
  [Apple''s type documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/sixminutewalktestdistance)


  A clinical test measures how far someone walks on a flat, unobstructed course in six minutes. An estimate predicts
  expected performance without requiring that test to have happened. Do not describe an estimated sample as a guided
  six-minute workout or add it to total walking distance.


  ## Why might Apple Watch estimates stop at 500 meters?

  Apple documents a **500 m maximum for its estimated result** and better performance for people whose expected
  distance is below that ceiling. A value at the ceiling cannot distinguish someone able to walk 500 m from someone
  able to walk farther. The ceiling is not a universal limit on a measured clinical test or on what another app
  may save.


  | Recording question | Apple Watch estimate behavior |

  | --- | --- |

  | How often? | Normally weekly, subject to sufficient usable history. |

  | What history is required? | At least eight hours of wear on three days a week, plus at least ten days meeting
  the eight-hour threshold in the previous four weeks. |

  | Does calibration matter? | Yes; calibration and representative daily activities affect estimate quality. |

  | Is the value a total to sum? | No. It is a discrete estimate of capacity, not accumulated activity. |


  These are documented requirements, not observed recording rates from the example dataset. [Apple''s estimate documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/sixminutewalktestdistance)


  ## What did the example-data investigation find?

  There were **no Six-Minute Walk Test Distance quantity records** in the selected reporting year. Consequently,
  the investigation cannot estimate empirical ranges, ceiling frequency, outliers, cadence, source changes, workout
  or sleep differences, or associations with walking speed. No test result or graph is invented to fill that gap.


  ## Why can a change appear later than an injury or recovery?

  Apple''s estimate uses historical activity information. Earlier observations can smooth an abrupt change. The
  earliest-data-used metadata helps identify that lookback window. Apple''s recalibration mechanism can limit future
  estimates to a later starting point, with user authorization; it does not rewrite existing results, and rebuilding
  sufficient history can take time. [Apple''s explanation of recalibration](https://developer.apple.com/videos/play/wwdc2021/10287/)


  ## How should results be compared?

  Keep measured tests and estimates separate. Compare the same source and method, with calibration, course conditions
  and relevant changes in health considered. A clinical test''s meaning depends on the assessment context; this
  page does not assign universal age-specific normal or concerning cutoffs to Apple Watch estimates. The source
  paper describes how the algorithm was evaluated and where its performance is limited. [Apple''s six-minute distance
  research](https://www.apple.com/healthcare/docs/site/Using_Apple_Watch_to_Estimate_Six_Minute_Walk_Distance.pdf)

  '
