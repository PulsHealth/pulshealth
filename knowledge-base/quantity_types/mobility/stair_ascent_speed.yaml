description: '## What does Stair Ascent Speed describe?

  Stair Ascent Speed stores the average speed while walking up stairs during an interval. Its unit is meters per
  second, and it is a discrete measurement. It is not a count of stair steps or flights and should not be added
  across a day as if it were distance. [Apple''s type documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/stairascentspeed)


  ## When does Apple Watch record it?

  Apple documents automatic collection on Apple Watch Series 5 or later when the wearer walks up a flight approximately
  10 feet (3 meters) high. Collection is disabled when wheelchair status is enabled. This selects suitable movement
  bouts rather than continuously sampling every moment of daily activity.


  Apple gives about 20 daily records as a typical example, with some days exceeding 100 during activities such as
  a long hike. That is a source illustration, not a guaranteed schedule or an empirical estimate for the dataset
  researched here. A gap does not demonstrate that stairs were avoided. [Apple''s recording discussion](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/stairascentspeed)


  | Item in a record | How to interpret it |

  | --- | --- |

  | Value in m/s | Average speed during that recorded interval. |

  | Start and end | The boundaries of the measurement interval. |

  | Time between records | Time between qualifying stored observations, not the sensor''s internal sampling rate.
  |

  | Number of records | Recording opportunities captured, not an exact stair or flight count. |


  ## What did the example-data investigation find?

  The selected reporting year contained **no Stair Ascent Speed quantity records**. The database coverage check
  therefore supplies no empirical range, outlier distribution, interval duration, recording cadence or comparison across stair bouts. No graph is fabricated. Other activity data being present does not prove that this particular
  measurement was collected.


  ## How does it relate to flights and the opposite direction?

  Flights Climbed is a separate cumulative count. It cannot be converted directly into ascent speed without information
  about geometry and timing. A daily flight total and a stair-speed median summarize different things. Compare ascent
  and descent records as separate types; matching days alone do not establish that they describe the same staircase
  or trip.


  Climbing stairs can involve a different level of effort from level walking. A slower observation may reflect a
  deliberate pace, carrying objects, fatigue or the route, and does not diagnose reduced strength or cardiovascular
  capacity.


  ## What makes comparisons more useful?

  Keep direction, source and conditions as consistent as possible. Inspect record counts and interval lengths alongside
  values: a weekly average drawn from a few selected bouts may differ from one drawn from many. Timestamp overlap
  with a workout is not a confirmed HealthKit linkage.


  A sustained change together with new mobility difficulty can be discussed with a healthcare professional. This
  page does not prescribe universal age-based cutoffs for automatic stair-speed samples; those require validated
  methods and clinical context.

  '
