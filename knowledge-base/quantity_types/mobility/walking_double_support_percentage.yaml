description: |
  ## Overview
  Walking double support percentage measures the proportion of the gait cycle when both feet are in contact with the ground simultaneously. This metric is a fundamental gait parameter that reflects balance, stability, and confidence during walking. Higher double support time indicates a more cautious, stability-seeking gait pattern.

  ## How It's Measured
  During normal walking, the gait cycle alternates between single support (one foot on ground) and double support (both feet on ground) phases. Apple devices analyze accelerometer and gyroscope data to identify these phase transitions and calculate the percentage of time spent in double support. Measurements are collected during natural walking bouts throughout the day.

  ## Health Significance
  Double support percentage is a sensitive indicator of:
  - **Balance confidence**: Individuals with balance concerns instinctively increase double support time
  - **Fall risk**: Elevated double support correlates with increased fall risk
  - **Neurological function**: Parkinson's disease, stroke, and other conditions affect this parameter
  - **Pain avoidance**: Joint pain often leads to prolonged double support
  - **Vestibular function**: Inner ear disorders affect balance and gait timing

  ## Clinical Interpretation Guidelines
  - **<25%**: Generally indicates confident, efficient gait pattern
  - **25-32%**: Normal range for older adults; monitor for changes
  - **32-40%**: Elevated; suggests balance concerns or functional limitation
  - **>40%**: Significantly elevated; high fall risk, requires assessment

  Changes from individual baseline are often more meaningful than absolute values. A sudden increase may indicate:
  - New onset of dizziness or vertigo
  - Acute illness affecting balance
  - Pain limiting mobility
  - Medication side effects
  - Fear of falling after a near-miss or fall event

  ## Age-Adjusted Norms
  Double support percentage naturally increases with age as part of the normal adaptation to changing balance systems:
  - Ages 20-40: ~20-25%
  - Ages 40-60: ~22-28%
  - Ages 60-80: ~25-35%
  - Ages 80+: ~28-40%

  The age-related increase reflects:
  - Declining vestibular function
  - Reduced proprioception
  - Decreased muscle strength
  - Lower confidence in balance

  ## Caveats & Limitations
  - Walking speed affects double support; slower speeds naturally have higher percentages
  - Footwear type influences gait patterns and measurements
  - Uneven terrain may appropriately increase double support
  - Acute fatigue or distraction can temporarily affect values
  - Carrying loads (bags, children) alters normal gait patterns
  - Bilateral measurements may not capture unilateral problems

  ## Additional Notes
  This metric is particularly valuable for:
  - **Post-fall assessment**: Monitoring recovery of gait confidence
  - **Parkinson's disease**: Tracking progression and medication effects
  - **Vestibular rehabilitation**: Assessing treatment response
  - **Hip/knee replacement recovery**: Documenting return to normal gait
  - **Diabetic neuropathy**: Monitoring peripheral nerve function impact on gait

  Consider evaluating alongside walking asymmetry and walking speed for comprehensive gait analysis. An isolated increase in double support with preserved speed may indicate early balance concerns before overt problems develop.
