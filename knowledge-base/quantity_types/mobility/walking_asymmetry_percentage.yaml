description: |
  ## Overview
  Walking asymmetry percentage quantifies the difference in gait characteristics between the left and right sides during ambulation. It measures the percentage difference in the time each foot spends on the ground during walking. This metric serves as an objective indicator of limping, compensatory gait patterns, and unilateral musculoskeletal or neurological impairments.

  ## How It's Measured
  Apple devices analyze motion sensor data to detect the timing characteristics of each step, comparing left and right leg parameters including:
  - Step time (duration from heel strike to toe-off)
  - Swing phase duration
  - Ground contact time

  The asymmetry is calculated as the percentage difference between the two sides, with 0% indicating perfect symmetry. A positive value indicates which side has the longer step time, though HealthKit reports the absolute magnitude.

  ## Health Significance
  Gait asymmetry is clinically significant because:
  - **Injury detection**: Often the first objective sign of lower extremity injury
  - **Pain monitoring**: Asymmetry increases with pain, even before conscious awareness
  - **Neurological assessment**: Stroke, Parkinson's, and MS cause characteristic asymmetries
  - **Prosthetic/orthotic evaluation**: Objective measure of device fit and function
  - **Fall risk**: Asymmetric gait increases stumbling and fall risk

  ## Clinical Interpretation Guidelines
  - **<5%**: Excellent symmetry; normal for healthy adults
  - **5-10%**: Mild asymmetry; may be normal variant or subclinical issue
  - **10-15%**: Moderate asymmetry; warrants investigation
  - **15-25%**: Significant asymmetry; likely symptomatic, requires evaluation
  - **>25%**: Severe asymmetry; significant gait impairment present

  Key clinical considerations:
  - **New onset asymmetry**: May indicate acute injury, joint flare, or neurological event
  - **Progressive increase**: Suggests worsening condition requiring intervention
  - **Post-treatment decrease**: Objective evidence of therapeutic response
  - **Persistent asymmetry**: May indicate chronic condition or structural abnormality

  ## Age-Adjusted Norms
  Gait symmetry is relatively preserved with normal aging compared to other gait parameters:
  - Ages 20-60: <8% is typical
  - Ages 60-80: <12% is acceptable
  - Ages 80+: <15% is acceptable

  Significant asymmetry at any age warrants evaluation, as it more likely reflects pathology than normal aging.

  ## Caveats & Limitations
  - Device placement affects measurement accuracy (phone in pocket, watch on wrist)
  - Footwear differences between feet can cause apparent asymmetry
  - Carrying items (bags, children) on one side affects gait
  - Environmental factors (uneven ground, slopes) influence measurements
  - Does not specify which leg has the abnormality (need clinical correlation)
  - May not detect subtle asymmetries that are clinically apparent
  - Compensatory patterns may mask true asymmetry

  ## Additional Notes
  Walking asymmetry is particularly valuable for:
  - **Orthopedic rehabilitation**: Tracking recovery after hip/knee replacement, ACL repair
  - **Sports medicine**: Detecting overuse injuries before symptomatic
  - **Neurological monitoring**: Stroke recovery, Parkinson's medication timing
  - **Chronic pain management**: Objective documentation of functional impact
  - **Workers' compensation**: Objective functional assessment

  Consider the clinical context when interpreting:
  - Historical leg length discrepancy may cause stable, asymptomatic asymmetry
  - Recent changes from baseline are more significant than absolute values
  - Combine with walking speed and double support for comprehensive assessment
