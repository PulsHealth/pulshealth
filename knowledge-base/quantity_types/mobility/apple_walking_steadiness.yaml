description: '## What does Walking Steadiness measure?

  Walking Steadiness combines mobility information into a score that helps describe walking quality and mobility-related
  fall risk. A higher score represents greater steadiness. It does not report the probability of a fall or identify
  why walking changed.


  Apple provides **OK, Low and Very Low** classifications. Use the Health app or Apple''s classification API to
  interpret a score; this article does not invent percentage cutoffs. A classification and a Walking Steadiness
  notification are separate HealthKit records. [Apple''s classification API](https://developer.apple.com/documentation/healthkit/hkapplewalkingsteadinessclassification)


  ## Why is it recorded weekly rather than at every step?

  Apple documents a new estimate approximately every seven days, with longer gaps when there is insufficient suitable
  mobility data. Eligible walking requires an iPhone 8 or later near the waist, steady walking on flat ground, and
  height entered in Health. Wheelchair status being enabled suppresses collection. These are source requirements,
  not evidence that every eligible week produces a sample. [Apple''s type documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/applewalkingsteadiness)


  | Question | Practical meaning |

  | --- | --- |

  | Is 0.7 the same as 0.7%? | No. In HealthKit percent units, 0.7 is displayed as 70%. |

  | Is this an Apple Watch measurement? | Apple''s automatic Walking Steadiness score is produced by iPhone. API
  availability on watchOS does not make the watch its measurement source. |

  | Is a blank week a score of zero? | No. A missing estimate is missing coverage. |

  | Does the timestamp identify one walking bout? | It describes the estimate''s reporting window, not when every
  contributing walking observation happened. |


  ## What did the example-data investigation find?

  The selected reporting year contained **no Walking Steadiness quantity records**. The stored-data investigation
  checked measurement coverage. Without records, it cannot establish an example cadence, distribution or relationship
  with other mobility measures.
  No graph or synthetic score is substituted.


  ## How does it relate to other mobility measures?

  Walking speed, step length, asymmetry and double support time provide detail about gait; Walking Steadiness summarizes
  a broader aspect of walking quality. Comparing trends can raise useful questions, but a change in one component
  does not establish the cause of a steadiness change. Apple''s feature also produces separate notification events
  when the classification drops or remains low. [Measure health with motion](https://developer.apple.com/videos/play/wwdc2021/10287/)


  ## How should a low classification be used?

  Review it alongside recent mobility changes, symptoms, phone placement and the consistency of available data.
  Repeated low classifications or new difficulty walking can support a discussion with a healthcare professional.
  A score does not replace an assessment of balance, medications, vision, injuries or the home environment, and
  an OK classification does not guarantee that a fall cannot occur. The Health app includes exercises and options
  for sharing notifications. [Apple''s user guide](https://support.apple.com/en-us/102504)

  '
