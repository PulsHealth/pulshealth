description: '## What does Walking Step Length measure?


  Walking Step Length estimates the distance between the front and back feet during steady walking on flat ground.
  A step goes from one foot to the other; a stride returns to the same foot. Treating step length as stride length
  produces a factor-of-two error. [Apple’s type documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/walkingsteplength)
  defines the measurement and recording conditions.


  ## What do example records look like?


  The reporting year contained **12,936 records on 365 of 365 days**. July–September contained **2,868 records on
  92 of 92 days**, from one source group. Missing days remain missing rather than zero observations.


  The focus-window median was **0.63 m (63 cm)**, with the central 90% between **0.46 and 0.75 m**. The full range
  was **0.31–1.18 m**. Height, walking pace, shoes and recording conditions matter; these values are not universal
  targets for a good step length.


  | Reading question | Useful interpretation |

  | --- | --- |

  | What does one value summarize? | The stored walking interval, not every step that day |

  | What does the range describe? | Recorded observations with each record given equal weight |

  | What does a high or low tail mean? | A reason to inspect context and repeated values |

  | How should a trend be compared? | Similar source, placement and walking conditions |


  ## Why are records unevenly spaced?


  In the focus window, observed-day recording counts ranged from **1 to 92**, with a median of **29**. Stored intervals
  had a median duration of **11.0 seconds** and ranged from **1.7 to 300 seconds**. The median positive start-to-start
  gap was **3.5 minutes**; the largest was **23.4 hours**.


  Apple describes roughly 10–30 samples on a typical day. That is a recording description, not a guaranteed sampling
  schedule. The sensor’s internal measurements are not the same as exported sample timestamps. Each estimate can
  cover a different duration, so a simple record average and a duration-weighted average answer different questions.


  ## How do workout records compare with other walking bouts?


  Across the reporting year, **511 records overlapped stored workouts**. Their median was **0.7 m**, compared with
  **0.63 m** outside recorded workouts and sleep. Within these separate context groups, median positive start-to-start
  gaps were **3.3 minutes** for workout-overlapping records and **3.2 minutes** for other records.


  Those gaps include time between separate walking bouts and workouts; they do not measure a workout sensor frequency.
  Overlap is temporal, not proof of explicit workout linkage or that the entire walking interval occurred inside
  the workout. No walking records overlapped available recorded-asleep intervals in this snapshot.


  ## How does this relate to other walking metrics?


  Daily step length and walking speed were positively associated (**Spearman 0.85 across 92 paired days**). Double
  support showed a weaker inverse association with step length (**−0.51**). Do not infer cadence by dividing separately
  recorded averages unless their intervals and weighting are compatible.


  The analysis kept sources separate and compared reporting-day medians on days containing both types. It also checked
  unique exact interval matches and excluded ambiguous duplicate interval candidates. These are repeated observations
  in example user data, not independent participants, and the relationships do not show causation.


  [Walking speed](/knowledge-base/types/HKQuantityTypeIdentifierWalkingSpeed/), [step length](/knowledge-base/types/HKQuantityTypeIdentifierWalkingStepLength/),
  [double support](/knowledge-base/types/HKQuantityTypeIdentifierWalkingDoubleSupportPercentage/) and [asymmetry](/knowledge-base/types/HKQuantityTypeIdentifierWalkingAsymmetryPercentage/)
  each add a different view of gait. [Walking Steadiness](/knowledge-base/types/HKQuantityTypeIdentifierAppleWalkingSteadiness/)
  is a separate estimate, not a classification computed here from these charts.


  ## What can change or prevent an estimate?


  Automatic collection requires iPhone 8 or later, carried near the waist, during steady walking on flat ground.
  Apple says these samples are not recorded when wheelchair status is enabled. Phone placement and which walking
  bouts meet the algorithm’s criteria can therefore change the observed distribution without establishing a physiological
  change.


  An up-to-date height in Health is required for accurate estimates. Compare persistent changes under similar conditions
  with how walking feels and functions. Consumer walking estimates do not replace a supervised gait assessment;
  a single extreme value should not be assigned a diagnosis.

  '
