description: |
  ## What does Height mean in Apple Health?
  Height is a length measurement that can be entered manually or written by an app. [Apple stores it as a discrete quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/height). An app's profile height and a timestamped HealthKit height observation are separate pieces of evidence: one can exist without the other appearing in an export.

  Use actual measured height for a calculation when available. The [CDC measuring guide](https://www.cdc.gov/bmi/child-teen-calculator/measure-child-height-weight.html) describes removing shoes and measuring standing height with an appropriate setup. Technique and units matter when comparing records.

  ## Why are there so few height records?
  An adult profile measurement may be updated only occasionally. Children being monitored for growth need a different interpretation. Repeated identical values might represent repeated profile writes rather than new measurements; a new timestamp does not itself establish growth or shrinkage.

  The full-year research snapshot contained **no raw height observations and no stored height aggregates**. There is no measured height range, repeat-write frequency, outlier analysis or cadence curve from this study. Empty data within this window does not prove there is no older height record or height stored in a source app's profile.

  ## Can BMI exist without a height record?
  Yes: the example includes BMI and weight written together even though no raw height observation appeared in the year. **218 exact-time, same-source pairs** were mathematically consistent with a fixed height denominator. That denominator was calculated from the pair, not independently measured stature.

  A source app may retain the height it uses without writing fresh height samples. This is a possible explanation, not verified producer behavior. Do not manufacture a Height record from BMI and weight or describe the derived denominator as an observed height.

  ## Which units and comparisons are safe?
  | Check | Why it matters |
  |---|---|
  | Meters versus centimeters | A factor-of-100 error becomes much larger when height is squared in BMI |
  | Inches or feet | Convert compatible length units before comparing |
  | Date and source | An old profile value may differ from a current measurement |
  | Standing height versus another method | Measurement protocols may not be directly comparable |

  There is no universal healthy height interval. Population percentiles describe a reference distribution, while growth assessment requires age-appropriate charts and repeated measurements. A broad number range should not be treated as a diagnostic boundary or a rule for discarding data.


  ## What other types depend on height?
  [BMI](/knowledge-base/types/HKQuantityTypeIdentifierBodyMassIndex/) uses height squared with [weight](/knowledge-base/types/HKQuantityTypeIdentifierBodyMass/). Body-composition producers may also use profile inputs in their own models. Those dependencies do not establish that HealthKit has a contemporaneous height observation or that the input has been recently verified.

  If a height-dependent result looks wrong, inspect the producer's current input and units as well as the Health records. Missing height in the export should remain an explicit limitation rather than being filled with an assumed value.
metadata_keys:
- key: HKMetadataKeyWasUserEntered
  description: Optional producer flag indicating user-entered data; false or absence does not independently verify
    the measurement method.
related_types:
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Total weight provides the mass input for BMI and composition consistency checks.
- identifier: HKQuantityTypeIdentifierBodyMassIndex
  relationship: BMI combines weight with height; it does not separate fat from lean tissue.
- identifier: HKQuantityTypeIdentifierBodyFatPercentage
  relationship: Composition estimates can add method-dependent context; they are not direct validation of BMI or
    lean mass.
- identifier: HKQuantityTypeIdentifierLeanBodyMass
  relationship: Lean mass describes more than skeletal muscle; derived outputs may share inputs with weight and
    body-fat estimates.
