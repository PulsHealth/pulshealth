description: |
  ## What does body fat percentage measure?
  Body Fat Percentage estimates the share of body mass attributable to fat. It differs from [weight](/knowledge-base/types/HKQuantityTypeIdentifierBodyMass/), which includes every body component, and [BMI](/knowledge-base/types/HKQuantityTypeIdentifierBodyMassIndex/), which compares weight with height.

  [Apple defines it as a discrete percent quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/bodyfatpercentage). HealthKit's [percent unit uses a scalar from 0 to 1](https://developer.apple.com/documentation/healthkit/hkunit/percent()): a raw value of **0.25 displays as 25%**. An export's percent unit label does not imply that the numeric value has already been multiplied by 100.

  ## How is the estimate made?
  Many connected scales use bioelectrical impedance analysis (BIA). It measures electrical behavior and uses a model to estimate body composition. [NIDDK describes why lean tissue's water content affects electrical conduction](https://www.niddk.nih.gov/research-funding/at-niddk/labs-branches/diabetes-endocrinology-obesity-branch/metabolic-clinical-research-unit/metabolic-testing).

  The app and measurement method matter. [Withings explains its scale's estimation process](https://support.withings.com/hc/en-us/articles/218970957-Body-How-does-the-scale-measure-my-body-composition), but that process cannot be assumed for every HealthKit producer. A stored value alone does not disclose the algorithm or establish equivalence with a clinical assessment.

  | Question | Useful check |
  |---|---|
  | Is this an estimate or a directly reported assessment? | Review the producer and method |
  | Do two devices agree? | Compare methods and measurement conditions before pooling |
  | Is the apparent change very large? | Check percent scaling, units and source changes |
  | Can I track a trend? | Keep the method and conditions comparable |

  ## What does the researched data show?
  The scoped full-year database snapshot contained **no raw body-fat records and no stored aggregates** for this type. A smaller 92-day window therefore also has no observations. There is no empirical range, outlier rate, recording cadence, source transition or measured figure to publish from this study.

  Weight and BMI records were present, illustrating that a scale app can supply those measurements without body-fat observations being available in the same export. Missing body-fat records mean unavailable evidence; they do not mean zero body fat or prove that the scale lacks a composition feature.

  ## How can I compare repeated estimates?
  Recording follows the producing device or app rather than a fixed HealthKit schedule. Exercise timing, hydration and measurement conditions deserve review with the device's instructions because BIA depends on electrical properties, not a direct measurement of fat tissue. Compare observations made with the same method and comparable conditions; missing measurements must remain missing.

  ## What ranges and related measurements are useful?
  There is no single HealthKit-defined healthy body-fat interval. Reference interpretation depends on the assessment method and relevant population. Generic athlete, fitness and obesity labels should not be assigned to a smart-scale estimate as though they were independently validated diagnoses.

  When weight and body-fat observations are contemporaneous and method-compatible, they can support an estimated fat mass. [Lean Body Mass](/knowledge-base/types/HKQuantityTypeIdentifierLeanBodyMass/) may be derived from the same inputs, so the resulting quantities need not provide independent corroboration. Neither pairing nor a composition formula could be checked with absent body-fat data in this study.

  ## Why might the entry be missing in Apple Health?
  Check whether the source app actually records this type, whether composition mode is enabled where applicable, and whether Apple Health sharing is allowed. Confirm the individual observation in the source app and Health before interpreting an empty graph. A weight record alone is insufficient evidence that a body-fat estimate was taken or shared.
metadata_keys:
- key: HKMetadataKeyWasUserEntered
  description: Optional producer flag indicating user-entered data; false or absence does not independently verify
    the measurement method.
- key: HKMetadataKeyExternalUUID
  description: Optional identifier supplied by an external producer; not an independent measurement validation.
- key: HKMetadataKeySyncIdentifier
  description: Optional producer-defined identifier used with sync version to manage an external sample.
- key: HKMetadataKeySyncVersion
  description: Optional producer-defined version for an externally synchronized sample.
related_types:
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Total weight provides the mass input for BMI and composition consistency checks.
- identifier: HKQuantityTypeIdentifierBodyMassIndex
  relationship: BMI combines weight with height; it does not separate fat from lean tissue.
- identifier: HKQuantityTypeIdentifierHeight
  relationship: Check the height input, units and measurement date when reviewing height-dependent quantities.
- identifier: HKQuantityTypeIdentifierLeanBodyMass
  relationship: Lean mass describes more than skeletal muscle; derived outputs may share inputs with weight and
    body-fat estimates.
