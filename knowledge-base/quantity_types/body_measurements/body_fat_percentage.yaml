primary_source: "Typically measured by smart scales using bioelectrical impedance analysis (BIA), or by clinical methods such as DEXA, hydrostatic weighing, or air displacement plethysmography."
description: |
  ## Overview
  Body fat percentage represents the proportion of total body mass composed of adipose (fat) tissue. Unlike BMI, which is a simple height-to-weight ratio, body fat percentage provides a direct measure of adiposity and better reflects actual body composition. This metric is essential for distinguishing between individuals who have similar weights but vastly different amounts of muscle versus fat.

  ## How It's Measured
  Body fat percentage can be measured through several methods with varying accuracy:

  **Consumer Methods (BIA - Bioelectrical Impedance Analysis):**
  - Smart scales and handheld devices send a small electrical current through the body
  - Fat tissue conducts electricity differently than lean tissue
  - Algorithms estimate body fat based on impedance measurements
  - Accuracy: ±3-5% compared to gold standard methods
  - Hydration status, recent exercise, and meal timing significantly affect readings

  **Clinical/Research Methods:**
  - **DEXA (Dual-Energy X-ray Absorptiometry)**: Gold standard for body composition; accuracy ±1-2%
  - **Hydrostatic Weighing**: Underwater weighing based on density differences
  - **Air Displacement Plethysmography (Bod Pod)**: Uses air displacement to measure body volume
  - **MRI/CT Scans**: Most accurate but expensive and impractical for routine use

  ## Health Significance
  Body fat percentage is a more accurate predictor of health outcomes than BMI alone. Excessive body fat is associated with:
  - Insulin resistance and type 2 diabetes
  - Cardiovascular disease and hypertension
  - Metabolic syndrome
  - Chronic inflammation
  - Hormonal imbalances
  - Sleep apnea
  - Certain cancers (breast, colon, endometrial)
  - Joint problems and mobility limitations

  Insufficient body fat can lead to:
  - Hormonal dysfunction (amenorrhea in women, low testosterone in men)
  - Compromised immune function
  - Poor thermoregulation
  - Nutrient deficiencies
  - Bone loss
  - Fertility problems

  ## Clinical Interpretation Guidelines

  ### Body Fat Classification Chart

  | Category | Men | Women |
  |----------|-----|-------|
  | Essential Fat | 2-5% | 10-13% |
  | Athletes | 6-13% | 14-20% |
  | Fitness | 14-17% | 21-24% |
  | Acceptable | 18-24% | 25-31% |
  | Obese | >25% | >32% |

  ### Elevated Body Fat May Indicate
  - Caloric surplus over time
  - Sedentary lifestyle
  - Hormonal imbalances (hypothyroidism, Cushing's syndrome, PCOS)
  - Medication side effects (steroids, some antidepressants)
  - Sleep deprivation or poor sleep quality
  - Chronic stress (elevated cortisol)
  - Metabolic adaptation from repeated dieting

  ### Low Body Fat May Indicate
  - Overtraining or excessive exercise
  - Eating disorders (anorexia nervosa, orthorexia)
  - Malabsorption syndromes
  - Chronic illness or cachexia
  - Hyperthyroidism
  - Relative Energy Deficiency in Sport (RED-S)

  ### Red Flags for Consultation
  - Men below 5% or women below 12% body fat - risk of hormonal disruption
  - Women with body fat <17% experiencing amenorrhea - evaluate for hypothalamic amenorrhea
  - Rapid changes (>2% in 4 weeks) without intentional intervention
  - Body fat >35% in men or >40% in women - high cardiometabolic risk
  - Athletes with declining performance and low body fat - screen for RED-S
  - Discrepancy between visual appearance and measured body fat percentage

  ## Caveats & Limitations
  - **Measurement variability**: Consumer BIA devices can vary 3-8% from true values and fluctuate day-to-day based on hydration, meals, and exercise
  - **Hydration dependence**: BIA significantly underestimates fat in dehydrated states and overestimates when over-hydrated
  - **Time-of-day effects**: Measure at consistent times (morning, fasted) for comparable readings
  - **Device-to-device variation**: Different scales may give different absolute values; track trends on the same device
  - **Population-specific algorithms**: Most BIA algorithms were developed on younger, Caucasian populations and may be less accurate for other demographics
  - **Does not indicate fat distribution**: Visceral fat (around organs) is more metabolically harmful than subcutaneous fat, but standard BIA cannot differentiate
  - **Athletic populations**: Standard BIA algorithms may underestimate fat in athletes with high muscle mass
  - **Elderly populations**: Age-related changes in hydration and tissue conductivity affect accuracy

  ## Additional Notes
  - For health risk assessment, combining body fat percentage with waist circumference provides better insight than either alone
  - Essential fat is the minimum fat required for basic physiological functions; dropping below essential fat levels is dangerous
  - Women require higher essential fat than men due to reproductive and hormonal functions
  - Professional athletes may temporarily drop to very low body fat for competition, but this is not sustainable or healthy long-term
  - Body fat percentage naturally increases with age as muscle mass declines (sarcopenia)
  - Focus on trends over time rather than single measurements; weekly or monthly tracking is more meaningful than daily
  - The same body fat percentage can look different on individuals of different heights and builds
