description: |
  ## What is BMI in Apple Health?
  Body Mass Index relates [weight](/knowledge-base/types/HKQuantityTypeIdentifierBodyMass/) to [height](/knowledge-base/types/HKQuantityTypeIdentifierHeight/): **weight in kilograms ÷ height in meters²**. HealthKit stores the BMI number using [count units](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/bodymassindex); 28.4 is a BMI value, not 28.4 measurements or a percentage.

  A scale app may calculate and write BMI alongside weight. The existence of a BMI record does not reveal which height the app used or establish that a separate height record exists in HealthKit.

  ## What BMI ranges mean
  BMI is a screening measure. It cannot separate fat from muscle or show fat distribution; interpret it alongside the broader health assessment. [CDC explains these limitations](https://www.cdc.gov/bmi/about/index.html).

  | Adult screening category, ages 20 and older | BMI, kg/m² |
  |---|---:|
  | Underweight | Below 18.5 |
  | Healthy weight | 18.5 to below 25 |
  | Overweight | 25 to below 30 |
  | Obesity | 30 or higher |

  These are [CDC adult categories](https://www.cdc.gov/bmi/adult-calculator/bmi-categories.html), not a diagnosis from a stored reading. Children and teens require age- and sex-specific BMI percentiles rather than this table.

  ## How often does BMI update?
  The example has **218 BMI records on 211 of 365 reporting days**, all from one source group. Each is instantaneous. The median positive gap was **1.00 day**, with a 95th percentile of **4.24 days** and a longest gap of **13.05 days**. The schedule matches the main weight source: no new weigh-in generally means no new BMI observation.

  The figure preserves gaps and shows 30-day-bin medians beside recorded values. It does not draw a daily BMI estimate for days without observations.

  ## What did the example values show?
  The full-year range was **27.17–29.92**, with a median of **28.41**. The 92-day focus window contained 48 records on 47 days, spanning **28.29–29.25**. All year records fell numerically within the adult 25-to-below-30 band, but this does not establish age applicability or an individual diagnosis. These distributions describe user data, not population reference intervals.

  No values were zero, negative or non-finite, and the source-level descriptive IQR check flagged none. That check identifies unusual values within this dataset; it cannot verify the height setting, calibration or clinical meaning.

  ## Can weight and height validate BMI?
  Every BMI record matched a positive weight observation at exactly the same start time and source group: **218 unique pairs**, with no ambiguous same-source timestamp duplicates. Computing the height implied by each pair produced almost the same result throughout the year, consistent with a fixed denominator.

  No raw height records were available within the year. This is a mathematical consistency check rather than a verified measurement of stature or proof of how the source calculated BMI. If BMI changes unexpectedly while weight stays similar, check the source app's height setting, units and dates before attributing the difference to body composition.

  ## Why might BMI be missing when weight is present?
  Missing BMI can coexist with present weight if an app writes only weight or lacks the inputs needed to calculate BMI. Check the producer's settings and Health sharing permission. [Body Fat Percentage](/knowledge-base/types/HKQuantityTypeIdentifierBodyFatPercentage/) supplies a different measurement when available; it cannot be inferred from BMI alone.

metadata_keys:
- key: HKMetadataKeyWasUserEntered
  description: Optional producer flag indicating user-entered data; false or absence does not independently verify
    the measurement method.
- key: HKMetadataKeyExternalUUID
  description: Optional identifier supplied by an external producer; not an independent measurement validation.
- key: HKMetadataKeySyncIdentifier
  description: Optional producer-defined identifier used with sync version to manage an external sample.
- key: HKMetadataKeySyncVersion
  description: Optional producer-defined version for an externally synchronized sample.
related_types:
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Total weight provides the mass input for BMI and composition consistency checks.
- identifier: HKQuantityTypeIdentifierBodyFatPercentage
  relationship: Composition estimates can add method-dependent context; they are not direct validation of BMI or
    lean mass.
- identifier: HKQuantityTypeIdentifierHeight
  relationship: Check the height input, units and measurement date when reviewing height-dependent quantities.
- identifier: HKQuantityTypeIdentifierLeanBodyMass
  relationship: Lean mass describes more than skeletal muscle; derived outputs may share inputs with weight and
    body-fat estimates.
