description: '## What does waist circumference tell you?

  Waist circumference measures the distance around your waist. It can complement body weight and BMI when assessing
  fat carried around the middle, but it does not directly measure visceral fat or diagnose a condition. HealthKit
  stores a discrete length measurement; the identifier does not specify where the tape was placed.


  That distinction matters. A measurement at the narrowest point, at the belly button or midway between the ribs
  and hips may give different results. Compare readings collected with the same protocol before interpreting a change
  as a change in body size.


  ## How do you make repeated measurements comparable?

  NHS guidance measures midway between the bottom of the ribs and top of the hips, after breathing out naturally.
  Use a consistent anatomical site and tape technique. A different site, clothing, tape tension or posture can change
  the result even when body size is unchanged.


  | What changed? | Why it affects interpretation |

  | --- | --- |

  | Measurement site or tape technique | A step in the trend may reflect a new method |

  | Display units | 1 metre equals 100 centimetres; check conversion before calling a value an outlier |

  | Source app or measuring device | Imported and newly measured values may follow different protocols |

  | Repeated readings in a session | An average can give that session more weight than other days |


  ## Is there a universal healthy waist range?

  There is no universal HealthKit range that applies across ages, body sizes and clinical circumstances. NHS guidance
  uses waist-to-height ratio alongside BMI and encourages a waist below half of height. Its adult calculator has
  specific exclusions, including pregnancy, eating disorders and BMI over 35. This is a screening tool, not a diagnosis
  or a substitute for individual assessment.


  If you calculate the ratio, use waist and height in the same units and check that height is appropriate and current.
  A waist measurement alone cannot recover height. A stored BMI cannot verify which height or method a producer
  used. Historical centimetre thresholds from different guidelines should not be mixed into a single green/red rule
  without specifying their population and purpose.


  ## What does recording cadence mean for this type?

  Waist measurements are usually occasional entries, with a schedule chosen by the user or producing app. There
  is no fixed HealthKit sampling interval. A recent measurement or a trend from comparable sessions is more useful
  than a sum of waist values. Keep gaps visible and investigate abrupt changes in method or units before smoothing
  them away.


  A reading taken during a workout or recorded sleep interval supplies timing context. It does not measure a within-workout
  or sleep-stage response. Comparing waist with weight or BMI on the same reporting day can show co-occurrence,
  but does not prove simultaneous measurement or explain the cause of a change.


  ## What can the available example data tell us?

  No waist-circumference observations were available in the reviewed reporting-year snapshot. The analysis cannot
  establish measured ranges, outliers, recording gaps or relationships with weight, BMI or height. Missing records
  are unavailable measurements, rather than a waist size of zero or evidence of low health risk.


  <details>

  <summary>Units and analysis details</summary>


  HealthKit accepts length units. PulsHealth''s canonical export uses metres; a centimetre display multiplies the
  value by 100. Preserve the raw unit contract and convert once. Review source, timestamp order, manual-entry metadata
  and duplicate imports. Neither a plausible length nor an app source independently verifies the anatomical measurement
  protocol.


  </details>

  '
