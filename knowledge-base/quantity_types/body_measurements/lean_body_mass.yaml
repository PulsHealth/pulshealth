description: |
  ## What does Lean Body Mass measure?
  Lean Body Mass describes body mass apart from fat tissue. It includes more than skeletal muscle, so a change should not automatically be described as muscle gain or loss. [Apple defines a discrete mass quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/leanbodymass), commonly displayed in kilograms or pounds.

  The producer's definition and method matter. A scale's muscle-mass label is not enough to establish that its value is equivalent to the HealthKit Lean Body Mass quantity.

  ## Is it measured or calculated?
  Connected scales can estimate composition using bioelectrical impedance and a model. [Withings describes estimating lean mass and fat from impedance](https://support.withings.com/hc/en-us/articles/218970957-Body-How-does-the-scale-measure-my-body-composition); this is manufacturer-specific guidance. [NIDDK explains the role of water-rich lean tissue in electrical conduction](https://www.niddk.nih.gov/research-funding/at-niddk/labs-branches/diabetes-endocrinology-obesity-branch/metabolic-clinical-research-unit/metabolic-testing).

  Another app might calculate a value from weight and body-fat fraction. **Weight × (1 − fat fraction)** is a useful consistency formula when the inputs are contemporaneous and compatible, but it does not prove how a particular stored record was generated.

  | Apparent change | Check before interpreting it |
  |---|---|
  | Lean mass rises while fat falls | Could share the same calculation inputs |
  | A large change follows exercise | Review measurement conditions and hydration sensitivity |
  | Another device reports a different number | Compare methods and definitions |
  | Lean mass exceeds total weight | Check units, pairing and producer semantics |

  ## What did the database research find?
  The full reporting year contained **no raw Lean Body Mass observations and no stored aggregates**. There are no actual ranges, outliers, source changes or gaps to estimate for this type. No measured figure is included, because empty records cannot support one.

  [Weight](/knowledge-base/types/HKQuantityTypeIdentifierBodyMass/) was present, while [Body Fat Percentage](/knowledge-base/types/HKQuantityTypeIdentifierBodyFatPercentage/) was absent. That prevents the proposed composition calculation from being checked against stored lean-mass data. Missing records do not imply zero lean tissue, a normal result or a failure of the measurement device.

  ## How often is it recorded?
  Cadence depends on when the producer measures or writes an estimate. It may accompany a weigh-in, but there is no HealthKit-wide fixed interval or guarantee that all composition fields are written together.

  When records are available, examine timing and source-specific cadence, distinguish repeat writes from new measurements, and keep units consistent. Averaging frequent entries gives those measurement sessions more weight; it does not estimate lean mass continuously between weigh-ins.

  ## Why can short-term estimates vary?
  BIA's sensitivity to electrical and fluid conditions means a short-term estimate change should not be read directly as newly gained or lost muscle tissue. Follow the producing device's measurement guidance when making repeated comparisons.

  ## What range should I expect?
  There is no universal healthy lean-mass range in kilograms: stature, body size and measurement method affect the result. Track a comparable series and interpret it with the broader assessment rather than assigning generic athlete or age-based categories.

  Use weight and body-fat observations to investigate how the values relate when they are present. If all three are outputs from the same model, mathematical agreement provides a consistency check rather than independent validation of composition.
metadata_keys:
- key: HKMetadataKeyWasUserEntered
  description: Optional producer flag indicating user-entered data; false or absence does not independently verify
    the measurement method.
- key: HKMetadataKeyExternalUUID
  description: Optional identifier supplied by an external producer; not an independent measurement validation.
- key: HKMetadataKeySyncIdentifier
  description: Optional producer-defined identifier used with sync version to manage an external sample.
- key: HKMetadataKeySyncVersion
  description: Optional producer-defined version for an externally synchronized sample.
related_types:
- identifier: HKQuantityTypeIdentifierBodyMass
  relationship: Total weight provides the mass input for BMI and composition consistency checks.
- identifier: HKQuantityTypeIdentifierBodyMassIndex
  relationship: BMI combines weight with height; it does not separate fat from lean tissue.
- identifier: HKQuantityTypeIdentifierBodyFatPercentage
  relationship: Composition estimates can add method-dependent context; they are not direct validation of BMI or
    lean mass.
- identifier: HKQuantityTypeIdentifierHeight
  relationship: Check the height input, units and measurement date when reviewing height-dependent quantities.
