description: |
  ## What does Apple Health weight measure?
  Body Mass is a weight measurement, usually supplied by a scale or entered into an app. It includes every component of body weight; it does not say how much is fat or muscle. [Apple defines it as a discrete quantity](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/bodymass), so adding successive weigh-ins does not produce a meaningful total.

  Use the same scale, location and time of day when comparing readings. The [NHS weighing guide](https://www.england.nhs.uk/long-read/how-to-record-your-weight/) recommends a level surface and similar clothing. A different measurement setup can change the number without establishing a change in body tissue.

  ## How often is weight recorded?
  Weight follows the measurement and logging schedule rather than a fixed Apple Watch sensing interval. The researched example contains **229 records on 212 of 365 reporting days**, from three source groups. The main scale-app source contributed 218 records on 211 days; 11 entries came from other apps. Source labels identify producers, not necessarily different physical scales.

  | Recording check | Main scale-app source, full year |
  |---|---:|
  | Median positive gap between records | 1.00 day |
  | 95th percentile positive gap | 4.24 days |
  | Longest gap between records | 13.05 days |
  | Stored duration | All records are instantaneous |

  A roughly daily median hides missed days and repeated weigh-ins. These gaps describe **stored observations**, not upload delays or a recommended weighing frequency.

  ## What does a useful trend look like?
  The figure shows the main source without filling missing days. Short median segments summarize successive 30-day bins; bins have different record counts, so each segment represents its observed measurements only.

  The all-source year range was **98.60–108.59 kg**. In the 92-day focus window, 48 measurements occurred on 47 days and ranged from **102.68–106.14 kg**. These are example values, not a healthy-weight range or a target. No universal healthy weight in kilograms applies across different heights and circumstances.

  All values were finite and positive. Within-source descriptive IQR checks flagged no records, but that does not independently validate scale accuracy. Keep unusual observations and check the original source, units and nearby readings before dismissing them.


  ## How does weight relate to BMI and body composition?
  [Body Mass Index](/knowledge-base/types/HKQuantityTypeIdentifierBodyMassIndex/) combines weight with height. All 218 main-source weight records matched BMI at an identical timestamp and source group. Their ratios were consistent with a fixed height, but no independently recorded [Height](/knowledge-base/types/HKQuantityTypeIdentifierHeight/) was available in the study window. Agreement therefore supports a consistency check, not verified height or proof of a particular producer algorithm.

  [Body Fat Percentage](/knowledge-base/types/HKQuantityTypeIdentifierBodyFatPercentage/) and [Lean Body Mass](/knowledge-base/types/HKQuantityTypeIdentifierLeanBodyMass/) can add composition context when present. They were absent here, so the observed weight trend cannot be divided into fat, muscle or water changes.

  ## Why is data missing or different between apps?
  Check whether a weigh-in reached the scale app, whether its Apple Health sharing permission is enabled, and whether the same entry appears in Health. Manual entries and imported records can coexist. Comparing the most recent observation or a source-specific trend is more useful than summing records or treating missing days as zero kilograms.
metadata_keys:
- key: HKMetadataKeyWasUserEntered
  description: Optional producer flag indicating user-entered data; false or absence does not independently verify
    the measurement method.
- key: HKMetadataKeyExternalUUID
  description: Optional identifier supplied by an external producer; not an independent measurement validation.
- key: HKMetadataKeySyncIdentifier
  description: Optional producer-defined identifier used with sync version to manage an external sample.
- key: HKMetadataKeySyncVersion
  description: Optional producer-defined version for an externally synchronized sample.
- key: HKMetadataKeyTimeZone
  description: Optional recorded timezone; reporting-calendar dates may differ.
related_types:
- identifier: HKQuantityTypeIdentifierBodyMassIndex
  relationship: BMI combines weight with height; it does not separate fat from lean tissue.
- identifier: HKQuantityTypeIdentifierBodyFatPercentage
  relationship: Composition estimates can add method-dependent context; they are not direct validation of BMI or
    lean mass.
- identifier: HKQuantityTypeIdentifierHeight
  relationship: Check the height input, units and measurement date when reviewing height-dependent quantities.
- identifier: HKQuantityTypeIdentifierLeanBodyMass
  relationship: Lean mass describes more than skeletal muscle; derived outputs may share inputs with weight and
    body-fat estimates.
