recording_behavior:
  reviewed_on: '2026-10-14'
  shape: A discrete body measurement written by the producing app; source and measurement conditions govern interpretation.
  cadence: Measurement or logging cadence, without a fixed HealthKit-wide schedule. Repeated entries are not necessarily
    independent measurements.
  context: "Compare readings from a consistent scale and source under similar measurement conditions; keep repeated weigh-ins and source changes visible."
  coverage: The year snapshot contains 229 raw records. Missing days or an absent type remain unavailable, not zero
    measurements.
  aggregation: Use source-specific trends or a recent observation. Summing a discrete body measurement is not meaningful;
    sample averages can overweight repeated sessions.
  metadata: Producer metadata may identify manual entry or import identifiers. Metadata does not independently verify
    device calibration or the calculation method.
  references:
  - title: Apple quantity definition
    url: https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/bodymass
seo_title: 'Apple Health Weight: Recording Frequency, Trends and Sources'
figures:
- src: /knowledge-base/figures/body-mass/recording-pattern.svg
  alt: Scatter plot of 218 actual weight observations with gaps and median segments across successive 30-day bins.
  title: Observed measurements leave unmeasured days
  caption: 'Example data from the main scale-app source: 218 instantaneous records on 211 reporting days. Points
    retain repeat measurements; median segments describe only observed records in each bin.'
  methods: Select the highest-record-count source group (bundle plus display name) within the full reporting year.
    Plot every selected observation against elapsed days since its first start timestamp. Compute medians in non-overlapping
    30-day elapsed-time bins and draw each segment only between that bin’s first and last observed timestamps. Do
    not fill missing days or join bins. No source names, absolute dates or record identifiers are shown.
  section: What does a useful trend look like?
  width: 960
  height: 410
