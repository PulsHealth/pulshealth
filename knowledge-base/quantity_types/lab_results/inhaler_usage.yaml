description: '## What does an inhaler usage count mean?


  HealthKit''s Inhaler Usage type records the number of puffs taken from an inhaler. It is cumulative count data:
  a record can represent one puff or several. The quantity alone does not identify the medicine, its strength, an
  inhaled dose in milligrams, or whether technique was effective.


  ## Can puff counts distinguish reliever and controller treatment?


  Only with separate, reliable medication context. A total count cannot tell whether use was scheduled, symptom-driven
  or part of an agreed plan before exercise. It also cannot establish adherence without the prescribed schedule
  and complete logging coverage. [NHLBI''s asthma guidance](https://www.nhlbi.nih.gov/health/asthma/treatment-action-plan)
  centers these decisions on an individual action plan.


  | Recorded information | What it does not establish |

  |---|---|

  | Puff count | Drug name, strength or amount reaching the lungs |

  | Sample timestamp | That a late or imported log was saved at the moment of use |

  | Daily total | Treatment adherence or asthma control by itself |

  | No records | No medication use |


  ## How should daily totals and logging gaps be read?


  Sum compatible, nonduplicated count contributions for the reporting day after reviewing sources. An app can save
  one record per event or a summary, so the number of rows is different from the number of puffs. Overlapping manual
  and imported logs can inflate totals; a change in logging app can change coverage.


  There is no universal normal daily puff count across medicines and treatment plans. Compare recorded use with
  the actual prescription and known coverage rather than applying a generic threshold or changing treatment from
  the graph alone.


  ## What other information makes the log useful?


  An identified medicine, prescribed schedule, symptoms and [peak flow readings](/knowledge-base/types/HKQuantityTypeIdentifierPeakExpiratoryFlowRate/)
  can make a review more informative. Their timing can describe context, but it does not prove a trigger or medication
  response. Follow the agreed action plan when symptoms worsen; the count record is not a replacement for it.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is not listed in the current PulsHealth sync catalog. Its presence in this reference does
  not promise collection. Database absence does not establish absence in Apple Health.

  '
