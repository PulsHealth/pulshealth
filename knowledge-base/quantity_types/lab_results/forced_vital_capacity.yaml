description: '## What does forced vital capacity measure?


  FVC is the total volume exhaled during a forced breathing test after a full inhalation. HealthKit represents it
  as a discrete volume, usually displayed in liters. It differs from [FEV1](/knowledge-base/types/HKQuantityTypeIdentifierForcedExpiratoryVolume1/),
  the portion exhaled in the first second, and from total lung capacity, which includes air remaining in the lungs.


  ## Does a low FVC establish restrictive lung disease?


  No. A reduced value can reflect several physiological or testing factors. [Assessment of restriction](https://erj.ersjournals.com/content/erj/60/1/2101499.full.pdf)
  requires additional lung-volume testing and clinical interpretation. A generic liter cutoff or a raw HealthKit
  value cannot establish a diagnosis.


  | Context to retain | What it helps explain |

  |---|---|

  | Full inhalation and complete expiration | Technique can affect the measured volume. |

  | Test quality and selected result | Individual attempts are different from a session''s reported result. |

  | Before or after bronchodilator | Keep distinct testing conditions separate. |

  | Reference equation and units | Compare measured volumes separately from derived reference scores. |


  ## How should FVC be compared with FEV1?


  Use values from the same test session and pre- or post-bronchodilator condition. The reported maximum FVC and
  FEV1 may come from different acceptable maneuvers in that session under [ATS/ERS standards](https://pmc.ncbi.nlm.nih.gov/articles/PMC6794117/).
  Do not divide unrelated averages or assume that timestamps identify a session.


  Reference interpretation depends on more than absolute volume. The [ATS recommends a race-neutral approach](https://site.thoracic.org/about-us/news/ats-publishes-official-statement-on-race-ethnicity-and-pulmonary-function-test-interpretation),
  so preserve the reference equation used instead of treating an older ethnicity adjustment as required. A low FVC
  with a preserved ratio still needs the broader test report.


  ## Why can values change between tests?


  Technique, test conditions and equipment can differ, alongside changes in lung function. Compare compatible sessions
  and retain quality information when available. A source may save every attempt or just one selected result; HealthKit
  row counts therefore do not prove testing frequency. Missing entries do not establish normal values.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is not listed in the current PulsHealth sync catalog. Its presence in this reference does
  not promise collection. Database absence does not establish absence in Apple Health.

  '
