description: '## Overview


  Number of Times Fallen stores a cumulative count of recorded falls. It is a history of saved observations,
  rather than a continuous measure of balance or a complete inventory of every fall.


  ## What does a saved count represent?


  | Item | Interpretation |

  | --- | --- |

  | Quantity value | Number of falls represented by the sample |

  | Number of rows | Number of saved samples; not automatically the number of falls |

  | No records | No observations available; not a verified zero-fall period |


  For a total, use the quantity values after reconciling sources and duplicate imports. One sample can represent
  a count over an interval, so counting rows is not a general substitute for summing the recorded quantities.


  ## Does Apple Watch record every fall?


  Apple says Fall Detection can miss falls and can mistake high-impact activity for a fall. The user''s response
  to the alert also affects whether a fall is saved. A detected alert therefore should not be treated as an
  independently verified fall without reviewing its context.


  The setting can be Always On or Only On During Workouts. That setting matters when interpreting coverage:
  a history collected only during workouts cannot establish a fall rate across the entire day. Changes in settings
  and whether the watch was worn can change what is observable.


  ## Is the history a real-time alert feed?


  Apple distinguishes HealthKit history from Core Motion''s fall-detection notifications. HealthKit updates
  can follow the event after a delay, so a query of saved samples is not a guaranteed immediate emergency signal.
  Keep recorded event times separate from the time an app discovers or imports the record.


  ## How can a trend be made useful?


  Compare periods with known recording coverage and show the source of each count. Do not interpret a month
  without entries as improved stability unless the logging coverage supports that conclusion. A high count
  warrants checking sample quantities and overlapping imports before attributing it to a change in mobility.


  Walking Steadiness and Walking Speed provide separate mobility context when available. They do not prove
  that a particular fall happened, and a favorable gait measurement does not guarantee that falls will not
  occur.


  ## What data was available for this example?


  No number of times fallen records were found in the selected database window. This type is listed in the
  current PulsHealth sync catalog. Database coverage does not establish whether corresponding entries exist
  in Apple Health. No measured ranges, recording intervals or source comparisons are available from this example.

  '
