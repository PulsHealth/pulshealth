description: '## What does peak expiratory flow measure?


  Peak expiratory flow is the highest flow reached during a forceful exhalation. HealthKit stores a discrete volume-per-time
  quantity, commonly displayed in liters per minute. Unlike [FEV1](/knowledge-base/types/HKQuantityTypeIdentifierForcedExpiratoryVolume1/),
  it is a flow rate rather than the total volume exhaled over a fixed interval.


  ## What is a useful comparison range?


  A generic adult range can be misleading. Technique, equipment and individual characteristics matter, and an asthma
  action plan may use a personal baseline and agreed zones. [NHLBI recommends keeping peak-flow results](https://www.nhlbi.nih.gov/health/asthma/living-with)
  to compare them over time with the care plan. A missing measurement is not evidence that airflow was normal.


  | Context | Why it matters |

  |---|---|

  | L/min versus L/s | Multiply L/s by 60 to express the same flow in L/min. |

  | Same device and technique | A different method can disrupt comparisons. |

  | Individual attempts versus selected result | Several blows may represent one test session. |

  | Time and medication context | Measurements under different conditions may not be directly comparable. |


  ## Why might several readings occur close together?


  A measurement routine may include repeated blows and a selected result. The writing app can preserve the attempts
  or only that result; rows therefore do not establish session count. Follow the measurement instructions agreed
  with the provider and inspect source context before combining imports or calculating trends.


  ## How does peak flow relate to symptoms and inhaler use?


  [Inhaler logs](/knowledge-base/types/HKQuantityTypeIdentifierInhalerUsage/) and breathing symptoms can help describe
  the circumstances around readings. A nearby count does not establish medication identity, dose or a treatment
  effect. Comparisons need compatible testing conditions and known timing, rather than automatic pairing of the
  nearest samples.


  Peak flow is one part of an individual [asthma action plan](https://www.nhlbi.nih.gov/health/asthma/treatment-action-plan).
  The graph alone cannot diagnose asthma or set treatment changes.


  ## Does PulsHealth currently collect this type?


  This HealthKit type is not listed in the current PulsHealth sync catalog. Its presence in this reference does
  not promise collection. Database absence does not establish absence in Apple Health.

  '
