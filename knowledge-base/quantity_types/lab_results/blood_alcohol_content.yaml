description: '## Overview


  Blood Alcohol Content records a concentration value supplied to Apple Health. The HealthKit identifier does
  not tell you whether an entry came from a measurement, an estimate or a retrospective log. That distinction
  belongs with the source and its method.


  ## How should percent values be read?


  | Representation | Meaning |

  | --- | --- |

  | Percent displayed to a reader | A concentration expressed as a percentage |

  | HKUnit.percent() quantity | A fractional number; multiply by 100 for percent display |

  | Illustrative conversion | A quantity of 0.0008 corresponds to 0.08% |


  The conversion is an arithmetic example, not an observed result or safety threshold. Keep the quantity''s
  unit alongside its number when importing or exporting. A fraction accidentally displayed as a percent can
  create a hundredfold error. Do not reinterpret this percent quantity as a mass-per-volume unit without an
  explicit, appropriate conversion.


  ## Is this measured by Apple Watch?


  The existence of this HealthKit type does not establish an Apple Watch alcohol sensor or an automatic testing
  schedule. A source app can write data with permission. Before comparing entries, identify what the source
  reports, when the underlying reading was obtained and whether its method changed.


  ## What can a timeline tell you?


  This is a discrete concentration reading, so adding successive values does not produce a meaningful daily
  total. Plot saved readings with their timestamps and leave unobserved periods visible. A long gap does not
  show that concentration stayed unchanged or returned to zero. Interpolation requires additional assumptions
  that the saved samples do not provide.


  A drink log can supply context, but drink count alone does not determine blood alcohol content. Do not convert
  a logged number of drinks into this metric or label a saved value a guarantee of fitness to drive.


  ## What data was available for this example?


  No blood alcohol content records were found in the selected database window. This type is listed in the current
  PulsHealth sync catalog. Database coverage does not establish whether corresponding entries exist in Apple
  Health. No measured ranges, recording intervals or source comparisons are available from this example.

  '
