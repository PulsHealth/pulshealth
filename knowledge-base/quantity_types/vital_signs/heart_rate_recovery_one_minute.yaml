description: '## What does one-minute heart rate recovery mean?


  Heart rate recovery describes the fall from peak exercise heart rate to the rate one minute after exercise ends.
  For illustration, a peak of 160 bpm and a one-minute rate of 130 bpm gives a 30 bpm drop. That example explains
  the concept; it does not reconstruct Apple''s estimation algorithm. [Apple''s HealthKit definition](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/heartraterecoveryoneminute)
  specifies a positive recovery quantity.


  A clinic''s maximal exercise test and a wearable''s submaximal prediction can have different protocols. Keep the
  recovery **test type**, activity and source rather than treating every value as the exact difference between two
  visible heart-rate samples.


  ## When do estimates appear?


  The example reporting year contained **56 records on 55 of 365 days**. July–September had **17 records on 17 of
  92 days**. The larger focus source group contributed sixteen records, with a median positive gap of about **96
  hours**. The other source group had one record, so no interval cadence could be calculated for it.


  All seventeen focus estimates were within ten minutes of a same-bundle workout interval, but only two timestamps
  fell literally inside one. These were point records, not minute-long samples. Proximity suggests workout context;
  it does not establish an explicit workout UUID link or prove that every workout should produce a record.


  ## What values appeared in the example?


  | Window | Median recovery drop | Recorded range |

  |---|---:|---:|

  | October 2025–September 2026 | 31.35 bpm | 25.09–43.53 bpm |

  | July–September 2026 | 32.47 bpm | 25.09–38.70 bpm |


  All 56 year records carried **submaximal prediction test type 2**, and activity metadata included running, walking
  and hiking. The analysis retained one source/context IQR flag and reviewed extremes and neighbors. Those observed
  ranges do not establish a clinical normal range or a target for another workout protocol.


  ## Why might the number differ from a manual calculation?


  Recorded metadata included a session estimate for 42 of the 56 rows, along with activity duration and, usually,
  a maximum observed recovery heart rate. A session estimate and the saved recovery quantity are separate fields;
  do not silently substitute one for the other. Some quantities are encoded as value-plus-unit strings, so inspect
  units before arithmetic.


  Apple''s [heart-rate measurement guide](https://support.apple.com/en-us/120277) describes monitoring through exercise
  and for three minutes afterward. It does not promise that subtracting the nearest exported point exactly reproduces
  the saved recovery estimate. Intensity, cooldown, posture, signal quality and the test protocol can all affect
  comparison.


  ## Is a low result a medical threshold?


  The frequently quoted **12 bpm or less** threshold comes from a [1999 clinical exercise-testing study](https://pubmed.ncbi.nlm.nih.gov/10536127/).
  Its participants and exercise/recovery protocol differ from everyday wearable estimates. It is evidence that recovery
  can be clinically meaningful, not a universal diagnosis rule for Apple Health data.


  Review persistent unexpected changes with a clinician when appropriate, especially alongside symptoms. A high
  recovery number alone does not certify cardiovascular health. Avoid assigning “excellent,” “poor” or mortality-risk
  categories to a wearable estimate without a matching validated protocol.


  ## Which other fitness measurements add context?


  The research investigated same-source daily comparisons
  with [resting heart rate](/knowledge-base/types/HKQuantityTypeIdentifierRestingHeartRate/), [HRV SDNN](/knowledge-base/types/HKQuantityTypeIdentifierHeartRateVariabilitySDNN/)
  and [VO2 max](/knowledge-base/types/HKQuantityTypeIdentifierVO2Max/). Sparse workout-selected dates and confounding
  make those associations exploratory.


  For exported trends, separate sources and test types, keep unrecorded workouts as missing, and use discrete summaries
  rather than adding recovery drops. The canonical PulsHealth export labels this rate difference in count/min; Apple''s
  type documentation describes count units. Preserve the receiver''s unit convention and the meaning of the drop
  when exchanging data.

  '
metadata_keys:
- key: HKMetadataKeyHeartRateRecoveryTestType
  description: Indicates the type of test or workout from which HRR was derived
  values:
  - maxExercise (1) — maximal exercise test
  - predictionSubMaxExercise (2) — submaximal prediction
- key: HKMetadataKeyHeartRateRecoveryActivityType
  description: The workout activity type associated with the HRR measurement
  values:
  - Running
  - Walking
  - Hiking
- key: HKMetadataKeyHeartRateRecoveryActivityDuration
  description: Duration of the workout activity in seconds
  values:
  - Numeric value in seconds
- key: HKMetadataKeyHeartRateRecoveryMaxObservedRecoveryHeartRate
  description: The peak heart rate recorded during recovery period
  values:
  - Numeric value in bpm
related_types:
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: Underlying pulse context; saved summary estimates cannot necessarily be reconstructed from exported
    samples.
- identifier: HKQuantityTypeIdentifierRestingHeartRate
  relationship: Waking-rest estimate that adds context; source and measurement windows can differ.
- identifier: HKQuantityTypeIdentifierHeartRateVariabilitySDNN
  relationship: Separate interval-variability calculation; source, window and signal quality matter, and correlations
    do not establish cause.
- identifier: HKQuantityTypeIdentifierVO2Max
  relationship: Aerobic-capacity estimate from selected activity opportunities; compare consistent methods and sources.
- identifier: HKQuantityTypeIdentifierWalkingHeartRateAverage
  relationship: Daily walking-context estimate; compare source and activity conditions rather than treating the
    difference from resting rate as a clinical test.
- identifier: HKWorkout
  relationship: Exercise context; temporal proximity does not prove an explicit HealthKit association.
