recording_behavior:
  reviewed_on: '2026-10-14'
  shape: Derived discrete estimate; stored intervals do not prove continuous physiological measurement.
  cadence: Assess positive start gaps within source groups; a missing day is not zero.
  context: Separate source histories and preserve metadata; overlap is temporal context only.
  coverage: Full reporting year and 92-day focus examined; unavailable observations remain missing.
  aggregation: Use discrete summaries; distinguish samples from reporting days and never sum rates.
  metadata: Review optional test/activity metadata and source versions before comparisons.
