    relationship: "Activity data - Walking distance correlates with walking HR collection opportunities"
  - identifier: "HKQuantityTypeIdentifierVO2Max"
    relationship: "Fitness indicator - Both metrics reflect cardiorespiratory fitness; lower walking HR often correlates with higher VO2max"
  - identifier: "HKQuantityTypeIdentifierHeartRateRecoveryOneMinute"
    relationship: "Complementary - Both assess cardiovascular fitness and autonomic function"
  - identifier: "HKQuantityTypeIdentifierStepCount"
    relationship: "Activity context - Step count provides context for walking activity volume"

