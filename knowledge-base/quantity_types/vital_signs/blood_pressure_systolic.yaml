description: |
  ## What does this number mean?

  Systolic pressure is the upper number, reflecting arterial pressure as the heart contracts. Blood pressure is normally written as systolic/diastolic, such as 120/80 mmHg. Interpret both numbers together: one component alone can miss an elevated reading in the other.

  HealthKit supports separate quantity samples and a [blood-pressure correlation](https://developer.apple.com/documentation/healthkit/hkcorrelationtypeidentifier/bloodpressure) that groups the components. A matching timestamp in an exported database does not prove membership in that correlation. See [Blood Pressure](/knowledge-base/types/HKCorrelationTypeIdentifierBloodPressure/) for the pairing distinction.

  ## What did example Apple Health data show?

  The October 2025–September 2026 research window contained **39 systolic samples on 17 reporting days**, recorded in January and April. July–September contained none. This describes available records, not year-round monitoring or a clinical baseline.

  | Feature | Example records |
  |---|---|
  | Minimum–maximum | 110–140 mmHg |
  | Median | 125 mmHg |
  | Middle 50% | 120–128 mmHg |
  | Source grouping | 29 automation-source records; 10 tracking-app records |
  | Sample interval | All instantaneous: start and end were equal |
  | Missing calendar days | 348 of 365 had no record |

  The figure keeps systolic and diastolic distributions separate. Repeated timestamps are retained rather than silently deduplicated. A recording source describes the app that wrote the data; it does not establish the cuff, operator, posture or clinical setting.

  ## How often is blood pressure recorded?

  There is no universal HealthKit schedule. A connected monitor may upload a reading after each cuff measurement, while an app or automation can log imported or manually entered values. In these records, the automation-source median positive start gap was approximately **24 hours**, compared with **155 seconds** in the tracking-app source. Both summaries include gaps between sessions, so neither is a recommended measurement interval.

  Ten successive automation-source starts had zero timestamp gaps. The shortest positive tracking-app gap was one second, and the longest automation-source gap was about 79 days. Such patterns call for checking entry/import behavior before treating every row as a fresh cuff inflation.

  ## Do workouts and sleep change the readings?

  None of the stored examples overlapped a recorded workout or asleep interval. That leaves workout-versus-sleep differences **unmeasured**, rather than showing no physiological effect. Recording in the morning also does not prove a standardized resting measurement.

  For comparable home readings, the [American Heart Association](https://www.heart.org/en/health-topics/high-blood-pressure/monitoring-your-blood-pressure-at-home) recommends a validated monitor, correct cuff size, a quiet seated rest, supported positioning and repeated readings. Record the conditions consistently; exercise-adjacent measurements should not be pooled indiscriminately with rested home measurements.

  ## Which values need a closer look?

  No systolic rows exceeded the source/context 1.5-IQR fences; all values were retained. A statistical flag is not a diagnosis. Conversely, a value can need clinical review without being unusual within this small dataset. Recheck unexpected values against the original device, technique, units and symptoms.

  | Adult blood-pressure category | Systolic | Diastolic |
  |---|---|---|
  | Normal | Below 120 | and below 80 |
  | Elevated | 120–129 | and below 80 |
  | Stage 1 | 130–139 | or 80–89 |
  | Stage 2 | 140 or higher | or 90 or higher |

  These [AHA categories](https://www.heart.org/en/health-topics/high-blood-pressure/monitoring-your-blood-pressure-at-home) use mmHg and should be assessed with repeated, properly obtained readings. They do not diagnose hypertension from an isolated HealthKit row; individual treatment targets may differ. Blood pressure above 180 systolic and/or 120 diastolic requires prompt reassessment and medical advice. With symptoms such as chest pain, shortness of breath or new neurological symptoms, seek emergency care.

  ## How does it relate to other HealthKit types?

  Compare with [Diastolic Blood Pressure](/knowledge-base/types/HKQuantityTypeIdentifierBloodPressureDiastolic/) using verified paired measurements where available. Here, exact start/end/source matching produced **59 candidate combinations from 39 records per component**, because some matching keys were duplicated. Assigning a unique pulse pressure or blood-pressure category to those combinations would invent pairing evidence.

  Source-specific reporting-day medians allowed an exploratory systolic–diastolic comparison across 16 days in the automation source. That is a day-level relationship, not 16 confirmed cuff-reading pairs. Resting heart rate and body mass can provide broader context, but sparse overlapping days, app changes and inconsistent measurement conditions prevent causal conclusions.

  ## What should I check before analyzing an export?

  Keep raw components, source revisions, units, timestamps and any actual correlation membership separate. Inspect duplicate keys before joining, use the same reporting calendar, and distinguish zero-duration observations from continuous monitoring. Compute visit or day summaries only after deciding how repeated measurements and imports should be handled. A source change or recording gap may explain a trend more readily than a physiological change.
