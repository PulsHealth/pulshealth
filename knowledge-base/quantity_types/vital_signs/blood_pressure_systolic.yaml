description: |
  ## Overview

  Systolic blood pressure (SBP) represents the maximum pressure exerted against arterial walls during ventricular contraction (systole). It is the first or "top" number in a standard blood pressure reading (e.g., **120**/80 mmHg). This measurement reflects the force generated by the heart during each beat and is influenced by cardiac output, arterial stiffness, and peripheral vascular resistance.

  In HealthKit, systolic blood pressure is stored as part of a correlation sample (HKCorrelationTypeIdentifierBloodPressure) that combines both systolic and diastolic readings into a single blood pressure measurement. However, authorization and data access are performed on the individual quantity types.

  ## How It's Measured

  **Oscillometric Method (most consumer devices):** An inflatable cuff is wrapped around the upper arm (or wrist). The device inflates the cuff to temporarily occlude blood flow, then slowly deflates while detecting pressure oscillations. A microprocessor algorithm converts these oscillations to systolic and diastolic values.

  **Auscultatory Method (clinical gold standard):** A healthcare provider uses a stethoscope to listen for Korotkoff sounds while manually deflating a sphygmomanometer cuff. The first sound indicates systolic pressure.

  **Measurement Best Practices:**
  - Rest for 5 minutes before measurement
  - Sit with back supported, feet flat on floor
  - Position arm at heart level
  - Use appropriately sized cuff (covers 80% of arm circumference)
  - Avoid caffeine, exercise, and smoking 30 minutes prior
  - Take 2-3 readings 1-2 minutes apart; average the results

  ## Health Significance

  Systolic blood pressure is a critical cardiovascular risk indicator. Elevated SBP is strongly associated with increased risk of:
  - Stroke (both ischemic and hemorrhagic)
  - Coronary heart disease and myocardial infarction
  - Heart failure
  - Chronic kidney disease
  - Peripheral artery disease
  - Cognitive decline and dementia

  Research demonstrates that for every 20 mmHg increase in systolic BP above 115 mmHg, the risk of cardiovascular death doubles. Systolic pressure becomes increasingly important with age as arteries stiffen, and isolated systolic hypertension (elevated SBP with normal diastolic) is the most common form of hypertension in older adults.

  ## Clinical Interpretation Guidelines

  ### Blood Pressure Categories (AHA/ACC 2017 Guidelines, reaffirmed 2025)

  | Category | Systolic (mmHg) | | Diastolic (mmHg) |
  |----------|-----------------|---|------------------|
  | **Normal** | <120 | and | <80 |
  | **Elevated** | 120-129 | and | <80 |
  | **Stage 1 Hypertension** | 130-139 | or | 80-89 |
  | **Stage 2 Hypertension** | >=140 | or | >=90 |
  | **Hypertensive Crisis** | >180 | and/or | >120 |

  ### Elevated Values May Indicate
  - Essential (primary) hypertension
  - Secondary hypertension (renal disease, endocrine disorders, medications)
  - White coat hypertension (elevated in clinical settings only)
  - Arterial stiffness (especially isolated systolic hypertension)
  - Acute stress, pain, or anxiety
  - Recent caffeine, alcohol, or stimulant use
  - Medication non-adherence

  ### Low Values May Indicate
  - Hypotension (systolic <90 mmHg may be concerning)
  - Dehydration or volume depletion
  - Medication side effects (antihypertensives, diuretics)
  - Cardiac dysfunction (heart failure, arrhythmias)
  - Sepsis or severe infection
  - Endocrine disorders (adrenal insufficiency)
  - Autonomic dysfunction

  ### Red Flags for Immediate Consultation
  - **Hypertensive Crisis:** SBP >180 mmHg, especially with symptoms (severe headache, chest pain, shortness of breath, visual changes, confusion)
  - **Symptomatic Hypotension:** SBP <90 mmHg with dizziness, syncope, or altered consciousness
  - **Sudden significant change:** Increase or decrease of >30 mmHg from baseline
  - **Target organ damage symptoms:** New neurological deficits, chest pain, acute vision changes

  ## Caveats & Limitations

  - **White Coat Effect:** Office readings may be 10-20 mmHg higher than home readings; ambulatory or home monitoring provides more accurate assessment
  - **Masked Hypertension:** Normal office readings but elevated at home; affects ~15% of patients
  - **Measurement Variability:** Blood pressure naturally fluctuates throughout the day; single readings are insufficient for diagnosis
  - **Cuff Size Errors:** Incorrectly sized cuffs can cause significant measurement errors (too small overestimates, too large underestimates)
  - **Device Accuracy:** Consumer devices vary in accuracy; look for devices validated against clinical standards
  - **Arrhythmias:** Atrial fibrillation and other arrhythmias can make accurate measurement difficult
  - **Position Effects:** Arm position below heart level can falsely elevate readings by 10+ mmHg

  ## Additional Notes

  **Correlation Requirement:** In HealthKit, blood pressure readings are stored as HKCorrelation objects containing both systolic and diastolic samples. When saving data, both values must be recorded together for a complete reading.

  **Home Monitoring Importance:** Home blood pressure monitoring is increasingly recognized as superior to office measurements for diagnosis, treatment decisions, and long-term management. Patients should be counseled on proper technique.

  **Treatment Thresholds:** Current guidelines recommend considering treatment at SBP >=130 mmHg for most adults, with targets typically <130 mmHg. Individual targets may vary based on age, comorbidities, and risk factors.

