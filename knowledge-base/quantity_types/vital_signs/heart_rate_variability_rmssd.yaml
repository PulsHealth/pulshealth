related_types:
- identifier: HKQuantityTypeIdentifierHeartRateVariabilitySDNN
  relationship: Separate interval-variability calculation; source, window and signal quality matter, and correlations
    do not establish cause.
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: Underlying pulse context; saved summary estimates cannot necessarily be reconstructed from exported
    samples.
- identifier: HKQuantityTypeIdentifierRestingHeartRate
  relationship: Waking-rest estimate that adds context; source and measurement windows can differ.
- identifier: HKQuantityTypeIdentifierRespiratoryRate
  relationship: 'Influence factor: breathing rate and depth change RMSSD without necessarily changing vagal tone'
- identifier: HKCategoryTypeIdentifierSleepAnalysis
  relationship: Recorded asleep intervals provide contextual alignment; temporal associations do not prove sleep
    effects.
- identifier: HKQuantityTypeIdentifierAppleSleepingWristTemperature
  relationship: 'Companion overnight vital: Vitals reviews it alongside Recovery HRV, respiratory rate and sleeping
    heart rate'
- identifier: HKQuantityTypeIdentifierHeartRateRecoveryOneMinute
  relationship: Exercise-recovery estimate; test type and activity conditions are needed for comparison.
