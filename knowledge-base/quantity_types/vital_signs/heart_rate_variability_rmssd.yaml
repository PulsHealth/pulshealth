devices:
- name: Apple Watch
  capability: Apple Watch Series 12 and Ultra 4 record Recovery HRV with their new Health Sensing System. Apple
    says these models measure HRV as often as every five minutes, about 24 times more often than earlier models,
    and that overnight Vitals compares Recovery HRV with a personal baseline. Apple has not published the window
    length behind each sample, how beats are detected and cleaned, or when a reading is skipped.
  series: Series 12 and Ultra 4 (watchOS 27)
  accuracy: Apple has published no validation data for this type. Wrist-worn HRV is usually derived from optical
    (PPG) pulse intervals. Pulse rate variability matches ECG well at rest, but it tends to overestimate short-term
    variability somewhat, and agreement worsens with movement (Schäfer & Vagedes 2013).
- name: iPhone
  capability: Displays Recovery HRV but cannot measure it without an external sensor
- name: Chest strap heart rate monitors
  capability: RR-capable external recordings can provide intervals for an authorized app to calculate RMSSD; processing
    and recording conditions determine comparability.
  examples:
  - Polar H10
  - Garmin HRM-Pro
  - Wahoo TICKR X
- name: Other authorized sources
  capability: A writable HealthKit type can contain results saved by another authorized app; verify the actual writer
    and method.
primary_source: Apple Watch
description: '## What does RMSSD measure?


  RMSSD is the root mean square of successive differences between normal beat intervals, expressed in milliseconds.
  It summarizes short-term beat-to-beat variability; it is neither heart rate in bpm nor a general recovery diagnosis.
  Breathing, posture, measurement window and signal processing affect interpretation.


  [Apple''s HealthKit RMSSD identifier](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/heartratevariabilityrmssd)
  was introduced with iOS and watchOS 27. Apple''s [2026 health announcement](https://www.apple.com/newsroom/2026/09/apple-advances-health-and-fitness-capabilities-using-apple-intelligence/)
  describes Recovery HRV and supported watch hardware. Identifier availability alone does not guarantee that a device
  writes records or that historical data exists.


  ## Why can SDNN be present while RMSSD is missing?


  The refreshed example database contained **no RMSSD records in the October 2025–September 2026 reporting year**,
  while it did contain [HRV SDNN](/knowledge-base/types/HKQuantityTypeIdentifierHeartRateVariabilitySDNN/) records.
  The analysis checked the requested identifier directly instead of assuming absence from an older pilot extract.
  It therefore cannot provide an observed RMSSD range, outliers, cadence or workout/sleep contrast for this window.


  | Question | What the investigation established |

  |---|---|

  | Is the identifier supported in the current catalog? | Yes; it has its own type and canonical millisecond unit.
  |

  | Were raw RMSSD observations present in the study year? | No exported records for this identifier. |

  | Can SDNN fill the gap? | No; it is a different calculation. |

  | Does missing RMSSD prove poor recovery or non-wear? | No. Hardware, software, permission, collection and sync
  history remain possible explanations. |


  No empirical RMSSD figure is published because inventing or relabeling SDNN observations would answer the wrong
  question. Availability guidance remains useful even when the example has no measurements.


  ## How is RMSSD different from SDNN?


  SDNN describes dispersion of normal intervals within a measurement window; RMSSD describes successive differences.
  Their scales depend on the underlying signal and recording window, so there is no universal ordering in which
  one must always be larger. They are not interchangeable estimates, and a numerical conversion cannot recover RMSSD
  from a stored SDNN summary alone.


  | Type | Main calculation | Comparison requirement |

  |---|---|---|

  | RMSSD | Successive normal-interval differences | Match source, window and context |

  | SDNN | Standard deviation of normal intervals | Match source, duration and context |

  | Heart rate | Beats per unit time | Different quantity and unit |


  The [HRV measurement standards](https://www.ahajournals.org/doi/10.1161/01.cir.93.5.1043) emphasize recording
  conditions and normal intervals. An apparent high HRV value can reflect signal error or irregular beats rather
  than improved recovery. Stored scalar summaries cannot independently verify beat quality.


  ## What should I look for when records become available?


  Start with source identity and version, units, sample durations, days with records and positive within-source
  intervals. Inspect zeros, nonfinite values, retained extremes and nearby readings. Separate overnight windows
  from daytime observations using recorded [sleep intervals](/knowledge-base/types/HKCategoryTypeIdentifierSleepAnalysis/);
  a whole-day average can mix different conditions.


  During workouts, motion and changing exertion make pulse-derived interval comparisons more difficult. Investigate
  actual recording opportunities rather than assuming an advertised maximum frequency is an uninterrupted schedule.
  The current no-record window cannot establish how cadence changes during exercise, sleep or source updates.


  ## Can I compare it with resting heart rate or sleep?


  Potentially, with clear alignment. Compare consistent sources and defined windows with [resting heart rate](/knowledge-base/types/HKQuantityTypeIdentifierRestingHeartRate/),
  [respiratory rate](/knowledge-base/types/HKQuantityTypeIdentifierRespiratoryRate/) and sleep timing; account for
  different summary intervals. No RMSSD pairings were possible in this dataset, so no empirical correlations or
  sleep effects are claimed.


  Population HRV studies use different protocols and do not supply a universal Apple Watch Recovery HRV target.
  Favor a consistent personal baseline once adequate measurements exist. A single reading cannot diagnose illness,
  overtraining or stress. Keep RMSSD and SDNN separately labeled in storage and charts, and preserve missing observations
  rather than inserting zeros.

  '
