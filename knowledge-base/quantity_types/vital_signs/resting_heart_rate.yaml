# --- RELATED TYPES ---
related_types:
  - identifier: "HKQuantityTypeIdentifierHeartRate"
    relationship: "Source data - RHR is derived from background heart rate samples"
  - identifier: "HKQuantityTypeIdentifierWalkingHeartRateAverage"
    relationship: "Complementary - Both provide context for cardiac function; walking HR minus RHR indicates chronotropic competence"
  - identifier: "HKQuantityTypeIdentifierHeartRateVariabilitySDNN"
    relationship: "Complementary - Both reflect autonomic nervous system function; often correlated (higher HRV = lower RHR)"
  - identifier: "HKQuantityTypeIdentifierVO2Max"
    relationship: "Correlated - Lower RHR generally associated with higher VO2max and better cardiorespiratory fitness"
  - identifier: "HKCategoryTypeIdentifierLowHeartRateEvent"
    relationship: "Related alert - May be triggered if RHR drops below user-defined threshold"
  - identifier: "HKCategoryTypeIdentifierSleepAnalysis"
    relationship: "Context - Sleep quality affects RHR; poor sleep often elevates next-day RHR"

