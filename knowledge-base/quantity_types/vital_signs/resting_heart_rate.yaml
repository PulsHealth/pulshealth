primary_source: Apple Watch
description: '## What does resting heart rate mean in Apple Health?


  Resting heart rate is an estimated heart rate during rest, in beats per minute. It differs from an ordinary [heart-rate
  sample](/knowledge-base/types/HKQuantityTypeIdentifierHeartRate/) taken while sitting: sitting just after exercise
  can still produce a high pulse. Apple estimates resting rate using sedentary readings across the day and may replace
  recent estimates as more information arrives. [Apple''s HealthKit documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/restingheartrate)
  describes this refinement.


  Apple''s [measurement technical paper](https://www.apple.com/health/pdf/Heart_Rate_Calorimetry_Activity_on_Apple_Watch_November_2024.pdf)
  describes selecting inactive waking periods, excluding sleep, and publishing a daily estimate. Another source
  may use a different method. A timestamp is not necessarily the moment the user took a resting-pulse test.


  ## Why can there be more than one record per day?


  The example year contained **532 records on 363 of 365 reporting days**. July–September contained **174 records
  across all 92 days**, with two source groups contributing records on 80 shared days. Source grouping uses source
  name and bundle identifier; it does not prove two simultaneously worn devices.


  Each source''s median positive start gap was about **24 hours**. Pooling both streams would make recording appear
  more frequent. Multiple rows can reflect source histories and estimate updates; the snapshot alone cannot establish
  every replacement relationship. Pick a consistent source or explicitly define how to combine sources rather than
  silently counting all rows as independent days.


  ## What ranges appeared in the example?


  | Window | Median | Recorded range |

  |---|---:|---:|

  | October 2025–September 2026 | 58 bpm | 46–66 bpm |

  | July–September 2026 | 58 bpm | 48–66 bpm |


  Both focus source groups had a median of 58 bpm. This is an observed distribution, not a target. Source/context
  IQR checks flagged ten full-year records for inspection; they were retained, and statistical flags did not diagnose
  illness or sensor failure. Compare unusual readings with neighboring days and the source history before deciding
  what they mean.


  ## Is resting heart rate the same as sleeping heart rate?


  No. [Sleeping heart-rate samples](/knowledge-base/types/HKQuantityTypeIdentifierHeartRate/) describe pulse during
  sleep; Apple''s resting estimate is built from waking rest. In the example, stored resting-rate intervals had
  a median duration of about **23.9 hours**. Those broad daily intervals overlapped sleep and workouts even though
  the value did not measure either activity throughout the interval.


  Consequently, sorting these rows into “during sleep” and “during workout” would be misleading. Use actual heart-rate
  samples matched to [sleep intervals](/knowledge-base/types/HKCategoryTypeIdentifierSleepAnalysis/) or workouts
  for that question. A daily resting estimate can still be compared with the preceding night''s sleep, provided
  the reporting date and source are explicit.


  ## How should I interpret changes?


  For most adults, the [American Heart Association](https://www.heart.org/en/healthy-living/exercise-and-physical-activity/fitness-basics/target-heart-rates)
  describes 60–100 bpm as a usual resting range; trained people and people taking some medications can be lower.
  This guidance is not a diagnostic cutoff for an exported daily estimate.


  Review a sustained change alongside illness, recovery, medication, sleep and wear patterns. Resting rate alone
  cannot diagnose overtraining, infection or an arrhythmia. New concerning symptoms such as fainting or chest pain
  deserve medical attention independently of the graph.


  ## Which other measurements add context?


  [HRV SDNN](/knowledge-base/types/HKQuantityTypeIdentifierHeartRateVariabilitySDNN/), [walking heart rate](/knowledge-base/types/HKQuantityTypeIdentifierWalkingHeartRateAverage/)
  and [VO2 max](/knowledge-base/types/HKQuantityTypeIdentifierVO2Max/) provide complementary information. The research
  compared same-source daily medians rather than mixing devices or treating dense raw pulse samples as equivalent
  daily estimates. Associations do not establish a cause or a recovery score.


  Keep this type discrete: average, minimum, maximum or most recent are meaningful summaries; adding daily bpm values
  is not. Preserve missing days and disclose the source/date selection behind rolling averages.

  '
