description: '## What is stored as body temperature?


  Body Temperature stores an absolute temperature measurement. The meaning depends on the measurement site and method:
  an oral, ear, underarm or other reading is not interchangeable. A compatible thermometer, third-party app or manual
  entry can supply records.


  Apple Watch sleeping wrist temperature is a **separate HealthKit type**. It measures wrist skin temperature, not
  ordinary body-temperature readings; it should not be mapped directly onto thermometer fever thresholds.


  ## What did the database research find?


  The selected database snapshot was checked across **365 reporting days, October 2025–September 2026**, with a
  July–September focus window. It contained **no raw Body Temperature records**. The research therefore cannot estimate
  observed value ranges, outliers, logging cadence, sleep or workout differences, or correlations for this type.
  A fabricated zero-valued series or a chart of another temperature type would misrepresent the evidence.


  | Research question | Available evidence |

  |---|---|

  | Recorded values and outliers | No raw measurements in the selected window |

  | Recording intervals and source changes | Not estimable |

  | Sleep and workout response | Not estimable |

  | Relationship to wrist temperature | Different types; no paired body-temperature observations |


  Absence in this window does not establish absence elsewhere, a normal temperature, lack of illness, or lack of
  a thermometer. Permissions, syncing, source choices and manual logging can all affect the available record.


  ## How should thermometer readings be compared?


  Keep the measurement site, device and timing consistent where possible. Compare records from the same source and
  method before combining them. Temperature varies over the day; exercise, environment, medications and illness
  can influence it. A source revision is provenance, not proof of a stable measurement site.


  Use individual readings and repeated comparable measurements rather than summing temperatures. A sample average
  should not be described as time spent with fever when measurements were intermittent.


  ## What is a fever threshold?


  The [NHS adult fever guide](https://www.nhs.uk/symptoms/fever-in-adults/) commonly uses **38°C or higher**, while
  emphasizing that symptoms matter. Measurement method, age and clinical circumstances affect assessment. [MedlinePlus](https://www.medlineplus.gov/ency/article/002341.htm)
  provides general adult vital-sign context; neither reference defines a universal Apple Health alert rule.


  Seek advice appropriate to the symptoms and clinical situation. Severe illness symptoms warrant prompt assessment
  even without a high reading. Do not use wrist skin temperature or a baseline deviation to confirm or rule out
  fever.


  ## How does this relate to other HealthKit types?


  Basal Body Temperature records a specific resting measurement used in cycle tracking. Sleeping Wrist Temperature
  records overnight wrist skin temperature. Heart rate and respiratory rate may change alongside illness, but correlations
  require overlapping, comparable observations and do not establish cause. No such body-temperature relationship
  could be measured in this snapshot.

  '
