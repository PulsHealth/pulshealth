# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierBodyTemperature"
source: "HealthKit"
type: "HKQuantityType"
category: "Vital Signs"
human_readable_name: "Body Temperature"
short_description: "A measurement of the body's internal temperature, a fundamental vital sign indicating metabolic and immune system status."

# --- APPLE HEALTH UI ---
icon: "thermometer"
color: "#FF3B30"

# --- UNITS & MEASUREMENT ---
default_unit: "degC"
supported_units:
  - "degC"
  - "degF"
  - "K"
unit_description: "Temperature is typically recorded in degrees Celsius (degC) or degrees Fahrenheit (degF). HealthKit also supports Kelvin (K) for scientific applications."

# --- STATISTICS ---
aggregation_type: "discrete"
statistics_options:
  - "discreteAverage"
  - "discreteMin"
  - "discreteMax"
  - "mostRecent"
  - "separateBySource"

# --- TYPICAL VALUES ---
typical_range:
  min: 35.5
  max: 37.5
  unit: "degC"
  notes: "Normal oral temperature range for healthy adults. Values vary by measurement site and individual baseline."

clinical_ranges:
  - population: "Adults (oral)"
    normal: "36.1-37.2 degC (97.0-99.0 degF)"
    low: "<35.0 degC (95.0 degF) - hypothermia"
    high: ">38.0 degC (100.4 degF) - fever"
  - population: "Adults (rectal)"
    normal: "36.6-37.8 degC (97.9-100.0 degF)"
    low: "<35.5 degC (95.9 degF)"
    high: ">38.5 degC (101.3 degF)"
  - population: "Adults (axillary)"
    normal: "35.5-37.0 degC (95.9-98.6 degF)"
    low: "<35.0 degC (95.0 degF)"
    high: ">37.5 degC (99.5 degF)"
  - population: "Adults (tympanic)"
    normal: "35.4-37.8 degC (95.7-100.0 degF)"
    low: "<35.0 degC (95.0 degF)"
    high: ">38.0 degC (100.4 degF)"
  - population: "Children (1-3 years, oral)"
    normal: "35.5-37.5 degC (95.9-99.5 degF)"
    low: "<36.1 degC (97.0 degF)"
    high: ">38.0 degC (100.4 degF)"
  - population: "Infants (rectal)"
    normal: "36.6-38.0 degC (97.9-100.4 degF)"
    low: "<36.1 degC (97.0 degF) - requires medical attention"
    high: ">38.0 degC (100.4 degF)"
  - population: "Elderly adults"
    normal: "35.8-36.9 degC (96.4-98.4 degF)"
    low: "<35.5 degC (95.9 degF)"
    high: ">37.5 degC (99.5 degF) - may indicate fever in this population"
    notes: "Elderly individuals typically have lower baseline temperatures and may not mount typical febrile responses to infection"

