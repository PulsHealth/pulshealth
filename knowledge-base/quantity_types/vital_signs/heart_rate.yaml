research_notes: Completed an executed, rerunnable private notebook against a full-year database snapshot. Standard
  facets were followed by motion-metadata provenance, neighboring extreme readings, within-episode cadence, workout-phase
  and sleep-stage comparisons, and exploratory related-type pairings. Public figures are source-selected aggregates;
  unsupported accuracy percentages and fixed recording schedules were removed. Primary references reviewed on 2026-10-14.
recording_behavior:
  reviewed_on: '2026-10-08'
  shape: A numeric heart-rate observation can be a point or an interval. The stored timestamp span is not the optical
    sensor sampling rate.
  cadence: Recording frequency depends on device model, software, settings, activity and measurement mode. Compare
    distributions within a source and context; do not assume one fixed background or workout schedule.
  context: Separate recorded workouts, recorded sleep and other periods using explicit timestamp rules. Motion context
    active (2) includes movement or working out; it does not identify a workout session by itself.
  coverage: A day containing readings is not evidence of continuous wear or uninterrupted monitoring. A gap alone
    does not reveal whether the device was off, unreadable, not worn or simply not recording.
  aggregation: A mean across records gives densely sampled periods more weight. State whether a summary is sample-weighted,
    time-weighted or computed by HealthKit; avoid treating these as interchangeable.
  metadata: 'HKMetadataKeyHeartRateMotionContext is a numeric enum: 0 not set, 1 sedentary, 2 active. Preserve unexpected
    representations as provenance; a known legacy serialization issue must not become a general boolean-to-number
    conversion rule.'
  references:
  - title: 'Apple: heart-rate measurement modes'
    url: https://support.apple.com/en-us/120277
  - title: 'Apple: heart-rate motion context'
    url: https://developer.apple.com/documentation/healthkit/hkmetadatakeyheartratemotioncontext
  - title: 'Apple: HealthKit sample time semantics'
    url: https://developer.apple.com/documentation/healthkit/samples
