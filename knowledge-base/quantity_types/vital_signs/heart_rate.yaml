figures:
- src: /knowledge-base/figures/heart-rate/context-ranges.svg
  alt: 'Source-selected heart-rate distributions: recorded sleep readings cluster lower than workout readings, with
    other or unknown readings spread between them.'
  title: Heart rate changes with recorded context
  caption: Actual records from one consenting person's stored Apple Health data. The selected source contributes
    257 sleep-overlap readings across only five days, 32,248 workout-overlap readings across 48 days and 23,002
    other readings across 92 days. These distributions are examples, not healthy target ranges.
  methods: 92-day focus, America/Los_Angeles reporting calendar. Largest heart-rate source group by bundle identifier
    and display name; versions combined. Five-bpm histogram bins normalized within each context. Half-open timestamp
    overlap with recorded workouts or asleep categories; dual overlap omitted. No dates, identifiers or source display
    names shown.
  section: What did real Apple Health records show?
  width: 864
  height: 442
- src: /knowledge-base/figures/heart-rate/context-cadence.svg
  alt: 'Cumulative positive timestamp-gap curves on a logarithmic seconds axis: selected-source workout gaps are
    usually a few seconds, while recorded-sleep gaps are usually several minutes.'
  title: Cadence is a distribution, not a fixed schedule
  caption: Actual observations from the same selected source and 92-day window. Workout and sleep gaps are measured
    within merged recorded episodes, excluding time between episodes. Other/unknown uses consecutive same-context
    records and can include intervening episodes. Sleep coverage is limited to five observed days.
  methods: Positive start-to-start timestamp gaps; zero gaps excluded and assessed separately in the notebook. Each
    context normalized to 100%; x-axis logarithmic seconds. Sources are not mixed. Recorded asleep categories 1,
    3, 4 and 5 merged for episode timing. Other/unknown is not a rest-only category. Stored cadence is not optical
    sensor sampling frequency.
  section: How often are heart-rate readings recorded?
  width: 864
  height: 442
