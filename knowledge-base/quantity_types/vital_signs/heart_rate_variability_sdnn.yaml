last_updated: '2026-10-14'
research_notes: Executed full-year and 92-day focus analysis before editorial revision. Public examples are example
  observations, not clinical norms. Apple structured documentation confirms SDNN units and automatic recording plus
  separate RMSSD availability; no universal cadence or UI display label is inferred. Replaced unsupported favorable/high
  thresholds and disease lists with contextual interpretation.
recording_behavior:
  reviewed_on: '2026-10-14'
  shape: Each value is an SDNN estimate in time units, not a sequence of individual beat intervals. Inspect the
    sample start/end span separately from its numeric SDNN value.
  cadence: Apple Watch records SDNN samples automatically. The type does not promise a universal interval between
    records; summarize actual start-to-start gaps by source and observation window.
  context: Compare like measurement contexts and durations. Joining an estimate to sleep or a workout requires a
    stated overlap or proximity rule, not an assumption based only on the type name.
  coverage: Report days with records, records per day and gaps separately. An empty period does not establish absent
    heart-rate variability or a physiological change.
  aggregation: Keep SDNN separate from RMSSD and from beat-level series. A daily average summarizes the available
    estimates; it does not reconstruct continuous or full-day HRV.
  metadata: Retain the algorithm-version metadata when present and compare versions separately before attributing
    a change to physiology. The presence of a version key does not describe the algorithm itself.
  references:
  - title: 'Apple: SDNN heart-rate variability'
    url: https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/heartratevariabilitysdnn
  - title: 'Apple: algorithm-version metadata'
    url: https://developer.apple.com/documentation/healthkit/hkmetadatakeyalgorithmversion
  - title: 'Apple: HealthKit sample time semantics'
    url: https://developer.apple.com/documentation/healthkit/samples
