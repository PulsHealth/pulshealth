primary_source: Apple Watch
description: '## What does Apple Watch HRV actually measure?


  Heart rate variability describes how much the time between heartbeats varies. **SDNN is the standard deviation
  of normal-to-normal intervals**, expressed in milliseconds. A 60 ms SDNN value is a measure of interval variation,
  not a heart rate of 60 beats per minute. Apple Watch automatically records discrete SDNN estimates; it does not
  give this type a universal sampling interval. [Apple’s SDNN documentation](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/heartratevariabilitysdnn)
  describes its units and calculation.


  SDNN also differs from **RMSSD**, which summarizes differences between successive intervals. HealthKit added a
  separate [RMSSD type](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/heartratevariabilityrmssd)
  in iOS and watchOS 27. Keep those series separate: there is no fixed conversion between them.


  ## What does a real SDNN record look like?


  In the 92-day example below, the data contained **1,236 records across all 92 days**, from two Apple Watch source
  groups. The stored sample span was typically about 59 seconds. Values ranged from 15.1 to 249.2 ms; the median
  was 52.2 ms and the middle 90% fell between 26.6 and 124.6 ms. These describe the available example estimates,
  **not a healthy range or targets for other people**.


  The scattered points tell a different story from the daily median. Several estimates on a day can be far apart,
  and a high point can sit beside much lower neighboring records. The example preserves extremes instead of deleting
  them as errors. Without the underlying beat intervals, a large value cannot establish unusually good recovery
  or an optical measurement artifact.


  ## How often is HRV recorded?


  This example had 11–16 estimates per day, with a median of 14. The pooled median start-to-start gap was about
  120 minutes, but individual gaps ranged from roughly 1.4 minutes to 5.9 hours. That is an observation about these
  sources and this window, **not an Apple Watch schedule guarantee**.


  Start-to-start spacing and the uncovered time after an estimate ends answer different questions. A one-minute
  sample followed by a two-hour start gap leaves almost two hours without a stored SDNN estimate. A daily average
  summarizes those short windows; it does not reconstruct continuous HRV or the SDNN of an entire day.


  | Question | Check in the records |

  | --- | --- |

  | Is the estimate comparable? | Same HRV metric, source and stored duration |

  | Is the day well covered? | Count of estimates, their times and uncovered gaps |

  | Did the source change? | Source group, software revision and algorithm metadata |

  | Is a point unusual? | Context, nearby estimates and source-specific distribution |


  ## How do sleep and workouts change the picture?


  In this example, **342 estimates overlapped recorded asleep intervals**, with a median of 69.3 ms. The 893 estimates
  outside recorded sleep and workouts had a median of 48.4 ms. “Other” means unclassified context; it does not establish
  that the person was awake, motionless or rested. These comparisons pool sources and different recording opportunities.


  Only **one estimate overlapped a workout**. This dataset cannot support an exercise-versus-rest value comparison
  or a workout HRV cadence estimate. An empty workout interval means no stored SDNN estimate was found there, not
  that variability became zero.


  For sleep cadence, the analysis required two estimates from the same source fully inside the same contiguous asleep
  interval. There were 42 qualifying pairs, with a median start gap of about 120 minutes. Gaps between different
  sleep episodes were kept separate. This avoids calling the daytime between two nights “sleep sampling cadence.”


  ## What can HRV tell you alongside other measurements?


  [Heart rate](/knowledge-base/types/HKQuantityTypeIdentifierHeartRate/) and [sleep records](/knowledge-base/types/HKCategoryTypeIdentifierSleepAnalysis/)
  help explain the context of an HRV trend. Align the time window and source before comparing them; a whole-day
  heart-rate median may mix dense workout readings with sparse resting readings.


  The research behind this example compared same-day medians, repeated comparisons within sleep context and source
  groups, and aligned daytime SDNN with asleep duration assigned to the waking day. The results depended on that
  alignment. They do not show that longer sleep caused higher HRV, or justify a recovery score from one measurement.
  No mindful-session or RMSSD records were available to test those relationships.


  ## Is there a normal Apple Watch HRV range?


  There is no single cutoff on this page that labels an Apple Watch SDNN estimate healthy or unhealthy. Recording
  length, breathing, posture, prevailing heart rate and processing choices affect interpretation. The [HRV measurement
  standards](https://www.escardio.org/static-file/Escardio/Guidelines/Scientific-Statements/guidelines-Heart-Rate-Variability-FT-1996.pdf)
  distinguish short recordings from longer recordings; **24-hour Holter risk thresholds should not be applied to
  these short Watch estimates**.


  Follow a consistent personal baseline using comparable recordings and display coverage beside the trend. The [2024
  measurement guidelines](https://pmc.ncbi.nlm.nih.gov/articles/PMC11539922/) explain why recording method and context
  constrain physiological conclusions. An unexpected sustained change can be discussed with a clinician, especially
  alongside symptoms; SDNN alone does not identify a disease or prescribe a training decision.

  '
metadata_keys:
- key: HKMetadataKeyAlgorithmVersion
  description: Algorithm-version metadata may be present under the stored HKAlgorithmVersion key. Keep it with the
    estimate; equal version values do not prove identical sensors or recording contexts.
related_types:
- identifier: HKQuantityTypeIdentifierHeartRate
  relationship: 'Context: compare aligned source/time windows; average beats per minute cannot reconstruct beat-to-beat
    SDNN.'
- identifier: HKQuantityTypeIdentifierHeartRateVariabilityRMSSD
  relationship: Distinct HRV metric introduced in iOS/watchOS27; do not pool or convert with a fixed multiplier.
- identifier: HKQuantityTypeIdentifierRestingHeartRate
  relationship: Complementary daily estimate; compare consistent recording opportunities and source history.
- identifier: HKCategoryTypeIdentifierSleepAnalysis
  relationship: 'Temporal context: join recorded asleep intervals explicitly and handle overlapping writers.'
- identifier: HKCategoryTypeIdentifierMindfulSession
  relationship: Potential recording context; cannot infer a mindful session from a dense HRV cluster alone.
- identifier: HKQuantityTypeIdentifierRespiratoryRate
  relationship: Breathing context; same-day association does not prove simultaneous measurements or causation.
