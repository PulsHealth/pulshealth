description: '## What is basal body temperature?


  Basal Body Temperature records body temperature **at rest**, such as immediately after waking. HealthKit treats
  it as a discrete temperature measurement. It is an absolute temperature, distinct from a change relative to a
  personal baseline. [Apple defines the type](https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifier/basalbodytemperature).


  ## What makes measurements comparable?


  [ACOG''s guidance](https://www.acog.org/womens-health/faqs/fertility-awareness-based-methods-of-family-planning)
  describes taking a waking measurement before activity, getting out of bed, eating or drinking. A consistent method
  is central to interpreting a pattern. A saved timestamp may be an entry time rather than the precise measurement
  time, so check how the logging app represents it.


  | Detail | Why it matters |

  | --- | --- |

  | Measurement method and site | Different methods need separate comparisons |

  | Waking timing | Later activity can change the measurement context |

  | Temperature scale | Convert Celsius/Fahrenheit before comparison |

  | Fever or disrupted routine | Can obscure an otherwise useful cycle pattern |

  | Missing morning | Unknown temperature, not a value to fill automatically |


  ## Can temperature identify ovulation?


  A sustained temperature rise can help describe a cycle retrospectively. ACOG explains that basal temperature shows
  ovulation after it has occurred rather than predicting it, and that temperature alone is not a good method to
  prevent or promote pregnancy. Do not turn a single high reading or a copied numeric cutoff into a definitive ovulation
  or pregnancy result.


  [Menstrual-flow dates](/knowledge-base/types/HKCategoryTypeIdentifierMenstrualFlow/) and [ovulation-test results](/knowledge-base/types/HKCategoryTypeIdentifierOvulationTestResult/)
  can add independent context when dates and coverage are reliable. Daily or cycle-level comparisons should retain
  gaps and distinguish source changes from physiological changes.


  ## Is Apple Watch wrist temperature the same measurement?


  No. [Sleeping wrist temperature](/knowledge-base/types/HKQuantityTypeIdentifierAppleSleepingWristTemperature/)
  has its own HealthKit identifier and recording behavior. Apple describes nightly wrist estimates and changes relative
  to a baseline, and says the feature is not an on-demand thermometer. Do not substitute wrist readings into a waking
  basal-temperature series simply because both use temperature units.


  ## How should unusual readings be reviewed?


  Inspect units, measurement site, source and waking context before treating a reading as an outlier. Sum is inappropriate
  for temperature. Repeated measurements taken by different methods should remain distinguishable, and an unusually
  high value by itself does not identify its cause.


  ## What did the coverage review find?


  The reviewed 365-day example-data window contained no samples, stored aggregates or workout-series points for
  this type. Value distributions, unusual readings, recording cadence and related-data comparisons could not be
  measured. No empirical figure is presented; missing database rows do not establish missing records on the phone.


  ## Does PulsHealth collect this type?


  The current PulsHealth sync catalog includes this type in degC. Database coverage and Apple Health availability
  are separate questions.

  '
