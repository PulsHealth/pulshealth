# ============================================
# HEALTHKIT DATA TYPE: BASAL BODY TEMPERATURE
# ============================================
# Clinical reference for health consultants and clinicians
# Last updated: 2026-01-27

# --- CORE IDENTIFICATION ---
identifier: "HKQuantityTypeIdentifierBasalBodyTemperature"
source: "HealthKit"
type: "HKQuantityType"
category: "Vital Signs"
human_readable_name: "Basal Body Temperature"
short_description: "The lowest body temperature attained during rest, typically measured immediately upon waking, used primarily for fertility awareness and ovulation tracking."

# --- APPLE HEALTH UI ---
icon: "thermometer"
color: "#FF2D55"

# --- UNITS & MEASUREMENT ---
default_unit: "degC"
supported_units:
  - "degC"
  - "degF"
  - "K"
unit_description: "Basal body temperature is recorded in degrees Celsius (degC) or degrees Fahrenheit (degF). Precision to 0.01 degrees is important for detecting the subtle temperature shifts associated with ovulation."

# --- STATISTICS ---
aggregation_type: "discrete"
statistics_options:
  - "discreteAverage"
  - "discreteMin"
  - "discreteMax"
  - "mostRecent"
  - "separateBySource"

# --- TYPICAL VALUES ---
typical_range:
  min: 35.5
  max: 37.3
  unit: "degC"
  notes: "BBT typically ranges from 36.1-36.4 degC (97.0-97.5 degF) in the follicular phase and rises to 36.4-37.0 degC (97.5-98.6 degF) in the luteal phase after ovulation."

clinical_ranges:
  - population: "Women - Follicular Phase (pre-ovulation)"
    normal: "36.1-36.4 degC (97.0-97.5 degF)"
    low: "<35.8 degC (96.4 degF)"
    high: ">36.5 degC (97.7 degF) - may indicate early ovulation or illness"
    notes: "Lower temperatures from menstruation until ovulation"
  - population: "Women - Luteal Phase (post-ovulation)"
    normal: "36.4-37.0 degC (97.5-98.6 degF)"
    low: "<36.3 degC (97.3 degF) - may indicate luteal phase defect"
    high: ">37.2 degC (99.0 degF) - may indicate pregnancy or illness"
    notes: "Sustained elevation of at least 0.2-0.5 degC above follicular phase baseline"
  - population: "Women - Biphasic Shift"
    normal: "0.2-0.5 degC (0.4-1.0 degF) rise post-ovulation"
    low: "<0.2 degC shift - may indicate anovulation"
    high: ">0.5 degC shift - normal variation"
    notes: "The temperature shift typically occurs 1-2 days after ovulation due to progesterone"
  - population: "Pregnancy (early)"
    normal: "Sustained elevation >36.5 degC (97.7 degF) for 18+ days"
    low: "Drop in temperature may indicate impending menstruation or early pregnancy loss"
    high: ">37.5 degC (99.5 degF) - evaluate for illness"
    notes: "Persistently elevated BBT beyond expected menstruation is an early pregnancy indicator"

