description: '## Overview

  Pregnancy test results in Apple Health record the qualitative outcome of a home urine test for human chorionic
  gonadotropin, or hCG. The saved value is a result category, not a laboratory hCG concentration or a measure of
  pregnancy progression.


  ## What are the possible results?

  | Code | Result | Interpretation of the saved record |

  | --- | --- | --- |

  | 1 | Negative | A negative result was recorded |

  | 2 | Positive | A positive result was recorded |

  | 3 | Indeterminate | An inconclusive result was recorded |


  The numbers identify categories. Their average has no clinical meaning, and code 3 is not a stronger result than
  code 2. A missing row is also different from a recorded negative test.


  ## Why can results differ over time?

  The FDA explains that testing too early can produce a negative result despite pregnancy, and following the particular
  test''s instructions affects accuracy. A saved category does not include all details needed to assess timing,
  sensitivity or technique. Consult the test instructions and a healthcare professional when results remain uncertain.


  Serial entries can show a sequence of recorded outcomes. They cannot quantify changing hCG, determine gestational
  age, assess viability or identify the location of a pregnancy. An apparent negative-to-positive transition is
  a change in saved results, not a measured rate of hormone increase.


  ## What does recording cadence tell you?

  Spacing reflects the tests and entries that were saved. Multiple results on a date may be separate tests or duplicate
  imports, so inspect provenance and matching intervals before counting. A period of missing entries does not mean
  that no testing occurred.


  A useful display would plot each category against recorded dates with visible gaps and source labels. It would
  retain indeterminate results rather than merging them into negatives, and avoid a continuous numeric line through
  category codes.


  ## What can related entries add?

  Menstrual-flow start markers may give a recorded timing reference. A pregnancy interval is separate contextual
  data and is not automatically created or confirmed by this result. Workout and sleep overlap identifies timing
  relative to other saved records, without demonstrating an effect on the test.


  ## What did the example data show?

  No pregnancy-test rows were present in the research window. Result frequencies, repeat-test cadence and transitions
  could not be measured. No measured figure or hCG range is presented.


  ## What remains unknown?

  Brand, sensitivity, sample technique and clinical confirmation are not defined by the category alone. There is
  no universal category cutoff in hCG units. Treat personal interpretation and follow-up as dependent on the actual
  test and clinical context rather than on this export''s numeric code.

  '
