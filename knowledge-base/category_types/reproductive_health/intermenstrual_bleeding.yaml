description: '## Overview


  Intermenstrual Bleeding records logged spotting outside menstruation. It documents an observation in a cycle history,
  with dates and source information. The category does not quantify blood loss or identify why bleeding occurred.


  ## What does code 0 mean?


  | Field | Meaning | Interpretation limit |

  | --- | --- | --- |

  | Code 0, notApplicable | Generic marker for a logged spotting record | No severity or negative-result category
  |

  | Start and end dates | The interval recorded by the source | Not necessarily continuous bleeding throughout that
  interval |

  | Source and revisions | Where the saved record came from | Repeated entries can describe the same observation
  |


  The marker name refers to the lack of a more specific category value. It does not mean spotting is absent. Likewise,
  a day without an entry is unknown unless a separate logging workflow documents completeness.


  ## How should repeated spotting be counted?


  Review distinct logged dates after checking duplicates, overlapping intervals and source revisions. Raw row counts
  can overstate the number of spotting days when several sources record the same observation. Start-to-start gaps
  describe logging cadence; they do not show symptom-free days or a reliable rate of bleeding.


  Menstrual Flow is a separate type for recorded period bleeding. Comparing their dates can reveal where the logs
  overlap, but the database alone cannot resolve an ambiguous choice between light flow and spotting. Corrections
  to the cycle history may change that interpretation.


  ## Is this the persistent-spotting notification?


  Persistent Intermenstrual Bleeding is a separate Cycle Deviation type. Apple processes entered cycle history,
  asks users to verify a potential deviation, and saves a corresponding deviation record after confirmation. An
  individual spotting entry is not that notification, and counting a few rows is not equivalent to reproducing Apple''s
  detection process.


  ## What other records help provide context?


  Contraceptive intervals, menstrual flow and sexual-activity entries can help organize questions about timing.
  Date alignment does not establish a contraceptive side effect, a cause of bleeding or an anatomical source. Spotting
  alone is not evidence of ovulation, implantation or pregnancy.


  ## What was available for this review?


  No records for this type were found in the selected database window, so logged-day patterns, interval lengths
  were unavailable. This type is not in the current PulsHealth sync catalog; database
  absence cannot establish its presence or absence in Apple Health on the phone. The review uses source documentation,
  with no measured recurrence chart.

  '
