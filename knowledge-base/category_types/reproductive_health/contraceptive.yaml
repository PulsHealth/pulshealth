description: |
  ## Overview
  Contraceptive tracking records the use of various birth control methods, providing context for cycle interpretation and reproductive health management. This data type captures both the type of contraceptive used and the timing of use, which is particularly important for methods requiring regular adherence (like daily oral contraceptives) versus long-acting methods (like IUDs or implants).

  Understanding contraceptive use is essential for interpreting other reproductive health data, as hormonal contraceptives significantly alter menstrual patterns, prevent ovulation, and change cervical mucus characteristics. This context helps clinicians and users accurately interpret cycle data and fertility indicators.

  ## Health Significance
  Contraceptive tracking serves multiple clinical purposes:
  - **Cycle interpretation**: Hormonal contraceptives alter natural cycle patterns; knowing the method used is essential for accurate data interpretation
  - **Adherence monitoring**: Daily methods (pills) require consistent use; tracking can identify missed doses
  - **Method counseling**: Historical contraceptive data informs discussions about method satisfaction and switching
  - **Side effect correlation**: Tracking enables correlation of symptoms with specific contraceptive methods
  - **Fertility planning**: When discontinuing contraception, historical use informs expectations for cycle normalization
  - **Medication interactions**: Contraceptive type affects interactions with other medications

  ## Clinical Interpretation Guidelines
  When reviewing contraceptive data:
  - **Method-specific effects on cycles**:
    - **Oral contraceptives**: Withdrawal bleeding during placebo week is not true menstruation; ovulation is typically suppressed
    - **IUD (hormonal)**: May cause lighter periods or amenorrhea; irregular spotting common initially
    - **IUD (copper)**: Periods may be heavier and longer; natural cycle and ovulation typically preserved
    - **Implant**: Irregular bleeding patterns common; many users experience amenorrhea
    - **Injection**: Menstrual irregularities common; amenorrhea increases with duration of use
    - **Ring/Patch**: Similar to oral contraceptives; withdrawal bleeding during hormone-free interval
  - **Transition periods**: After discontinuing hormonal contraception, expect 1-3 months for natural cycle restoration
  - **Adherence considerations**: Gaps in daily contraceptive logging may indicate missed doses and pregnancy risk
  - **Breakthrough bleeding**: Common in first 3 months of hormonal method initiation; persistent bleeding warrants evaluation
  - **Return to fertility**: Most methods allow rapid fertility return; injectable contraceptives may delay return by 6-12 months

  ## Caveats & Limitations
  - Does not include barrier methods (condoms, diaphragms) which are tracked via sexual activity protection metadata
  - Does not capture specific brand or dosage of hormonal methods
  - Pill tracking requires daily logging for meaningful adherence data
  - Long-acting methods (IUD, implant) only need initial logging but may not be consistently recorded
  - Does not distinguish between hormonal and copper IUDs, which have different cycle effects
  - Emergency contraception is not included as a category value
  - Fertility awareness-based methods are not captured in this type
  - Sterilization (tubal ligation, vasectomy) is not included
  - Does not capture when a method was started or discontinued, only daily use
