description: '## Overview


  Progesterone Test Result stores the qualitative result of a home progesterone test. Apple describes these as urine
  tests for PDG, a progesterone metabolite, used to assess whether ovulation has occurred. The HealthKit entry stores
  a result label rather than a hormone concentration.


  ## What do the three values mean?


  | Code | Result | What the category records |

  | --- | --- | --- |

  | 1 | Negative | The test returned a negative result |

  | 2 | Positive | The test returned a positive result |

  | 3 | Indeterminate | The test did not provide a conclusive result |


  These values are categories, not an increasing hormone scale. An average of codes cannot describe progesterone
  levels. A missing record is also different from a recorded negative test.


  ## Is this a serum progesterone measurement?


  No. The category does not contain ng/mL, a serum assay result, or a calibrated concentration of urinary PDG. Serum
  reference ranges therefore do not belong on this type''s chart. Test-specific instructions, assay information
  and testing time require their own evidence; they are not recoverable from positive or negative alone.


  A recorded positive result should remain a positive home-test result. It does not independently establish exact
  ovulation timing, luteal-phase quality, pregnancy viability or treatment response. A negative result likewise
  cannot diagnose anovulation or an inadequate luteal phase from this category alone.


  ## How should repeated tests be reviewed?


  Keep individual result labels with their dates and sources. Before counting tests, distinguish separate tests
  from repeated saves or revisions on the same day. Time between recorded results describes the logging schedule,
  not continuous hormone behavior. Without a record of testing opportunities, unlogged days cannot be filled with
  negative results.


  Ovulation Test Result records a separate home-test result, including LH or estrogen surge categories. Basal temperature
  and cervical-mucus observations can add separately recorded context. Their dates may align with progesterone results,
  but temporal alignment does not prove a HealthKit link or confirm a single ovulation episode.


  ## What was available for this review?


  No progesterone-test entries were found in the selected database window. Result frequencies, repeat-test timing
  and relationships could not be measured. This type is absent from the current PulsHealth sync catalog; database
  absence cannot establish whether results exist in Apple Health on the phone. The review is based on source documentation,
  with no invented hormone curve or concentration thresholds.

  '
