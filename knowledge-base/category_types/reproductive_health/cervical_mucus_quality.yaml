category_values:
  - value: 1
    name: "dry"
    description: "No noticeable cervical mucus; vaginal area feels dry. Typically indicates low fertility, occurring immediately after menstruation and before the next period."
  - value: 2
    name: "sticky"
    description: "Thick, tacky mucus that holds its shape when touched. Low to moderate fertility; sperm survival is limited in this environment."
  - value: 3
    name: "creamy"
    description: "Smooth, lotion-like mucus that is white or yellowish. Moderate fertility; indicates approaching ovulation but not peak fertility."
  - value: 4
    name: "watery"
    description: "Thin, clear, watery mucus that feels slippery. High fertility; often occurs 1-2 days before the most fertile period."
  - value: 5
    name: "eggWhite"
    description: "Clear, stretchy mucus resembling raw egg whites that can stretch between fingers. Peak fertility; optimal environment for sperm survival and transport, indicating ovulation is imminent or occurring."
