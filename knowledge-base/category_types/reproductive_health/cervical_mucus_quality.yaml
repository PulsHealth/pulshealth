description: '## Overview

  Cervical mucus quality in Apple Health records an observation such as dry, sticky or watery. It is a category
  selected when an observation is logged, rather than a sensor measurement or hormone concentration. Its useful
  detail comes from the sequence of observations and their timing.


  ## What do the five categories mean?

  | Code | Category | Recorded observation |

  | --- | --- | --- |

  | 1 | Dry | Little or no noticeable mucus |

  | 2 | Sticky | A sticky consistency |

  | 3 | Creamy | A creamy consistency |

  | 4 | Watery | A watery consistency |

  | 5 | Egg white | An egg-white-like appearance and consistency |


  Apple orders these descriptions from less to more fertile mucus characteristics. That ordering is not a calibrated
  fertility probability, a diagnosis or an equally spaced measurement scale. An average code of 3.4 has no useful
  physical unit.


  ## How often is it recorded?

  There is no automatic sampling schedule. Intervals between records describe observation and logging habits. Several
  observations on a day can provide detail; a gap can mean an observation was not made, not saved or not shared
  with the source being reviewed.


  A readable chart would place categories on separate rows against local calendar days, leave unrecorded days blank
  and distinguish sources. Connecting every point through a long gap would imply an observed change that the records
  cannot establish.


  ## What can other cycle data add?

  Menstrual flow can anchor recorded period starts, while ovulation-test results and basal temperature offer different
  kinds of context. Compare dates and completeness before assigning cycle phases. A same-day mucus observation and
  hormone-test result are separate entries, not an explicit HealthKit association or confirmation of egg release.


  Manual logging timestamps may be less precise than the observation itself.


  ## What did the example data show?

  The research window contained no cervical-mucus entries. Value frequencies, observation cadence, source differences
  and cycle-linked relationships therefore could not be measured. No empirical chart or normal range is inferred
  from that absence.


  ## What should you be careful about?

  These are subjective descriptions, and consistency of observation matters when reviewing a sequence. Missing entries
  are unknown, not dry observations. Apple says Cycle Tracking should not be used as birth control; a categorical
  timeline should not be converted into contraceptive advice.

  '
