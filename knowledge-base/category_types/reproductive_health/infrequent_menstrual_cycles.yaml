description: '## What does an infrequent-cycle record mean?


  Infrequent Menstrual Cycles is a saved Cycle Deviation assessment. It describes a pattern in logged period
  history, rather than a single late period or a manually entered symptom.


  Apple''s [HealthKit definition](https://developer.apple.com/documentation/healthkit/hkcategorytypeidentifier/infrequentmenstrualcycles)
  is one or two periods in the preceding six months. This is the definition for this Apple category, not a
  universal clinical cutoff for a long cycle. Apple saves a deviation sample after the user confirms that the
  flagged history is accurate.


  ## How is it different from menstrual flow?


  | Record | What it describes | What it cannot establish |

  | --- | --- | --- |

  | Menstrual Flow | A logged bleeding interval and flow category | Complete period counts without reviewing
  logging and cycle starts |

  | Infrequent Menstrual Cycles | A verified history pattern of infrequent periods | Hormone concentrations,
  ovulation or an underlying diagnosis |

  | Irregular Menstrual Cycles | Variation between cycle lengths | The same pattern as low period frequency
  |


  A flow row is not necessarily an entire period: multiple entries can describe changes during the same period.
  Counting those rows as separate periods creates an artificial frequency. Cycle-start metadata, duplicate
  entries and missing logging need review before reconstructing a history.


  ## What does the value and timing tell you?


  The category uses code **0, notApplicable**. That marker means no more specific value is defined. It does
  not mean that the deviation is absent, and it carries no severity or days-between-periods measurement.


  Start-to-start gaps between saved assessments are not menstrual-cycle lengths. The interval timestamps alone
  do not establish when a notification appeared or when history was confirmed. A saved assessment may overlap
  several nights and workouts without measuring a cycle change during each one.


  ## What did the example data show?


  No records for this category were available in the researched reporting year. A measured distribution, notification
  cadence and sleep or workout comparison could not be produced. Related bleeding history could not be paired
  with an absent primary category, so no chart or reconstructed cycle frequency is presented. An empty result
  cannot establish regular cycles or exclude a reproductive condition.


  ## What should you check before interpreting it?


  Review whether the period history is complete and correct. [Apple Support](https://support.apple.com/en-us/120356)
  explains that recent or ongoing logged cycle factors disable deviation detection. A missing assessment therefore
  does not prove that the history was evaluated. Share an accurate history with a healthcare professional when
  discussing a persistent change; this category cannot identify its cause.


  ## Is this type collected by PulsHealth?


  This identifier is documented here but is absent from PulsHealth’s current sync catalog. An empty database
  result cannot establish whether the phone contains this assessment.

  '
