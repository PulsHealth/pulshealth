description: '## What does persistent spotting mean in Apple Health?


  Persistent Intermenstrual Bleeding is a saved Cycle Deviation assessment of recurring spotting between periods.
  It is separate from an Intermenstrual Bleeding entry, which logs bleeding itself.


  Apple''s [HealthKit definition](https://developer.apple.com/documentation/healthkit/hkcategorytypeidentifier/persistentintermenstrualbleeding)
  is spotting in at least two cycles in the preceding six months. The cycles do not have to be described as
  consecutive in this definition. After potential deviation detection, HealthKit saves the assessment when
  the user confirms the logged history.


  ## Which record should you use for which question?


  | Question | Relevant evidence | Limit |

  | --- | --- | --- |

  | Was spotting logged on a date? | Intermenstrual Bleeding entries | A missing log is unknown |

  | Did a verified recurring pattern get saved? | Persistent Intermenstrual Bleeding category | The category
  does not list each bleeding day |

  | Was bleeding between periods? | Spotting history plus resolved period boundaries | Timing alone does not
  identify its cause |


  Several spotting entries within one cycle are not automatically several affected cycles. Review period boundaries,
  logging gaps and overlapping sources before counting cycles with spotting. Same-day sexual-activity records,
  if available, are descriptive context and do not prove postcoital bleeding or establish a cause.


  ## Does the value describe bleeding amount?


  Code **0, notApplicable** marks the saved assessment. It is not a flow amount, severity scale, negative result
  or numeric outlier. Neither its category value nor its interval duration measures blood loss.


  Spacing between assessment intervals is not spacing between spotting episodes. The exported timestamps do
  not independently establish notification or verification time. Episode timing requires the underlying logged bleeding observations.


  ## What did the example data show?


  This category had no records in the research window. Frequencies, interval durations, source revisions and
  saved assessment cadence could not be measured. Without primary records, associations with period boundaries,
  activity or related bleeding types were unavailable. No chart is presented, and the empty result does not
  establish an absence of spotting.


  ## What should be reviewed next?


  Check the accuracy of the underlying cycle history and share recurring unexpected bleeding with a healthcare
  professional. [Apple Support](https://support.apple.com/en-us/120356) states that detection is disabled with
  recent or ongoing logged cycle factors. A saved assessment prompts review; it does not diagnose infection,
  a structural cause or a hormonal condition, and should not be used to infer fertility.


  ## Is this type collected by PulsHealth?


  This identifier is documented here but is absent from PulsHealth’s current sync catalog. An empty database
  result cannot establish whether the phone contains this assessment.

  '
