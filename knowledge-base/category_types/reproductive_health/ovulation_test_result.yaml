description: '## Overview

  An ovulation test result in Apple Health is a saved qualitative result from a home test. It can distinguish a
  detected luteinizing-hormone surge from an estrogen surge, but it does not store a hormone concentration or prove
  that ovulation occurred.


  ## Which results can be saved?

  | Code | Result | What it records |

  | --- | --- | --- |

  | 1 | Negative | A negative test result |

  | 2 | Luteinizing hormone surge | A detected LH surge, often labeled positive or peak |

  | 3 | Indeterminate | An inconclusive result |

  | 4 | Estrogen surge | A detected estrogen surge, often labeled high |


  The deprecated positive constant is an alias for code 2, not a fifth distinct result. Device labels vary; record
  the meaning documented for the test instead of treating every “high” result as the same hormone signal. These
  category codes should never be averaged.


  ## Why can the spacing between results change?

  This is a testing and logging series, not automatic continuous monitoring. Testing may be concentrated into part
  of a cycle, repeated on a day or left unrecorded. A long gap describes the saved record, not the duration of a
  hormone surge. Follow the instructions for the particular test; the HealthKit category does not contain a universal
  testing schedule.


  A useful timeline would show separate result categories, distinguish sources and leave gaps visible. Counts of
  positive results require a denominator of recorded tests; they cannot establish a hormone concentration, an ovulation
  rate or the fraction of cycles with ovulation.


  ## What do menstrual flow and temperature add?

  Verified period-start markers can provide a recorded cycle-day reference. Basal temperature and cervical-mucus
  entries can offer additional observations, but missing days and differing timestamps limit alignment. Same-day
  results are descriptive neighbors, not a HealthKit linkage or independent confirmation of ovulation.


  Distinguish when a result was entered from when a test was taken if the source provides that detail.


  ## What did the example data show?

  No ovulation-test results were available in the research window. Result frequencies, repeated tests, inter-test
  cadence and relationships with period starts could not be measured; no example plot is supplied.


  ## What should not be inferred?

  A negative record does not prove that no surge occurred at another time, and a surge category does not prove egg
  release. No record means unknown. Do not derive pregnancy chances or a contraceptive window from these labels;
  Apple says Cycle Tracking should not be used as birth control.

  '
