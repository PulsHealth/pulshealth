description: '## Overview

  Pregnancy in Apple Health is recorded as a category interval. It adds pregnancy context to a health history; it
  is distinct from a home pregnancy-test result, a due date or a clinical record of gestational age.


  ## What does the category value represent?

  | Field | Meaning | Limit |

  | --- | --- | --- |

  | Code 0, notApplicable | The pregnancy category uses an undefined-value marker | It is not a severity, trimester
  or negative result |

  | Start and end dates | The interval the source records for pregnancy context | The dates do not independently
  establish conception, delivery or outcome |

  | Source and revisions | Provenance for the saved interval | Multiple or edited rows need reconciliation before
  counting episodes |


  The name notApplicable refers to the lack of a more specific category value. It does not mean the person is not
  pregnant. The presence of a record labels pregnancy context; absence of a record establishes nothing about pregnancy
  status.


  ## How should you read its cadence?

  An interval may span a long time and later be edited. That makes start-to-start gaps very different from a regularly
  sampled vital sign. Before counting pregnancies or days of pregnancy, inspect overlapping intervals, repeated
  content and source revisions. Add the union of resolved intervals rather than their durations when overlap exists.


  The exported interval alone is not a reliable clock for gestational weeks. Clinical dating, last menstrual period,
  due date and pregnancy outcome require their own evidence. Do not calculate a trimester from an arbitrary start
  date and present it as a documented clinical fact.


  ## How can it provide context for other measurements?

  Heart rate, body mass, sleep and activity can be compared within a recorded pregnancy interval when corresponding
  observations exist. Show source coverage and time trends rather than assuming a change is caused by pregnancy.

  A separate pregnancy-test entry can document a saved test result. Temporal proximity does not establish that it
  created this pregnancy interval or that both records describe the same episode.


  ## What did the example data show?

  There were no pregnancy-category records in the research window. Interval lengths, revisions, episode counts and
  pregnancy-context relationships were therefore unavailable. No gestational-age chart or outcome is inferred.


  ## Where are its boundaries?

  This category does not encode a diagnosis, ultrasound findings, singleton versus multiple pregnancy, complications
  or birth outcome. Apple lets users record pregnancy as a Cycle Tracking factor; source-specific updates still
  determine the saved history. An ended interval can reflect a correction or changed logging context and should
  not be labeled a delivery without supporting information.

  '
