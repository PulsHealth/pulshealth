description: '## Overview

  Bloating in Apple Health records a subjective symptom using severity labels. It is separate from waist circumference,
  body mass and any measurement of abdominal size or gas volume.


  ## What do its category values mean?

  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Subjectively mild severity |

  | 3 | moderate | Subjectively moderate severity |

  | 4 | severe | Subjectively severe severity |


  Unspecified is not the same as notPresent. Mild, moderate and severe are subjective labels; the integer codes
  are not a clinical measurement or a validated pain scale. These values come from Apple’s HKCategoryValueSeverity
  enumeration.


  ## Can the records reveal a food trigger?

  Meal timestamps can be placed alongside bloating observations when both histories are recorded. Compare logged
  days and source coverage before describing a pattern. Incomplete food logging, delayed symptom entry and
  overlapping meals can make a timeline misleading. A repeated coincidence is a question to investigate, not
  proof of intolerance.


  A severity category also does not tell you whether the abdomen visibly changed size. A waist measurement
  is a separate observation made under its own conditions; it should not be substituted for the perceived symptom.


  ## How should changing severity be displayed?

  A timeline with labeled categories is more faithful than a smooth numeric curve. Mild, moderate and severe
  are subjective ordered labels, not equally spaced measurements. Keep unspecified entries distinct from explicitly
  notPresent observations, and avoid translating their codes into a numeric bloating score.


  ## How should logged intervals be read?

  This is a logged observation, rather than a regularly sampled sensor reading. Start-to-start gaps describe
  the saved history and the source’s logging habits. An interval’s length describes what the source saved;
  it does not by itself establish the symptom’s continuous duration. Record start and end times, source changes
  and repeated or overlapping entries before interpreting a timeline.


  These intervals do not establish continuously measured symptoms or identify a cause. Numeric averages,
  physiological reference ranges and numeric outlier thresholds do not apply to the category codes.


  ## What did the example data show?

  This HealthKit category is not listed in the current PulsHealth sync catalog. No bloating records were found
  in the selected database research window; that coverage cannot establish whether corresponding entries exist
  in Apple Health. Category frequencies, source differences, logging cadence, interval patterns and relationships
  with other logged observations could not be measured. The absence of records does not establish the
  absence of the symptom. There is no measured figure or population estimate to infer from this coverage.

  '
