description: '## Overview

  Mood Changes in Apple Health is a symptom category indicating whether a change was reported. It uses presence
  labels, rather than the severity labels used by many other symptom categories.


  ## What do its category values mean?

  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | present | A change was reported |

  | 1 | notPresent | No change was reported for this observation |


  The two labels are categories, not a 0-to-1 symptom score. NotPresent is an explicit observation. A missing
  entry is unknown. These values come from Apple’s HKCategoryValuePresence enumeration.


  ## Does it describe a mood or a severity score?

  No. Present does not specify whether the change was positive or negative, which emotion was experienced or
  how intense it was. The category cannot be expanded into mild, moderate and severe levels. State of Mind
  is a separate HealthKit record with different semantics; its richer fields are not supplied by a Mood Changes
  entry.


  A presence record is also not a validated mental health assessment. Neither a single observation nor a pattern
  of binary observations establishes depression, anxiety or another diagnosis.


  ## How can mood-change observations be compared?

  Sleep Changes, recorded sleep, menstrual dates and other symptom logs can provide separately recorded context.
  Compare the days with actual observations and distinguish explicit notPresent from days with no record. Changes
  in willingness or opportunity to log can alter the history without a corresponding change in symptoms. Co-recording
  does not identify the cause of the reported change.


  ## How should logged intervals be read?

  This is a logged observation, rather than a regularly sampled sensor reading. Start-to-start gaps describe
  the saved history and the source’s logging habits. An interval’s length describes what the source saved;
  it does not by itself establish the symptom’s continuous duration. Record start and end times, source changes
  and repeated or overlapping entries before interpreting a timeline.


  These intervals do not establish continuously measured symptoms or identify a cause. Numeric averages,
  physiological reference ranges and numeric outlier thresholds do not apply to the category codes.


  ## What did the example data show?

  This HealthKit category is not listed in the current PulsHealth sync catalog. No mood changes records were
  found in the selected database research window; that coverage cannot establish whether corresponding entries
  exist in Apple Health. Category frequencies, source differences, logging cadence, interval patterns and relationships
  with other logged observations could not be measured. The absence of records does not establish the
  absence of the symptom. There is no measured figure or population estimate to infer from this coverage.

  '
