description: '## Overview


  Acne is a reported symptom in Apple Health. Each entry records a subjective severity category, rather than
  a lesion count or a dermatologist’s assessment.


  ## What do the saved values mean?


  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Subjectively mild severity |

  | 3 | moderate | Subjectively moderate severity |

  | 4 | severe | Subjectively severe severity |


  Unspecified is not notPresent. The mild, moderate and severe labels reflect the report; their integer codes
  are not a calibrated clinical scale and should not be averaged as measurements.


  ## What can a breakout history tell you?


  Keep the meaning of each severity label consistent when looking at a history. The category alone does not
  describe where a breakout appeared, which lesions were present or whether it left scars. Those details require
  a separate note or clinical assessment.


  A calendar of reports can help organize a conversation about recurring breakouts. If [Menstrual Flow](/knowledge-base/types/HKCategoryTypeIdentifierMenstrualFlow/)
  was also recorded, dates can be viewed together; coinciding reports do not identify a hormonal cause. A change
  in logging frequency can resemble a change in symptoms.


  ## How should a recorded history be read?


  Entries follow the source’s logging behavior, with no fixed sensor sampling interval. Missing dates mean
  no available report, rather than an explicit negative observation. A saved interval need not describe a continuous
  episode, and overlapping records from different sources should be reviewed before counting reports or days.


  ## Is this type available in PulsHealth?


  This HealthKit type is not listed in the current PulsHealth sync catalog. The selected database review contained
  no corresponding records; that does not establish whether entries exist in Apple Health. No example distribution
  or logging cadence could be measured.

  '
