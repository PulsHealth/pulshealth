description: '## Overview

  Abdominal cramps in Apple Health are a logged symptom with a subjective severity category. The record describes
  the reported experience; it does not measure abdominal muscle contractions or identify the source of pain.


  ## What do its category values mean?

  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Subjectively mild severity |

  | 3 | moderate | Subjectively moderate severity |

  | 4 | severe | Subjectively severe severity |


  Unspecified is not the same as notPresent. Mild, moderate and severe are subjective labels; the integer codes
  are not a clinical measurement or a validated pain scale. These values come from Apple’s HKCategoryValueSeverity
  enumeration.


  ## Can cramps be aligned with a menstrual cycle?

  Menstrual Flow can provide separately recorded dates to compare with cramps. Show which days have both observations
  and keep days without a cramps entry unknown. A gap between records is not a symptom-free interval, and a
  same-day match does not establish that menstruation caused the symptom.


  For meal-related questions, the same rule applies: a nutrition log gives meal context only when it is sufficiently
  complete and timed. The cramps category contains no food identity, pain location or clinical cause. These
  details need separate notes rather than being inferred from severity.


  ## What counts as an episode?

  A row may describe a moment or a source-defined interval. Multiple entries can reflect changes in severity,
  repeated logging or overlapping source records. Reconcile provenance and interval overlap before reporting
  episode counts; adding row durations can count the same time more than once.


  ## How should logged intervals be read?

  This is a logged observation, rather than a regularly sampled sensor reading. Start-to-start gaps describe
  the saved history and the source’s logging habits. An interval’s length describes what the source saved;
  it does not by itself establish the symptom’s continuous duration. Record start and end times, source changes
  and repeated or overlapping entries before interpreting a timeline.


  These intervals do not establish continuously measured symptoms or identify a cause. Numeric averages,
  physiological reference ranges and numeric outlier thresholds do not apply to the category codes.


  ## What did the example data show?

  This HealthKit category is not listed in the current PulsHealth sync catalog. No abdominal cramps records
  were found in the selected database research window; that coverage cannot establish whether corresponding
  entries exist in Apple Health. Category frequencies, source differences, logging cadence, interval patterns
  and relationships with other logged observations could not be measured. The absence of records does
  not establish the absence of the symptom. There is no measured figure or population estimate to infer from
  this coverage.

  '
