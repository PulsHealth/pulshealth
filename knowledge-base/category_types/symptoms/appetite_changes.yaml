description: '## Overview


  Appetite Changes records a reported change in the desire to eat. It describes direction relative to the user’s
  usual appetite, not food consumed, nutritional adequacy or a diagnosis.


  ## What do the saved values mean?


  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | unspecified | Direction was not specified |

  | 1 | noChange | Appetite was reported unchanged |

  | 2 | decreased | Appetite was reported decreased |

  | 3 | increased | Appetite was reported increased |


  Unspecified is not noChange. These labels describe direction, not a severity ranking: averaging their integer
  codes does not produce a meaningful appetite score.


  ## Is appetite the same as calorie intake or weight?


  No. A decreased-appetite entry does not say how much was eaten, and an increased-appetite entry does not
  establish a calorie surplus. [Dietary Energy Consumed](/knowledge-base/types/HKQuantityTypeIdentifierDietaryEnergyConsumed/)
  is a separate food log, while [Body Mass](/knowledge-base/types/HKQuantityTypeIdentifierBodyMass/) is a separately
  measured weight.


  Compare these histories only when each has adequate coverage. An empty food log is not zero intake. Weight
  is best considered over repeated comparable measurements, rather than matched to an isolated appetite report.
  [Nausea](/knowledge-base/types/HKCategoryTypeIdentifierNausea/) can be logged alongside appetite, but the
  category does not identify why appetite changed.


  ## How should a recorded history be read?


  Entries follow the source’s logging behavior, with no fixed sensor sampling interval. Missing dates mean
  no available report, rather than an explicit negative observation. A saved interval need not describe a continuous
  episode, and overlapping records from different sources should be reviewed before counting reports or days.


  ## Is this type available in PulsHealth?


  This HealthKit type is not listed in the current PulsHealth sync catalog. The selected database review contained
  no corresponding records; that does not establish whether entries exist in Apple Health. No example distribution
  or logging cadence could be measured.

  '
