description: '## Overview


  Runny Nose in Apple Health records a reported nasal symptom and its severity. The category does not measure
  nasal discharge volume or identify its cause.


  ## What do the saved values mean?


  | Code | Label | Interpretation |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Reported mild severity |

  | 3 | moderate | Reported moderate severity |

  | 4 | severe | Reported severe severity |


  Apple uses HKCategoryValueSeverity for this type. Unspecified is not the same as notPresent, and a missing
  record is neither. The integers identify labels; numerical averages and physiological reference ranges do
  not apply.


  ## How is runny nose different from congestion?


  [Sinus Congestion](/knowledge-base/types/HKCategoryTypeIdentifierSinusCongestion/) is a separate category. A user
  can log either or both, with independent severity labels. A runny-nose record should not be copied into the
  congestion history simply because the symptoms concern the same area.


  The label does not distinguish allergies from an infection, specify discharge characteristics or confirm
  that a symptom was continuous throughout the saved interval. Those details need additional observations or
  source notes.


  ## What can a recurring pattern tell you?


  A timeline can show when runny-nose observations were recorded and whether reported severity changed. Compare
  periods with similar logging habits before describing a recurring pattern. More entries may reflect more
  frequent logging rather than more severe symptoms.


  Separately saved [Coughing](/knowledge-base/types/HKCategoryTypeIdentifierCoughing/) or [Sore Throat](/knowledge-base/types/HKCategoryTypeIdentifierSoreThroat/)
  reports can add context. Co-recorded symptoms do not establish a diagnosis, shared cause or precise onset
  time.


  ## How should recording intervals be interpreted?


  This is a logged symptom, with no fixed sensor sampling schedule. Start-to-start gaps describe when observations
  were saved. A sample’s start and end times describe the interval supplied by its source; their difference
  does not establish the full duration of a clinical episode. Repeated or overlapping records need review before
  counting episodes.


  This category is not currently listed in the PulsHealth sync catalog. No observations were present in the
  reviewed user data, so recorded severity frequencies, source differences and logging intervals could not
  be measured. That database coverage does not establish whether entries exist in Apple Health.

  '
