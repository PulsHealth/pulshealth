description: '## Overview


  Dizziness records a reported symptom. Feeling lightheaded, off balance or as though the surroundings are spinning
  can all be described as dizziness, but the HealthKit severity label does not distinguish those experiences.


  ## What do the severity labels mean?


  | Code | Label | Interpretation |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not supplied |

  | 1 | notPresent | Explicitly reported absent |

  | 2 | mild | Reported mild severity |

  | 3 | moderate | Reported moderate severity |

  | 4 | severe | Reported severe severity |


  Apple uses HKCategoryValueSeverity for this type. These are subjective labels, not a calibrated clinical scale.
  Unspecified is not the same as notPresent, and an unrecorded day is unknown. Do not average the integer codes
  or interpret their spacing as equal changes in symptom intensity.


  ## What details are worth recording separately?


  A history is more useful when it distinguishes spinning from feeling faint or unsteady, and notes whether symptoms
  occurred after a change in position. The category itself does not contain posture, blood pressure, the suspected
  trigger or a diagnosis. A timestamp near a blood-pressure reading is only a time match; it does not establish
  that both were recorded in the same posture or during the same episode.


  Fainting is a separate HealthKit symptom category. Dizziness should not be silently converted into a fainting
  report or treated as a fall detected by a device.


  ## When should dizziness be checked?


  Seek medical advice when dizziness persists, recurs or comes with other symptoms such as changes in hearing or
  vision, weakness, fainting or changes in pulse. Avoid driving or other hazardous activities while dizzy. These
  NHS recommendations concern the symptoms themselves; a mild label in Apple Health is not a clinical assessment.


  ## What does recording frequency tell you?


  These are logged observations, not sensor samples on a fixed schedule. Compare explicit reported labels within
  a consistent logging routine and keep missing days separate from notPresent reports. Saved intervals and overlapping
  entries describe the source’s records; they do not establish continuous symptom duration or an exact number of
  episodes.


  ## Is this type available in PulsHealth data?


  This HealthKit type is not listed in the current PulsHealth sync catalog. No corresponding records were found
  in the selected database research window, so severity frequencies, logging intervals and relationships with other
  measurements could not be calculated. That database coverage does not establish whether the symptom was experienced
  or whether reports exist in Apple Health.

  '
