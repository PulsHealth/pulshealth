description: '## Overview


  Sore Throat in Apple Health records a reported symptom and its severity. It does not identify a pathogen,
  diagnose an infection or contain a throat-test result.


  ## What do the saved values mean?


  | Code | Label | Interpretation |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Reported mild severity |

  | 3 | moderate | Reported moderate severity |

  | 4 | severe | Reported severe severity |


  Apple uses HKCategoryValueSeverity for this type. Unspecified is not the same as notPresent, and a missing
  record is neither. The integers identify labels; numerical averages and physiological reference ranges do
  not apply.


  ## What does the severity label leave out?


  The category does not specify whether discomfort occurs while swallowing, speaking or at rest. A note about
  functional impact can add that context, while the saved value remains a subjective severity label. Neither
  mild nor severe establishes a particular cause or the need for antibiotics.


  [Runny Nose](/knowledge-base/types/HKCategoryTypeIdentifierRunnyNose/), [Coughing](/knowledge-base/types/HKCategoryTypeIdentifierCoughing/)
  and [Fever](/knowledge-base/types/HKCategoryTypeIdentifierFever/) are separate categories. Keeping their histories
  distinct helps avoid turning one symptom entry into an assumed cluster of symptoms.


  ## When is the history less important than getting help?


  Seek urgent medical help for a sore throat with difficulty breathing, inability to swallow, drooling or rapidly
  worsening severe symptoms, as described in NHS guidance. A mild saved label from an earlier observation does
  not establish that current symptoms are safe.


  For reviewing a history, distinguish first reported symptoms from the first saved record. Retrospective logging
  can place a record after the experience began, and the category itself does not capture test results or a
  diagnosis.


  ## How should recording intervals be interpreted?


  This is a logged symptom, with no fixed sensor sampling schedule. Start-to-start gaps describe when observations
  were saved. A sample’s start and end times describe the interval supplied by its source; their difference
  does not establish the full duration of a clinical episode. Repeated or overlapping records need review before
  counting episodes.


  This category is not currently listed in the PulsHealth sync catalog. No observations were present in the
  reviewed user data, so recorded severity frequencies, source differences and logging intervals could not
  be measured. That database coverage does not establish whether entries exist in Apple Health.

  '
