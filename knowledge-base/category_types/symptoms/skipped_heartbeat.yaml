description: '## Overview


  Skipped Heartbeat records the reported sensation of a missed or interrupted beat. The category describes an experience;
  it does not count missed beats or confirm an abnormal electrical rhythm.


  ## What do the severity labels mean?


  | Code | Label | Interpretation |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not supplied |

  | 1 | notPresent | Explicitly reported absent |

  | 2 | mild | Reported mild severity |

  | 3 | moderate | Reported moderate severity |

  | 4 | severe | Reported severe severity |


  Apple uses HKCategoryValueSeverity for this type. These are subjective labels, not a calibrated clinical scale.
  Unspecified is not the same as notPresent, and an unrecorded day is unknown. Do not average the integer codes
  or interpret their spacing as equal changes in symptom intensity.


  ## Does a report prove that the heart skipped a beat?


  No. The severity code does not identify a rhythm mechanism or an ECG finding. Heart Rate, an ECG recording and
  an irregular-rhythm notification are separate forms of information. Their presence near a symptom entry can add
  context, but their timestamps do not establish that they captured the same event.


  Rapid, Pounding, or Fluttering Heartbeat is another subjective symptom category. A source may record both for
  one experience. Retain the distinct labels and inspect timing and source behavior before counting them as separate
  episodes.


  ## What details make a report more useful?


  Separately recorded onset, recurrence, duration and accompanying symptoms describe more than a severity label
  alone. Start and end times are the interval saved by the source, not a count of interrupted beats or proof that
  the sensation lasted continuously throughout it. Longer gaps between entries may reflect less logging rather than
  fewer symptoms.


  ## When should a skipped-beat sensation be checked?


  Follow the same symptom-based advice used for other palpitations: seek medical advice for recurring or increasingly
  frequent episodes. Call local emergency services for ongoing palpitations that do not settle, or palpitations
  accompanied by chest pain, breathlessness or feeling faint. The severity label and the absence of a watch notification
  cannot rule out a problem.


  ## What does recording frequency tell you?


  These are logged observations, not sensor samples on a fixed schedule. Compare explicit reported labels within
  a consistent logging routine and keep missing days separate from notPresent reports. Saved intervals and overlapping
  entries describe the source’s records; they do not establish continuous symptom duration or an exact number of
  episodes.


  ## Is this type available in PulsHealth data?


  This HealthKit type is not listed in the current PulsHealth sync catalog. No corresponding records were found
  in the selected database research window, so severity frequencies, logging intervals and relationships with other
  measurements could not be calculated. That database coverage does not establish whether the symptom was experienced
  or whether reports exist in Apple Health.

  '
