description: '## Overview

  Hot flashes in Apple Health are logged symptoms graded by subjective severity. This category is distinct
  from a measured temperature, a fever record or a count produced by continuous monitoring.


  ## What do its category values mean?

  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Subjectively mild severity |

  | 3 | moderate | Subjectively moderate severity |

  | 4 | severe | Subjectively severe severity |


  Unspecified is not the same as notPresent. Mild, moderate and severe are subjective labels; the integer codes
  are not a clinical measurement or a validated pain scale. These values come from Apple’s HKCategoryValueSeverity
  enumeration.


  ## Can temperature or sleep provide additional context?

  A recorded hot-flash interval can be compared with separately recorded sleep and temperature observations,
  with each source identified. Sleeping wrist temperature is measured in its own setting and is not a measurement
  of hot-flash intensity. Time overlap alone cannot establish that a flash caused awakening or a temperature
  change.


  Night Sweats is another symptom category, not an interchangeable label. Keep the reports separate when both
  exist and describe their co-recording rather than collapsing them into a single episode count.


  ## Can severity entries count hot flashes?

  Severity describes the reported symptom, not the number of flashes. An entry can summarize a period or represent
  a particular observation depending on its source. Without the source’s episode definitions, row counts and
  interval duration do not establish frequency, clinical burden or hormonal status.


  ## What does recording cadence tell you?

  This is a logged observation, rather than a regularly sampled sensor reading. Start-to-start gaps describe
  the saved history and the source’s logging habits. An interval’s length describes what the source saved;
  it does not by itself establish the symptom’s continuous duration. Record start and end times, source changes
  and repeated or overlapping entries before interpreting a timeline.


  A record overlapping a workout or a sleep interval supplies time context. It is not evidence that the symptom
  was continuously measured during that activity, and it does not identify onset or a cause. Numeric averages,
  physiological reference ranges and numeric outlier thresholds do not apply to the category codes.


  ## What did the example data show?

  This HealthKit category is not listed in the current PulsHealth sync catalog. No hot flashes records were
  found in the selected database research window; that coverage cannot establish whether corresponding entries
  exist in Apple Health. Category frequencies, source differences, logging cadence, interval patterns and relationships
  with sleep, workouts or other types could not be measured. The absence of records does not establish the
  absence of the symptom. There is no measured figure or population estimate to infer from this coverage.

  '
