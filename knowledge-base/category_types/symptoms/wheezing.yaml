description: '## Overview


  Wheezing in Apple Health records a reported breathing symptom and its severity. It is not an acoustic recording,
  an airflow measurement or an automatic asthma diagnosis.


  ## What do the saved values mean?


  | Code | Label | Interpretation |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Reported mild severity |

  | 3 | moderate | Reported moderate severity |

  | 4 | severe | Reported severe severity |


  Apple uses HKCategoryValueSeverity for this type. Unspecified is not the same as notPresent, and a missing
  record is neither. The integers identify labels; numerical averages and physiological reference ranges do
  not apply.


  ## How does wheezing relate to breathing measurements?


  [Peak Expiratory Flow Rate](/knowledge-base/types/HKQuantityTypeIdentifierPeakExpiratoryFlowRate/) and [Forced
  Expiratory Volume (FEV1)](/knowledge-base/types/HKQuantityTypeIdentifierForcedExpiratoryVolume1/) are separate
  measurements. Their values cannot be inferred from mild, moderate or severe wheezing labels. [Inhaler Usage](/knowledge-base/types/HKQuantityTypeIdentifierInhalerUsage/)
  is also a separate record and does not by itself show why an inhaler was used.


  These histories can support a discussion with a clinician when both have been recorded. They should retain
  their own times, sources and units rather than being collapsed into a symptom score.


  ## Is timing around activity or night-time symptoms useful?


  It can be, when the user actually reports that context. NHS asthma guidance describes symptoms that may be
  triggered by exercise or occur at night; wheezing alone still does not establish asthma. A note saying wheezing
  began during a run or woke the user gives more specific context than a record that merely overlaps a workout
  or sleep interval.


  A saved category sample is not continuous respiratory monitoring. For severe wheezing or substantial breathing
  difficulty, seek urgent medical help. Use an existing clinician-provided action plan where applicable; the
  category code cannot determine an inhaler dose.


  ## How should recording intervals be interpreted?


  This is a logged symptom, with no fixed sensor sampling schedule. Start-to-start gaps describe when observations
  were saved. A sample’s start and end times describe the interval supplied by its source; their difference
  does not establish the full duration of a clinical episode. Repeated or overlapping records need review before
  counting episodes.


  This category is not currently listed in the PulsHealth sync catalog. No observations were present in the
  reviewed user data, so recorded severity frequencies, source differences and logging intervals could not
  be measured. That database coverage does not establish whether entries exist in Apple Health.

  '
