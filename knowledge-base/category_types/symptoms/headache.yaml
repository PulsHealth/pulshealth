description: '## Overview

  Headache in Apple Health records a reported symptom and its subjective severity. The category does not classify
  a headache as migraine, tension-type or another diagnosis.


  ## What do its category values mean?

  | Code | Label | Meaning |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Subjectively mild severity |

  | 3 | moderate | Subjectively moderate severity |

  | 4 | severe | Subjectively severe severity |


  Unspecified is not the same as notPresent. Mild, moderate and severe are subjective labels; the integer codes
  are not a clinical measurement or a validated pain scale. These values come from Apple’s HKCategoryValueSeverity
  enumeration.


  ## Does one record equal one headache attack?

  No. A source can store a moment, an interval or several observations during the same episode. Duplicate imports,
  overlapping intervals and changes in severity can all increase the row count. Counting attacks requires an
  explicit episode rule and source context beyond the category code.


  The code also lacks location, aura, associated symptoms and medication use. Preserve those as separate documented
  details when available. They cannot be reconstructed from mild, moderate or severe labels.


  ## How can a headache diary add context?

  Logged sleep, meals, activity and menstrual dates can be placed next to headache observations when coverage
  exists. State whether alignment uses start dates, reported onset or interval overlap. Retrospective reporting
  and missed entries limit comparisons; a matching day is not a demonstrated trigger. This is a diary structure,
  not a diagnostic test.


  ## What does recording cadence tell you?

  This is a logged observation, rather than a regularly sampled sensor reading. Start-to-start gaps describe
  the saved history and the source’s logging habits. An interval’s length describes what the source saved;
  it does not by itself establish the symptom’s continuous duration. Record start and end times, source changes
  and repeated or overlapping entries before interpreting a timeline.


  A record overlapping a workout or a sleep interval supplies time context. It is not evidence that the symptom
  was continuously measured during that activity, and it does not identify onset or a cause. Numeric averages,
  physiological reference ranges and numeric outlier thresholds do not apply to the category codes.


  ## What did the example data show?

  This HealthKit category is not listed in the current PulsHealth sync catalog. No headache records were found
  in the selected database research window; that coverage cannot establish whether corresponding entries exist
  in Apple Health. Category frequencies, source differences, logging cadence, interval patterns and relationships
  with sleep, workouts or other types could not be measured. The absence of records does not establish the
  absence of the symptom. There is no measured figure or population estimate to infer from this coverage.

  '
