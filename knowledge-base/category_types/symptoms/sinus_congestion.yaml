description: '## Overview


  Sinus Congestion in Apple Health stores a reported symptom with a severity label. It is not a measurement
  of airflow, sinus pressure or the extent of an infection.


  ## What do the saved values mean?


  | Code | Label | Interpretation |

  | --- | --- | --- |

  | 0 | unspecified | Severity was not specified |

  | 1 | notPresent | Symptom was explicitly reported absent |

  | 2 | mild | Reported mild severity |

  | 3 | moderate | Reported moderate severity |

  | 4 | severe | Reported severe severity |


  Apple uses HKCategoryValueSeverity for this type. Unspecified is not the same as notPresent, and a missing
  record is neither. The integers identify labels; numerical averages and physiological reference ranges do
  not apply.


  ## Does congestion establish sinusitis?


  No. The category records a symptom rather than a diagnosis. Its labels do not identify an infection, document
  imaging findings or specify which sinus is affected. Notes about the sensation and its effect on daily activities
  can make the history more informative without changing the category value.


  [Runny Nose](/knowledge-base/types/HKCategoryTypeIdentifierRunnyNose/) and [Headache](/knowledge-base/types/HKCategoryTypeIdentifierHeadache/)
  are separate reports. Preserve them independently instead of using one category as a substitute for the others.


  ## How should changing severity be read?


  A move from mild to moderate is a change in the reported label, not a calibrated change in pressure or airflow.
  Compare like sources and show the recorded labels directly. Averaging the codes hides the difference between
  unspecified severity, explicitly absent symptoms and reported symptoms.


  A gap in the history gives no information about congestion. An explicit notPresent observation provides a
  different kind of evidence from an unlogged day.


  ## How should recording intervals be interpreted?


  This is a logged symptom, with no fixed sensor sampling schedule. Start-to-start gaps describe when observations
  were saved. A sample’s start and end times describe the interval supplied by its source; their difference
  does not establish the full duration of a clinical episode. Repeated or overlapping records need review before
  counting episodes.


  This category is not currently listed in the PulsHealth sync catalog. No observations were present in the
  reviewed user data, so recorded severity frequencies, source differences and logging intervals could not
  be measured. That database coverage does not establish whether entries exist in Apple Health.

  '
