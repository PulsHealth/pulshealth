description: '## Overview


  Toothbrushing records a saved brushing event. Its timestamps can describe the session''s timing and elapsed
  duration, making the history useful for reviewing logged habits. The record does not measure plaque removal
  or prove that brushing technique was effective.


  ## What does the category value mean?


  | Field | Meaning |

  | --- | --- |

  | Category value 0 | notApplicable; the event has no graded category |

  | Start and end dates | The recorded session interval |

  | No event | No saved observation; brushing may still have occurred |


  The zero category value does not mean that no brushing occurred. Do not average the codes or add them to
  count sessions. Use the event records and their intervals, keeping source information available for checking
  duplicates.


  ## Does Apple Watch automatically track brushing?


  The HealthKit identifier provides a way for authorized apps to read and write events. It does not by itself
  establish a built-in Apple Watch brushing detector or guarantee that a particular connected toothbrush writes
  to Apple Health. Check the source app''s actual behavior before assuming automatic coverage.


  Manual logs and device-connected logs can have different timestamp precision and different reasons for missing
  sessions. A new source may change the visible daily count even when the underlying habit has not changed.


  ## What makes a useful brushing history?


  Show recorded sessions per day alongside elapsed duration and source coverage. Check duplicate or overlapping
  imports before counting them as separate sessions. Keep long gaps visible; they may represent unlogged brushing
  or an interrupted connection rather than a change in behavior.


  The American Dental Association recommends brushing twice daily with a soft-bristled brush and fluoride toothpaste.
  That advice describes a care routine, not a clinical reference range for the number of saved records. A complete-looking
  timeline still does not verify that all tooth surfaces were cleaned.


  ## What cannot be inferred from duration?


  Elapsed time does not reveal pressure, coverage, toothpaste use or interdental cleaning. Avoid classifying
  a session as effective solely because its interval exceeds a threshold. Source-specific feedback can add
  detail when explicitly available, but it should remain separate from the basic HealthKit event.


  ## What data was available for this example?


  No toothbrushing records were found in the selected database window. This type is listed in the current PulsHealth
  sync catalog. Database coverage does not establish whether corresponding entries exist in Apple Health. No
  measured ranges, recording intervals or source comparisons are available from this example.

  '
