description: '## Overview


  Handwashing records an event with start and end dates. Apple Watch can automatically record detected handwashing,
  and an authorized app can also save events. The history shows recorded sessions; it cannot certify every
  instance of hand hygiene.


  ## Does category zero mean a failed wash?


  | Field | Meaning |

  | --- | --- |

  | Category value 0 | notApplicable, the valid label for a recorded event |

  | Start and end dates | Define the recorded duration |

  | No sample | No saved observation, rather than a zero-duration event |


  Zero is not a failure score, an absence label or a count. Counting event records can describe recorded sessions;
  averaging their category codes produces no useful hygiene measure. HealthKit uses the duration when determining
  whether a handwashing event completed.


  ## How should duration be interpreted?


  Calculate elapsed time from the saved interval and distinguish very short, overlapping or repeated records.
  The source''s interval does not verify how thoroughly hands were cleaned, whether soap was used or whether
  all surfaces were scrubbed.


  CDC recommends scrubbing hands for at least 20 seconds in community settings. That is guidance for the scrubbing
  step, not a universal normal range for an entire saved event. A timer or logged interval alone cannot confirm
  that the recommendation was followed correctly.


  ## Is there a useful target for events per day?


  A fixed daily count can be misleading because the need to wash depends on activities. CDC identifies moments
  such as food preparation, eating and using the toilet. The record does not contain a complete list of those
  opportunities, so events per day should not be presented as a compliance percentage.


  ## What can recording patterns reveal?


  A timeline can show when events were logged, their recorded durations and whether a source stopped contributing.
  Separate automatic detections from app-entered sessions when the source information permits it. A day with
  no saved events does not establish that no handwashing occurred. Compare histories only when their recording
  coverage is sufficiently similar.


  ## What data was available for this example?


  No handwashing records were found in the selected database window. This type is listed in the current PulsHealth
  sync catalog. Database coverage does not establish whether corresponding entries exist in Apple Health. No
  measured ranges, recording intervals or source comparisons are available from this example.

  '
