category_values:
  - value: 0
    name: "inBed"
    description: "User is in bed but sleep state is undetermined. Represents the total time from getting into bed to getting out, regardless of actual sleep."
  - value: 1
    name: "asleepUnspecified"
    description: "User is asleep but the specific sleep stage cannot be determined. Used when device lacks sleep staging capability or data is insufficient for classification."
  - value: 2
    name: "awake"
    description: "User is awake during a sleep session. Captures periods of wakefulness after initially falling asleep (WASO - Wake After Sleep Onset)."
  - value: 3
    name: "asleepCore"
    description: "User is in core (light) sleep, also known as N1 and N2 NREM sleep stages. Characterized by reduced muscle activity, slower eye movements, and sleep spindles."
  - value: 4
    name: "asleepDeep"
    description: "User is in deep sleep (N3 NREM/slow-wave sleep). Most restorative stage characterized by delta brain waves, growth hormone release, and physical recovery."
  - value: 5
    name: "asleepREM"
    description: "User is in REM (Rapid Eye Movement) sleep. Associated with vivid dreaming, memory consolidation, emotional processing, and temporary muscle paralysis."
