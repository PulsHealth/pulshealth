description: '## What is Headphone Audio Exposure Event?

  Headphone Audio Exposure Event records a notification concerning accumulated headphone exposure. [Apple’s type
  documentation](https://developer.apple.com/documentation/healthkit/hkcategorytypeidentifier/headphoneaudioexposureevent)
  identifies this notification stream, separate from the numeric [Headphone Audio Exposure](/knowledge-base/types/HKQuantityTypeIdentifierHeadphoneAudioExposure/)
  measurements.


  The named category is `sevenDayLimit`, numeric code **1**. [Apple’s value documentation](https://developer.apple.com/documentation/healthkit/hkcategoryvalueheadphoneaudioexposureevent)
  defines the seven-day exposure event. A category code is not a sound level, percentage of hearing loss or count
  of listening hours.


  ## What did the checked data contain?

  The bounded reporting year contained **no records of this event type**, even though it contained **2,906 headphone
  audio-level records**. The notebook preserves that distinction: the event stream is absent, while a related quantity
  stream is available.


  | Analysis question | What can be concluded here? |

  | --- | --- |

  | Value range or outliers | Not applicable to a named event code; no observed codes |

  | Cadence between events | Unavailable without event records |

  | Workout or sleep differences | No event-based comparison available |

  | Was listening always safe? | Cannot be established from absent alerts |

  | Were notifications disabled? | Configuration history is not stored in these rows |


  No event figure or numerical event rate is shown because the required observations do not exist. Empty days are
  not manufactured as zero exposure.


  ## What is the seven-day window?

  [Apple’s notification guidance](https://support.apple.com/en-us/108968) describes the recommended seven-day exposure
  budget, including the example of 80 dB for 40 hours. Loudness and listening duration both contribute. Notification
  availability and the ability to disable notifications can vary by region.


  The Reduce Loud Audio setting is a separate control for lowering playback above a chosen level; it should not
  be confused with the accumulated exposure notification. This event is not a universal fixed-volume alarm for each
  loud track.


  ## Could the numeric records recreate the notification?

  Only with sufficient aligned source and interval coverage, a verified exposure algorithm and appropriate handling
  of overlaps. The available raw streams contain source differences and overlapping intervals, so this investigation
  does not claim to reproduce the Health app’s budget or infer that a notification should have occurred.


  Decibels are logarithmic. Averaging sample levels arithmetically, summing dB values or counting loud records is
  not a reliable exposure calculation. Sound-level intervals with very different durations also need different weights.
  The separate numeric entry illustrates these coverage and weighting issues with real observations.


  ## How does this relate to environmental alerts and sound reduction?

  [Audio Exposure Event](/knowledge-base/types/HKCategoryTypeIdentifierAudioExposureEvent/) is a legacy environmental-noise
  category with a different meaning. [Environmental Sound Reduction](/knowledge-base/types/HKQuantityTypeIdentifierEnvironmentalSoundReduction/)
  estimates attenuation; its presence does not establish an appropriate protection setting or prove that playback
  exposure stayed within the notification budget.


  When actual events are available, inspect the associated audio level and duration metadata, source and nearby
  numeric observations. Workout or sleep overlap provides timing context, not a diagnosis or an explanation of why
  a notification occurred. An event interval is not interchangeable with seven days of continuously observed listening.'
