description: '## What does a High Heart Rate Event mean?

  A High Heart Rate Event records an Apple Watch notification, rather than an individual pulse reading. Its category
  value is **0 (`notApplicable`)**: zero is the event code, not a heart rate of zero. The configured threshold is
  separate metadata. [Apple''s HealthKit documentation](https://developer.apple.com/documentation/healthkit/hkcategorytypeidentifier/highheartrateevent)
  describes these samples as read-only notification records.


  ## When does Apple Watch record it?

  The watch can notify you when heart rate stays above your chosen threshold after at least ten minutes of apparent
  inactivity. The threshold is a notification setting, not a universal boundary between healthy and unhealthy readings.
  You can review it in the Heart settings on the watch or in the Watch app on iPhone. See [Apple''s notification
  guide](https://support.apple.com/guide/watch/monitor-your-heart-health-apde39f5426c/watchos).


  An elevated reading in an exercise session is therefore different from a high-rate event. Event intervals also
  should not be treated as a validated measurement of how long tachycardia lasted. For actual beats per minute,
  inspect [Heart Rate](../HKQuantityTypeIdentifierHeartRate/) samples nearby.


  ## How should recording frequency be interpreted?

  | What you see | What it tells you |

  |---|---|

  | A saved event | A notification was recorded under the feature''s conditions |

  | Threshold metadata | The setting used for that event, when available |

  | Time between events | Time between saved notifications, not continuous sensor cadence |

  | No events | No saved notifications; monitoring coverage and clinical status remain unknown |


  The October 2025–September 2026 database window contained no high-rate events. Value distributions, notification
  intervals, workout/sleep comparisons and event-linked relationships were consequently unavailable. A zero-event
  chart would add no useful measurement evidence. Ordinary heart-rate samples were present, but cannot reconstruct
  notification enablement or all detection opportunities.


  ## What limits comparisons between notification counts?

  High heart rates during activity do not automatically satisfy this inactivity-based feature''s conditions. During
  sleep, compare the event time with actual recorded sleep intervals; clock time alone cannot establish that you
  were asleep. These comparisons describe overlap, rather than the reason for a notification.


  An event count needs a denominator to become a rate. Watch wear, eligibility, settings and detection attempts
  are not supplied by category events. Even a long stretch without alerts cannot establish continuous normal heart
  rate.


  ## What is useful to review alongside an event?

  Nearby raw pulse readings, [Resting Heart Rate](../HKQuantityTypeIdentifierRestingHeartRate/) trends, symptoms
  and an available ECG can provide different pieces of context. A high-rate notification does not determine the
  rhythm or its cause. Simultaneous high/low or irregular notifications also do not diagnose a particular arrhythmia.


  For a sudden unusually fast pulse with chest pain, breathlessness, dizziness or fainting, seek emergency help
  rather than waiting for another notification. The [American Heart Association''s heart-rate guidance](https://www.heart.org/en/health-topics/high-blood-pressure/the-facts-about-high-blood-pressure/all-about-heart-rate-pulse)
  explains why symptoms matter. Repeated or concerning notifications warrant clinical discussion; choose treatment
  and alert settings with appropriate advice rather than using counts alone.

  '
