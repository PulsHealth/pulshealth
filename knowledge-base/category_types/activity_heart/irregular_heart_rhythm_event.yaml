description: '## What does an Irregular Heart Rhythm Event mean?

  This entry records an Apple Watch irregular-rhythm notification. It flags a pattern that may suggest atrial fibrillation
  (AFib), rather than confirming the condition. The HealthKit category code is **0 (`notApplicable`)**, not a rhythm
  score or severity level. [Apple''s type documentation](https://developer.apple.com/documentation/healthkit/hkcategorytypeidentifier/irregularheartrhythmevent)
  describes read-only samples created when notifications are produced.


  ## How often does the watch check?

  The feature samples intermittently, typically while you are still. Its opportunities vary with activity, so there
  is no fixed interval between alerts. It is not constantly screening for AFib. [Apple''s heart-notification guidance](https://support.apple.com/en-us/120276)
  explains these limitations and recommends medical discussion after an alert.


  | Record or pattern | Appropriate interpretation |

  |---|---|

  | Category sample present | A notification was saved |

  | Several alerts | Several recorded notifications, not a measured AFib duration |

  | Long gap between alerts | Unknown detection opportunities during the gap |

  | No alerts | AFib and other rhythm problems are not excluded |


  The notification feature is intended for eligible adults without a previous AFib diagnosis. Region, software and
  setup affect availability. AFib History is a separate feature for diagnosed users and is not enabled simultaneously
  with these notifications.


  ## What could the example database establish?

  No irregular-rhythm events were present in the October 2025–September 2026 window. There was therefore no event-code
  distribution, interval duration, notification cadence, sleep/workout pattern or event-neighbor comparison to publish.
  Missing notifications cannot establish absence of AFib. The database also lacked the detection-attempt and notification-setting
  histories needed to calculate sensitivity or events per monitored hour.


  ## Why don’t notification counts measure time in AFib?

  Stillness favors opportunities to collect the readings used by the feature. Active workouts therefore have a different
  recording opportunity than resting periods, rather than simply a different medical event rate. An alert overlapping
  recorded sleep gives temporal context, not evidence that sleep caused the pattern.


  Do not interpret a stored start/end interval as time spent in AFib. Neither event counts nor sparse pulse readings
  can recover episode burden. [Atrial Fibrillation Burden](../HKQuantityTypeIdentifierAtrialFibrillationBurden/)
  answers a different question through a different feature.


  ## How does this differ from an ECG or heart-rate alert?

  [Heart Rate](../HKQuantityTypeIdentifierHeartRate/) measures pulse frequency. High/low heart-rate events concern
  chosen rate thresholds. An irregular-rhythm notification concerns a pulse pattern. An [ECG](https://support.apple.com/en-us/120278)
  records electrical activity during a separate measurement; timestamps alone do not prove it captured the same
  episode.


  A normal-looking recording at another time cannot rule out an intermittent problem. Save the notification history
  and discuss it with a clinician. A watch cannot detect a heart attack, and concerning symptoms need attention
  regardless of whether a notification appears. This follows [Apple''s instructions for responding to alerts](https://support.apple.com/en-us/120276).

  '
