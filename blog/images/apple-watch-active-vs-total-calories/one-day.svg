<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">One day, two time windows</title>
<desc id="desc">October 13, 2026. Daily energy is 2,245.1 resting plus 1,465.7 active, calculated as 3,710.8 kcal. A running workout is 629.6 active plus 101.5 resting, calculated as 731.1 kcal. The workout is already part of the day.</desc>
