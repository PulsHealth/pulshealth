<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">Same two hours, different exposure</title><desc id="desc">Two illustrative sessions. At 80 dB, two hours is 5% of 40 hours. At 90 dB, two hours is 50% of four hours.</desc><rect x="0" y="0" width="1600" height="840" rx="0" fill="#101e32"/><text x="80" y="76" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#79d6d3">PULSHEALTH / A WORKED EXAMPLE</text><text x="80" y="148" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" fill="#f5f0e6">Same two hours. Different exposure.</text><text x="80" y="204" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#aab9cc">Share of the matching WHO weekly reference duration</text><rect x="80" y="260" width="690" height="420" rx="20" fill="#192a42"/><text x="120" y="325" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#aab9cc">TWO HOURS AT 80 dB</text><text x="120" y="443" font-family="Arial, Helvetica, sans-serif" font-size="114" font-weight="700" fill="#79d6d3">5%</text><text x="120" y="500" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#f5f0e6">2 hours ÷ 40 hours</text><rect x="120" y="548" width="610" height="38" rx="10" fill="#2b3c54"/><rect x="120" y="548" width="30.5" height="38" rx="10" fill="#79d6d3"/><text x="120" y="634" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#aab9cc">of the weekly reference</text><rect x="830" y="260" width="690" height="420" rx="20" fill="#192a42"/><text x="870" y="325" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#aab9cc">TWO HOURS AT 90 dB</text><text x="870" y="443" font-family="Arial, Helvetica, sans-serif" font-size="114" font-weight="700" fill="#f3bd75">50%</text><text x="870" y="500" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#f5f0e6">2 hours ÷ 4 hours</text><rect x="870" y="548" width="610" height="38" rx="10" fill="#2b3c54"/><rect x="870" y="548" width="305.0" height="38" rx="10" fill="#f3bd75"/><text x="870" y="634" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#aab9cc">of the weekly reference</text><text x="80" y="744" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#aab9cc">Illustrative constant-level sessions, not personal records.</text><text x="80" y="792" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#aab9cc">Arithmetic example only; this does not reproduce Apple’s notification calculation.</text></svg>