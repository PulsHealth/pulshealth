<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Louder sound, less listening time</title><desc id="desc">Weekly reference durations from WHO: 80 dB 40 hours; 85 dB 12 hours 30 minutes; 90 dB 4 hours; 95 dB 1 hour 15 minutes.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#101e32"/><text x="80" y="76" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#79d6d3">PULSHEALTH / READING YOUR DATA</text><text x="80" y="148" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#f5f0e6">Louder sound, less listening time</text><text x="80" y="204" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#aab9cc">WHO weekly reference durations • adult reference</text><text x="80" y="328" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#f5f0e6">80 dB</text><rect x="250" y="286" width="1040" height="56" rx="8" fill="#2b3c54"/><rect x="250" y="286" width="1040.0" height="56" rx="8" fill="#79d6d3"/><text x="250" y="380" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#79d6d3">40 hours</text><text x="80" y="462" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#f5f0e6">85 dB</text><rect x="250" y="420" width="1040" height="56" rx="8" fill="#2b3c54"/><rect x="250" y="420" width="325.0" height="56" rx="8" fill="#79d6d3"/><text x="250" y="514" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#79d6d3">12 hours 30 min</text><text x="80" y="596" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#f5f0e6">90 dB</text><rect x="250" y="554" width="1040" height="56" rx="8" fill="#2b3c54"/><rect x="250" y="554" width="104.0" height="56" rx="8" fill="#f3bd75"/><text x="250" y="648" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f3bd75">4 hours</text><text x="80" y="730" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#f5f0e6">95 dB</text><rect x="250" y="688" width="1040" height="56" rx="8" fill="#2b3c54"/><rect x="250" y="688" width="32.5" height="56" rx="8" fill="#f3bd75"/><text x="250" y="782" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f3bd75">1 hour 15 min</text><rect x="80" y="846" width="1440" height="2" rx="0" fill="#2b3c54"/><text x="80" y="902" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#aab9cc">One shared scale: bar length represents hours, starting at zero.</text><text x="80" y="950" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#aab9cc">Guidance values, not a personal safety guarantee. Source: WHO Safe listening Q&amp;A.</text></svg>