apiVersion: 1

policies:
  - orgId: 1
    receiver: puls-email
    group_by: [alertname]
    # Ingest is a single-writer pipeline: when it breaks, every rule that can
    # fire fires at once. Group them into one message rather than a burst.
    group_wait: 1m
    group_interval: 5m
    # A stalled sync stays stalled until someone acts. Re-send daily so the
    # alert doesn't scroll out of the inbox and get forgotten — which is the
    # exact failure mode of the 2026-08-13 outage.
    repeat_interval: 24h
