name: Validate PulsHealth iOS

# Always report stable required checks; select expensive tests inside the workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pulshealth-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select ios checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify check selection
        run: python3 -m unittest discover -s scripts -p 'test_ci_scope.py'
      - name: Select component checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_scope.py "$base" HEAD >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: Build and test iOS (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SDK the app has been tested against since 1.4.
          - runner: macos-26
            xcode: "26.5"
            os: "26.5"
          # The SDK store archives are built with since 1.6: the same Xcode
          # 27.0 (27A266a) the maintainer archives with. The xcode-27 image
          # is a public preview, arm64 only.
          - runner: xcode-27
            xcode: "27.0"
            os: "27.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test using an owned simulator
        env:
          IOS_VERSION: ${{ matrix.os }}
          ARTIFACTS: ${{ runner.temp }}/ios-results
        # Exercise Keychain acceptance in an ad-hoc signed simulator host.
        # No developer certificate, team or provisioning profile is needed.
        run: python3 scripts/test-ios.py --ios "$IOS_VERSION" --signed --download-runtime --artifacts "$ARTIFACTS"

      - name: Preserve simulator diagnostics and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-evidence-${{ matrix.xcode }}
          path: |
            ${{ runner.temp }}/ios-results/*.log
            ${{ runner.temp }}/ios-results/*.json
            ${{ runner.temp }}/ios-results/*.xcresult
          retention-days: 14
          if-no-files-found: warn

  result:
    name: iOS result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected component tests to pass
        env:
          SELECTION: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.selected }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$SELECTION" = success
          if [ "$SELECTED" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$SELECTED" = false
            test "$TEST_RESULT" = skipped
          fi
