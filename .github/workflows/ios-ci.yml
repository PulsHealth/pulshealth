name: Validate PulsHealth iOS

on:
  push:
    branches: [main]
    paths:
      - "PulsHealth/**"
      - "PulsHealthSync/**"
      # The package tests compare this file byte for byte with the catalog.
      - "docs/protocol/catalog.json"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "PulsHealth/**"
      - "PulsHealthSync/**"
      - "docs/protocol/catalog.json"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: pulshealth-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Test sync package
        working-directory: PulsHealthSync
        run: |
          xcodebuild test \
            -scheme PulsHealthSync \
            -destination 'platform=iOS Simulator,OS=26.5,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate the Xcode project
        # PulsHealth.xcodeproj is generated and gitignored: XcodeGen copies
        # DEVELOPMENT_TEAM from Config/Local.xcconfig into the pbxproj, so a
        # tracked project would leak the maintainer's Team ID on every
        # regeneration. project.yml's preGenCommand seeds Local.xcconfig from
        # the tracked example; the empty template is enough for the simulator.
        working-directory: PulsHealth
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and run app-hosted tests
        working-directory: PulsHealth
        run: |
          xcodebuild test \
            -scheme PulsHealth \
            -destination 'platform=iOS Simulator,OS=26.5,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
