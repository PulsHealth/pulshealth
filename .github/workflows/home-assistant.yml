name: Home Assistant integration

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/pulshealth/**'
      - 'integrations/homeassistant/**'
      - 'hacs.json'
      - '.github/workflows/home-assistant.yml'
  pull_request:
    paths:
      - 'custom_components/pulshealth/**'
      - 'integrations/homeassistant/**'
      - 'hacs.json'
      - '.github/workflows/home-assistant.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: integrations/homeassistant/requirements-test.txt
      - run: python -m pip install -r integrations/homeassistant/requirements-test.txt
      - run: ruff check custom_components/pulshealth integrations/homeassistant
      - run: ruff format --check custom_components/pulshealth integrations/homeassistant
      - run: pytest -q integrations/homeassistant/tests
