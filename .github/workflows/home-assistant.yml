name: Home Assistant integration

# Always report stable required checks; select expensive tests inside the workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pulshealth-ha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select ha checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.ha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify check selection
        run: python3 -m unittest discover -s scripts -p 'test_ci_scope.py'
      - name: Select component checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_scope.py "$base" HEAD >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: integrations/homeassistant/requirements-test.txt
      - run: python -m pip install -r integrations/homeassistant/requirements-test.txt
      - run: ruff check custom_components/pulshealth integrations/homeassistant
      - run: ruff format --check custom_components/pulshealth integrations/homeassistant
      - run: pytest -q integrations/homeassistant/tests

  result:
    name: Home Assistant result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected component tests to pass
        env:
          SELECTION: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.selected }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$SELECTION" = success
          if [ "$SELECTED" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$SELECTED" = false
            test "$TEST_RESULT" = skipped
          fi
