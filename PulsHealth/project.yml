name: PulsHealth
options:
  # Fixed by the App Store record, not a preference: the listing
  # (id6757657354) was created with bundle ID `com.pulsHealth.PulsHealth`, and
  # a bundle identifier is immutable once a record exists. This prefix is what
  # makes the app target come out as `com.pulsHealth.PulsHealth`, so an archive
  # built from this repository can update that listing. Forks must change it
  # (see TRADEMARK.md).
  bundleIdPrefix: com.pulsHealth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Signing is per-developer and untracked: Config/Local.xcconfig (gitignored)
  # carries DEVELOPMENT_TEAM. Seed it from the tracked example on a fresh clone
  # so generation never depends on a private file. XcodeGen runs this command
  # from the directory containing project.yml, before spec validation (2.43+).
  preGenCommand: "[ -f Config/Local.xcconfig ] || cp Config/Local.xcconfig.example Config/Local.xcconfig"
packages:
  PulsHealthSync:
    path: ../PulsHealthSync
targets:
  PulsHealth:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Privacy manifest (required-reason API declarations); must ship at the
      # bundle root, so it is a resource rather than a source.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PulsHealthSync
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    entitlements:
      path: PulsHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PulsHealth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: PulsHealth reads your health data to sync it to your personal self-hosted database.
        NSHealthUpdateUsageDescription: PulsHealth does not write health data.
        # Onboarding (and Settings → Server) can read the pairing QR code the
        # server prints instead of making the user type a URL, a token and a
        # UUID. Nothing else uses the camera and no frame is ever stored.
        NSCameraUsageDescription: Scan the pairing code shown by your PulsHealth server.
        # The server may live on the LAN (a NAS, a Raspberry Pi) — reachable over
        # plain http only with this ATS exception, which is scoped to local
        # hosts (unqualified names, *.local, private IP ranges) and leaves
        # every other connection HTTPS-only. Talking to such a host also
        # triggers the local-network permission prompt, hence the description.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: PulsHealth connects to the health server you configure, which may be on your local network.
        # Background task identifiers derive from the bundle ID (Xcode expands
        # build settings in Info.plist values), matching what
        # BackgroundSyncScheduler registers, so a fork with its own bundle ID
        # needs no edit here.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).healthsync.catchup
          - $(PRODUCT_BUNDLE_IDENTIFIER).backfill.*
        UIBackgroundModes:
          - processing
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Must exceed what is on the store — App Store Connect rejects an
        # upload whose build number is not higher than the last one accepted
        # for the same version train. The store holds 1.3 (build 13); see
        # docs/appstore/README.md § Release record, and bump both here before
        # every archive.
        CURRENT_PROJECT_VERSION: 14
        MARKETING_VERSION: 1.4
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
  # Hosted in the app so tests run with the HealthKit entitlement — required to
  # actually EXECUTE statistics queries (the aggregate function×type matrix).
  PulsHealthHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HostedTests
    dependencies:
      - target: PulsHealth
      - package: PulsHealthSync
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PulsHealth.app/PulsHealth
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: HostedTests/ExceptionCatcher.h
schemes:
  PulsHealth:
    build:
      targets:
        PulsHealth: all
        PulsHealthHostedTests: [test]
    run: {}
    test:
      targets:
        - PulsHealthHostedTests
