name: PulsHealth
options:
  bundleIdPrefix: com.puls
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Signing is per-developer and untracked: Config/Local.xcconfig (gitignored)
  # carries DEVELOPMENT_TEAM. Seed it from the tracked example on a fresh clone
  # so generation never depends on a private file. XcodeGen runs this command
  # from the directory containing project.yml, before spec validation (2.43+).
  preGenCommand: "[ -f Config/Local.xcconfig ] || cp Config/Local.xcconfig.example Config/Local.xcconfig"
packages:
  PulsHealthSync:
    path: ../PulsHealthSync
targets:
  PulsHealth:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Privacy manifest (required-reason API declarations); must ship at the
      # bundle root, so it is a resource rather than a source.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PulsHealthSync
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    entitlements:
      path: PulsHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PulsHealth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: PulsHealth reads your health data to sync it to your personal self-hosted database.
        NSHealthUpdateUsageDescription: PulsHealth does not write health data.
        # The server may live on the LAN (a NAS, a Raspberry Pi) — reachable over
        # plain http only with this ATS exception, which is scoped to local
        # hosts (unqualified names, *.local, private IP ranges) and leaves
        # every other connection HTTPS-only. Talking to such a host also
        # triggers the local-network permission prompt, hence the description.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: PulsHealth connects to the health server you configure, which may be on your local network.
        BGTaskSchedulerPermittedIdentifiers:
          - com.puls.healthsync.catchup
          - com.puls.PulsHealth.backfill.*
        UIBackgroundModes:
          - processing
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
  # Hosted in the app so tests run with the HealthKit entitlement — required to
  # actually EXECUTE statistics queries (the aggregate function×type matrix).
  PulsHealthHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HostedTests
    dependencies:
      - target: PulsHealth
      - package: PulsHealthSync
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PulsHealth.app/PulsHealth
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: HostedTests/ExceptionCatcher.h
schemes:
  PulsHealth:
    build:
      targets:
        PulsHealth: all
        PulsHealthHostedTests: [test]
    run: {}
    test:
      targets:
        - PulsHealthHostedTests
